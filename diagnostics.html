<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>快取診斷｜球員戰績圖片</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#172033;background:#f3f5f8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1320px;margin:auto;padding:24px}.head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}.head h1{margin:0;font-size:26px}.sub{color:#667085;font-size:13px}.actions{display:flex;gap:8px}.btn{border:1px solid #cbd5e1;background:#fff;padding:9px 13px;border-radius:10px;cursor:pointer;text-decoration:none;color:inherit}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:14px 0}.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:14px}.card b{display:block;font-size:22px;margin-top:5px}.ok{color:#067647}.warning{color:#b54708}.error{color:#b42318}.section{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin-top:14px;overflow:auto}.section h2{font-size:17px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}.mini{padding:10px;border:1px solid #e2e8f0;border-radius:10px}table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}th,td{text-align:left;border-bottom:1px solid #edf0f4;padding:9px 8px}th{color:#475467;background:#f8fafc;position:sticky;top:0}.muted{color:#98a2b3}.err{color:#b42318;max-width:340px;white-space:normal}.pill{display:inline-block;padding:3px 8px;border-radius:99px;background:#eef2f6;font-size:12px}.issue{padding:9px 10px;border-left:3px solid #f79009;background:#fffaeb;margin:6px 0;border-radius:6px}.issue.error{border-color:#f04438;background:#fef3f2;color:#b42318}@media(max-width:700px){.wrap{padding:14px}.head{align-items:flex-start;flex-direction:column}table{font-size:12px}}
</style>
</head>
<body><main class="wrap">
<div class="head"><div><h1>CPBL 快取診斷</h1><div class="sub">v2.95｜單一 Publisher → Supabase published cache → 前端</div></div><div class="actions"><a class="btn" href="./">返回主程式</a><button id="refresh" class="btn">重新整理</button></div></div>
<div id="status" class="sub">讀取中…</div><div id="summary" class="cards"></div>
<section class="section"><h2>異常</h2><div id="issues"></div></section>
<section class="section"><h2>Scheduler</h2><div id="schedulers" class="grid"></div></section>
<section class="section"><h2>今日比賽快取</h2><table><thead><tr><th>軍別</th><th>比賽</th><th>狀態</th><th>Revision</th><th>Lineup 客/主</th><th>Plays</th><th>Snapshot</th><th>Published</th><th>下次刷新</th><th>錯誤</th></tr></thead><tbody id="games"></tbody></table></section>
</main><script>
const API='https://kjndnsztbcpmkhictjkr.supabase.co/functions/v1/cache-diagnostics';
const time=v=>v?new Date(v).toLocaleString('zh-TW',{hour12:false}):'—';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){document.querySelector('#status').textContent='讀取中…';try{const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:'{}',cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||`HTTP ${r.status}`);const games=d.games||[],issues=d.issues||[],complete=games.filter(g=>Number(g.awayLineup)>=9&&Number(g.homeLineup)>=9).length,live=games.filter(g=>['live','suspended'].includes(String(g.status))).length;document.querySelector('#status').innerHTML=`${esc(d.today)}｜產生時間 ${esc(time(d.generatedAt))}｜健康狀態 <b class="${esc(d.health)}">${esc(String(d.health).toUpperCase())}</b>`;document.querySelector('#summary').innerHTML=[['今日比賽',games.length],['進行中',live],['完整 Lineup',complete],['異常',issues.length]].map(x=>`<div class="card"><span class="sub">${esc(x[0])}</span><b>${esc(x[1])}</b></div>`).join('');document.querySelector('#issues').innerHTML=issues.length?issues.map(x=>`<div class="issue ${esc(x.level)}"><b>${esc(x.key)}</b>｜${esc(x.message)}</div>`).join(''):'<div class="muted">目前沒有偵測到異常。</div>';const sch=d.schedulers||{};document.querySelector('#schedulers').innerHTML=['major','minor'].map(k=>{const s=sch[k]||{};return `<div class="mini"><b>${k==='major'?'A/E/C Scheduler':'D Scheduler'}</b><div>上次賽程檢查：${esc(time(s.lastScheduleCheckAt))}</div><div>下次賽程檢查：${esc(time(s.nextScheduleCheckAt))}</div><div class="err">${esc(s.lastError||'')}</div></div>`}).join('');document.querySelector('#games').innerHTML=games.map(g=>`<tr><td><span class="pill">${esc(g.kindCode)}</span></td><td>${esc(g.away)} vs ${esc(g.home)}<div class="muted">#${esc(g.gameId)}</div></td><td>${esc(g.status)}</td><td>${esc(g.publishedRevision)}</td><td>${esc(g.awayLineup)} / ${esc(g.homeLineup)}</td><td>${esc(g.plays)}</td><td>${esc(g.snapshots)}</td><td>${esc(time(g.publishedAt))}</td><td>${esc(time(g.nextRefreshAt))}</td><td class="err">${esc(g.lastError||'')}</td></tr>`).join('')||'<tr><td colspan="10" class="muted">今日沒有快取比賽。</td></tr>';}catch(e){document.querySelector('#status').innerHTML=`<span class="error">讀取失敗：${esc(e.message||e)}</span>`;}}
document.querySelector('#refresh').addEventListener('click',load);load();setInterval(()=>{if(document.visibilityState==='visible')load()},30000);
</script></body></html>
