<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="app-version" content="v4.29" />
  <title>球員戰績圖片</title>
  <meta name="theme-color" content="#1f4e79" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="球員戰績" />
  <link rel="manifest" href="./manifest.webmanifest?v=v4.29" />
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png?v=v4.29" />
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png?v=v4.29" />
  <link rel="apple-touch-icon" href="./icon-192.png?v=v4.29" />
  <script>
    (() => {
      try {
        const theme = localStorage.getItem('baseball-app-theme-v1') === 'dark' ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        const themeMeta = document.querySelector('meta[name="theme-color"]');
        if (themeMeta) themeMeta.setAttribute('content', theme === 'dark' ? '#0b0b0c' : '#1f4e79');
      } catch {}
    })();
  </script>
    <script src="./diagnostic-runtime.js?v=v4.29"></script>
  <link rel="stylesheet" href="./styles.css?v=v4.29" />
  <link rel="stylesheet" href="./game-detail-enhancement.css?v=v4.29" />
  <link rel="stylesheet" href="./report-layout.css?v=v4.29" />
  <link rel="stylesheet" href="./landscape-state.css?v=v4.29" />
  <link rel="stylesheet" href="./postseason-history.css?v=v4.29" />
  <link rel="stylesheet" href="./dark-theme-overrides.css?v=v4.29" />
</head>
<body>
  <div id="appUpdateOverlay" class="sync-progress-overlay app-update-overlay" role="status" aria-live="polite" aria-busy="true">
    <div id="appUpdateCard" class="sync-progress-card app-splash">
      <div class="app-splash-mark" aria-hidden="true">
        <div class="app-splash-ball"></div>
      </div>
      <div class="app-splash-kicker">BASEBALL REPORT</div>
      <h1 class="app-splash-title">球員戰績圖片</h1>
      <div class="app-splash-subtitle">PLAYER PERFORMANCE REPORT</div>

      <div class="app-splash-progress">
        <div class="sync-progress-top">
          <div class="sync-progress-title">啟動中</div>
          <div id="appUpdatePercent" class="sync-progress-percent">0%</div>
        </div>
        <div id="appUpdateStatus" class="sync-progress-status">準備中…</div>
        <div class="sync-progress-track" aria-hidden="true">
          <div id="appUpdateBar" class="sync-progress-bar"></div>
        </div>
        <div id="appSplashVersion" class="app-splash-version">VERSION</div>
        <div id="startupEmergencyDiagnostics" style="margin-top:14px;text-align:center;position:relative;z-index:2147483647">
          <a href="./diagnostics.html?source=startup" style="display:inline-block;padding:8px 12px;border:1px solid rgba(255,255,255,.55);border-radius:10px;color:inherit;text-decoration:none;font-size:13px;background:rgba(255,255,255,.10)">啟動異常？開啟診斷</a>
        </div>
      </div>
    </div>
  </div>

  <main class="app">
    <div class="title-row">
      <div class="title-row-main">
        <h1>球員戰績圖片</h1>
        <div id="pageSubtitle" class="subtle">首頁</div>
      </div>
      <div class="title-row-right">
        <div id="selectedPlayerText" class="subtle"></div>
        <div id="homeHeaderDateControl" class="title-date-control" aria-label="日期">
          <button id="gameDateButton" class="app-picker-trigger date-picker-trigger" type="button" aria-haspopup="dialog" aria-controls="datePickerDialog">
            <span id="gameDateButtonText" class="app-picker-trigger-label">選擇日期</span>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="4" y="5.5" width="16" height="14.5" rx="2.5" stroke="currentColor" stroke-width="1.9"/>
              <path d="M8 3.5v4M16 3.5v4M4 9.5h16" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
            </svg>
          </button>
          <input id="gameDate" class="app-picker-native" type="date" tabindex="-1" aria-hidden="true" />
        </div>
        <div id="playerPageDate" class="title-row-date"></div>
      </div>
    </div>

    <section id="homePage">
      <div class="home-layout">
        <aside class="home-sidebar">
          <section class="panel home-background-panel">
            <div class="home-card-title">
              <h2>背景</h2>
              <span>點選切換</span>
            </div>
            <div id="homeTemplateGrid" class="template-grid home-template-grid"></div>
          </section>

          <section id="homeTimeZonePanel" class="panel home-time-zone-panel" aria-label="各聯盟時間">
            <div class="home-time-zone-head">
              <h2>各地時間</h2>
              <span>點擊切換聯盟</span>
            </div>
            <div class="home-time-zone-list">
              <button class="home-time-zone-card" type="button" data-time-zone-key="TW" aria-label="切換到台灣中職">
                <span class="home-time-zone-meta"><strong>台灣</strong><span id="homeTimeDateTW"></span></span>
                <time id="homeTimeTW">--:--</time>
              </button>
              <button class="home-time-zone-card" type="button" data-time-zone-key="JP_KR" aria-label="切換到日本職棒">
                <span class="home-time-zone-meta"><strong>日韓</strong><span id="homeTimeDateJPKR"></span></span>
                <time id="homeTimeJPKR">--:--</time>
              </button>
              <button class="home-time-zone-card" type="button" data-time-zone-key="US" aria-label="切換到美國大聯盟">
                <span class="home-time-zone-meta"><strong>紐約</strong><span id="homeTimeDateUS"></span></span>
                <time id="homeTimeUS">--:--</time>
              </button>
            </div>
          </section>
        </aside>

        <section class="panel home-main-panel">
          <div id="homeZoneSwitch" class="home-zone-switch home-root-switch" aria-label="資料分類">
            <button class="home-zone-btn active" type="button" data-home-root="pro">各國職棒</button>
            <button class="home-zone-btn" type="button" data-home-root="international">國際賽</button>
          </div>
          <div id="homeProCountrySwitch" class="home-pro-country-switch" aria-label="職棒國家">
            <button class="home-hierarchy-btn active" type="button" data-pro-country="TW">台灣</button>
            <button class="home-hierarchy-btn" type="button" data-pro-country="JP">日本</button>
            <button class="home-hierarchy-btn" type="button" data-pro-country="KR">韓國</button>
            <button class="home-hierarchy-btn" type="button" data-pro-country="US">美國</button>
          </div>
          <div id="homeUsLeagueSwitch" class="home-us-league-switch hidden" aria-label="美國職棒聯盟">
            <button class="home-hierarchy-btn active" type="button" data-us-league="MLB">大聯盟 MLB</button>
            <button class="home-hierarchy-btn" type="button" data-us-league="MiLB">小聯盟 MiLB</button>
          </div>
          <div id="homeZoneNote" class="home-zone-note hidden"></div>
          <div id="homeDailyGames" class="home-daily-games" aria-live="polite"></div>
          <div class="home-player-head">
            <h2 id="homePlayerTitle">球員</h2>
            <span id="homePlayerCount"></span>
          </div>
          <div class="home-player-actions">
            <button id="addPlayerBtn" class="press-btn primary">新增球員</button>
            <button id="homeSearchPlayerBtn" class="press-btn">搜尋球員</button>
            <button id="allPlayersBtn" class="press-btn">展開全部</button>
          </div>

          <div id="homeSpecialFilters" class="home-special-filter-row hidden" aria-label="國外聯盟篩選"></div>
          <div id="homeInternationalExplorer" class="international-explorer hidden" aria-label="國際賽賽事瀏覽"></div>

          <div id="recentPlayers" class="home-player-grid"></div>
        </section>
      </div>
    </section>

    <section id="playerPage" class="hidden">
      <div id="syncProgressOverlay" class="sync-progress-overlay hidden" role="status" aria-live="polite" aria-busy="true">
        <div id="syncProgressCard" class="sync-progress-card">
          <div class="sync-progress-top">
            <div id="syncProgressTitle" class="sync-progress-title">正在同步資料</div>
            <div id="syncProgressPercent" class="sync-progress-percent">0%</div>
          </div>
          <div id="syncProgressStatus" class="sync-progress-status">準備中…</div>
          <div class="sync-progress-track" aria-hidden="true">
            <div id="syncProgressBar" class="sync-progress-bar"></div>
          </div>
        </div>
      </div>

      <div class="player-page-top">
        <div class="player-page-left">
          <button id="backHomeBtn" class="press-btn">← 返回首頁</button>
          <div id="playerLevelSwitch" class="level-switch" aria-label="一軍二軍切換">
            <button id="majorLevelBtn" class="level-btn active" type="button" data-level="A">一軍</button>
            <button id="minorLevelBtn" class="level-btn" type="button" data-level="D">二軍</button>
          </div>
          <div id="externalScopeBadge" class="external-scope-badge hidden"></div>
        </div>
        <div class="player-page-right">
          <button id="forceOfficialRefreshBtn" class="press-btn hidden" type="button">重新抓官方個人頁</button>
          <div class="season-field">
            <span>賽季</span>
            <button id="seasonSelectButton" class="app-picker-trigger season-picker-trigger" type="button" aria-haspopup="dialog" aria-controls="seasonPickerDialog">
              <span id="seasonSelectButtonText" class="app-picker-trigger-label">選擇賽季</span>
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="m7 9 5 5 5-5" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <select id="seasonSelect" class="app-picker-native" aria-label="賽季" tabindex="-1"></select>
          </div>
        </div>
      </div>

      <div class="toolbar player-page-tabs" aria-label="球員功能列">
        <button class="press-btn tab-btn active" data-tab="base">球員基礎設定</button>
        <button class="press-btn tab-btn hidden" data-tab="minor">二軍</button>
        <button class="press-btn tab-btn hidden" data-tab="secondary">其他成績</button>
        <button class="press-btn tab-btn hidden" data-tab="postseason">季後賽</button>
        <button class="press-btn tab-btn" data-tab="today">球員今日狀況</button>
        <button class="press-btn tab-btn" data-tab="photos">照片</button>
      </div>

      <div class="workspace">
        <section id="contentPanel" class="panel"></section>

        <aside class="panel canvas-wrap">
          <h2 id="canvasPreviewTitle">戰報預覽</h2>
          <canvas id="cardCanvas" width="1080" height="1080"></canvas>
          <div class="section-actions">
            <button id="downloadBtn" class="press-btn primary hidden">生成當天戰報</button>
            <button id="seasonReportBtn" class="press-btn primary hidden">輸出這個年度成績</button>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <button id="appVersionBadge" class="app-version-badge" type="button" aria-label="檢查應用程式更新" title="點一下檢查更新">v4.29</button>

  <dialog id="outputDialog">
    <div class="output-dialog-body">
      <div class="output-dialog-head">
        <button class="press-btn dialog-close output-close" type="button" aria-label="關閉">×</button>
        <div class="output-ready-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 3v11m0 0 4-4m-4 4-4-4M5 17v2h14v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h2 id="outputDialogTitle">圖片已準備完成</h2>
      </div>
      <div class="output-actions">
        <button id="downloadPreparedBtn" class="press-btn output-choice primary" type="button">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 4v10m0 0 4-4m-4 4-4-4M5 18v2h14v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span id="downloadPreparedLabel">下載圖片</span>
        </button>
        <button id="sharePreparedBtn" class="press-btn output-choice" type="button">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="18" cy="5" r="2.5" stroke="currentColor" stroke-width="2"/>
            <circle cx="6" cy="12" r="2.5" stroke="currentColor" stroke-width="2"/>
            <circle cx="18" cy="19" r="2.5" stroke="currentColor" stroke-width="2"/>
            <path d="M8.2 10.8 15.8 6.4M8.2 13.2l7.6 4.4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span id="sharePreparedLabel">分享圖片</span>
        </button>
        <button id="outputBackgroundBtn" class="press-btn output-choice" type="button">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3.5" y="4" width="17" height="16" rx="2.5" stroke="currentColor" stroke-width="2"/>
            <circle cx="8.5" cy="9" r="1.5" stroke="currentColor" stroke-width="2"/>
            <path d="m5.5 17 4.2-4.3 3.2 3 2.2-2.1 3.4 3.4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>背景選擇</span>
        </button>
      </div>
    </div>
  </dialog>

  <dialog id="quickTemplateDialog">
    <div class="dialog-body">
      <div class="dialog-head">
        <h2>背景選擇</h2>
        <button class="press-btn dialog-close" type="button" aria-label="關閉" title="關閉">×</button>
      </div>
      <div class="subtle" style="margin-bottom:12px">選擇後會用同一背景重新產生目前戰報；若當天同時有投打紀錄，兩張都會一起更新。</div>
      <div id="quickTemplateGrid" class="template-grid quick-template-grid"></div>
    </div>
  </dialog>

  <dialog id="addPlayerDialog">
    <div class="dialog-body">
      <div class="dialog-head">
        <h2>新增球員</h2>
        <button class="press-btn dialog-close" type="button" aria-label="關閉" title="關閉">×</button>
      </div>
      <div class="grid two">
        <label class="field new-player-name-field">球員名稱
          <input id="newPlayerName" type="text" maxlength="30" autocomplete="off" />
          <div id="newPlayerSuggestions" class="new-player-suggestions hidden" role="listbox" aria-label="球員搜尋建議"></div>
        </label>
        <label class="field">背號
          <input id="newPlayerNumber" type="text" maxlength="4" />
        </label>
        <label class="field">球員類型
          <select id="newPlayerType">
            <option value="pitcher">投手</option>
            <option value="hitter">野手</option>
          </select>
        </label>
      </div>

      <div id="newPlayerExternalFields" class="grid two hidden">
        <label class="field">專區
          <select id="newPlayerScope">
            <option value="cpbl">中職</option>
            <option value="overseas">國外聯盟</option>
          </select>
        </label>
        <label id="newPlayerCompetitionLabel" class="field">聯盟
          <select id="newPlayerCompetition"></select>
        </label>
        <label id="newPlayerTeamLabel" class="field">球隊
          <select id="newPlayerExternalTeam"></select>
        </label>
        <label id="newPlayerYearLabel" class="field">賽季
          <input id="newPlayerExternalYear" type="number" min="1900" max="2100" />
        </label>
      </div>
      <div id="newPlayerScopeHelp" class="subtle" style="margin-top:10px"></div>
      <div class="section-actions">
        <button id="saveNewPlayerBtn" class="press-btn primary">新增</button>
      </div>
    </div>
  </dialog>

  <dialog id="allPlayersDialog">
    <div class="dialog-body">
      <div class="dialog-head">
        <h2>全部球員</h2>
        <button class="press-btn dialog-close" type="button" aria-label="關閉" title="關閉">×</button>
      </div>
      <div class="all-player-filters">
        <div id="allCpblFilters" class="cpbl-filter-row"></div>
        <div id="allLevelFilters" class="home-special-filter-row"></div>
        <div id="allTeamFilters" class="home-special-filter-row"></div>
      </div>
      <div class="all-player-section">
        <h3>投手</h3>
        <div id="allPitchers" class="all-player-grid"></div>
      </div>
      <div class="all-player-section">
        <h3>野手</h3>
        <div id="allHitters" class="all-player-grid"></div>
      </div>
    </div>
  </dialog>

  <dialog id="filterChoiceDialog">
    <div class="dialog-body">
      <div class="dialog-head">
        <h2 id="filterChoiceTitle">選擇篩選</h2>
        <button id="filterChoiceCloseBtn" class="press-btn dialog-close" type="button" aria-label="關閉" title="關閉">×</button>
      </div>
      <div id="filterChoiceList" class="filter-choice-list"></div>
    </div>
  </dialog>

  <dialog id="seasonPickerDialog" class="filter-choice-dialog app-season-dialog" aria-labelledby="seasonPickerTitle">
    <div class="filter-choice-shell">
      <div class="filter-choice-head">
        <div>
          <span class="filter-choice-kicker">SEASON</span>
          <h2 id="seasonPickerTitle">選擇賽季</h2>
        </div>
        <button class="press-btn dialog-close filter-choice-close" type="button" aria-label="關閉" title="關閉">×</button>
      </div>
      <div id="seasonPickerList" class="filter-choice-list app-season-list" role="listbox"></div>
    </div>
  </dialog>

  <dialog id="datePickerDialog" class="filter-choice-dialog app-date-dialog" aria-labelledby="datePickerTitle">
    <div class="filter-choice-shell">
      <div class="filter-choice-head">
        <div>
          <span class="filter-choice-kicker">DATE</span>
          <h2 id="datePickerTitle">選擇日期</h2>
        </div>
        <button class="press-btn dialog-close filter-choice-close" type="button" aria-label="關閉" title="關閉">×</button>
      </div>
      <div id="datePickerBody" class="app-date-picker-body">
        <div class="app-date-monthbar">
          <button id="datePickerPrev" class="app-date-nav" type="button" aria-label="上個月">‹</button>
          <div class="app-date-heading">
            <button id="datePickerYearButton" class="app-date-year-trigger" type="button" aria-expanded="false">
              <span id="datePickerYearLabel"></span>
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m7 9 5 5 5-5" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div id="datePickerMonthLabel" class="app-date-month-label"></div>
          </div>
          <button id="datePickerNext" class="app-date-nav" type="button" aria-label="下個月">›</button>
        </div>
        <div id="datePickerYearGrid" class="app-date-year-grid hidden" role="listbox" aria-label="年份"></div>
        <div id="datePickerWeekdays" class="app-date-weekdays" aria-hidden="true">
          <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
        </div>
        <div id="datePickerGrid" class="app-date-grid" role="grid" aria-label="日期"></div>
        <div class="app-date-footer">
          <button id="datePickerToday" class="press-btn app-date-today" type="button">今天</button>
        </div>
      </div>
    </div>
  </dialog>

  <dialog id="deletePlayerDialog">
    <div class="dialog-body">
      <div class="dialog-head">
        <h2>刪除球員</h2>
        <button class="press-btn dialog-close" type="button" aria-label="關閉" title="關閉">×</button>
      </div>
      <div id="deletePlayerList" class="delete-player-list"></div>
    </div>
  </dialog>

  <dialog id="playerSearchDialog">
    <div class="dialog-body">
      <div class="dialog-head">
        <h2>搜尋球員</h2>
        <button class="press-btn dialog-close" type="button" aria-label="關閉" title="關閉">×</button>
      </div>
      <label class="field">搜尋
        <input id="playerSearchInput" type="search" autocomplete="off" placeholder="輸入球員姓名" />
      </label>
      <div id="playerSearchResults" class="player-search-results"></div>
    </div>
  </dialog>

  <dialog id="batchReportDialog">
    <div class="dialog-body batch-report-dialog-body">
      <div class="dialog-head">
        <h2>批次戰報</h2>
        <button class="press-btn dialog-close" type="button" aria-label="關閉" title="關閉">×</button>
      </div>
      <label class="field">日期
        <input id="batchReportDate" type="date" />
      </label>
      <div class="section-actions" style="margin-top:12px">
        <button id="batchReportSelectAllBtn" class="press-btn">全選</button>
        <button id="batchReportClearBtn" class="press-btn">取消全選</button>
      </div>
      <div id="batchReportList" class="batch-report-list" style="margin-top:12px"></div>
      <div class="section-actions" style="margin-top:14px">
        <button id="batchReportGenerateBtn" class="press-btn primary">生成已勾選戰報</button>
        <button id="batchReportDownloadAllBtn" class="press-btn hidden">全部下載</button>
      </div>
      <div id="batchReportProgress" class="batch-report-progress"></div>
      <div id="batchReportResults" class="batch-report-results"></div>
    </div>
  </dialog>


  <dialog id="appMessageDialog" data-tone="info">
    <div class="app-message-shell">
      <div class="app-message-head">
        <div id="appMessageIcon" class="app-message-icon" aria-hidden="true"></div>
        <h2 id="appMessageTitle" class="app-message-title">提示</h2>
        <button id="appMessageCloseBtn" class="press-btn app-message-close" type="button" aria-label="關閉" title="關閉">×</button>
      </div>
      <div id="appMessageText" class="app-message-text"></div>
      <label id="appMessageInputWrap" class="app-message-input-wrap hidden">
        <input id="appMessageInput" type="text" autocomplete="off" />
      </label>
      <div class="app-message-actions">
        <button id="appMessageCancelBtn" class="press-btn" type="button">取消</button>
        <button id="appMessageConfirmBtn" class="press-btn primary" type="button">確定</button>
      </div>
    </div>
  </dialog>
  <script src="./js/module-loader.js?v=v4.29"></script>
</body>
</html>
