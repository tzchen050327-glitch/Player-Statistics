name: Fix pregame win-loss display

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-pregame-winloss.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix win-loss and refresh assets
        run: |
          python3 -c "from pathlib import Path; import re; p=Path('js/11-home-international.js'); s=p.read_text(encoding='utf-8'); old=\"if (win || loss) out.push(['勝敗', ]);\"; new=\"if (win || loss) out.push(['勝敗', String(win || 0) + '-' + String(loss || 0)]);\"; assert old in s; p.write_text(s.replace(old,new,1),encoding='utf-8'); h=Path('index.html').read_text(encoding='utf-8'); Path('index.html').write_text(re.sub(r'v2\\.40-ui\\d+','v2.40-ui7',h),encoding='utf-8'); w=Path('service-worker.js').read_text(encoding='utf-8'); w=re.sub(r'baseball-player-card-pwa-v240-stable-\\d+','baseball-player-card-pwa-v240-stable-11',w); w=re.sub(r'v2\\.40-ui\\d+','v2.40-ui7',w); Path('service-worker.js').write_text(w,encoding='utf-8')"
          python3 scripts/build-app.py
          node --check app.js
          grep -Fq "String(win || 0) + '-' + String(loss || 0)" js/11-home-international.js
          grep -q 'v2.40-ui7' index.html
          grep -q 'stable-11' service-worker.js
      - name: Commit
        run: |
          git config user.name 'chatgpt-pregame'
          git config user.email 'actions@users.noreply.github.com'
          git add js/11-home-international.js app.js index.html service-worker.js
          git commit -m 'Fix pregame win-loss value'
          git push
