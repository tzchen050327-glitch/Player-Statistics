name: CPBL substitution lineup v3.21

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cpbl-substitution-lineup-v321.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch substitution-aware lineup rendering
        shell: python
        run: |
          import base64, json, re
          from pathlib import Path
          dec=lambda s: base64.b64decode(s).decode('utf-8')
          needle=dec('ICBmdW5jdGlvbiBsaW5ldXBFbnRyaWVzKGRldGFpbCwgc2lkZSkgewogICAgcmV0dXJuIHJhd1Jvc3RlcihkZXRhaWwsIHNpZGUpCiAgICAgIC5zb3J0KChhLGIpPT4oTnVtYmVyKGEub3JkZXIpfHw5OSktKE51bWJlcihiLm9yZGVyKXx8OTkpKQogICAgICAuc2xpY2UoMCw5KTsKICB9Cg==')
          insert_func=dec('')
          old_render=dec('')
          new_render=dec('')
          js=Path('game-detail-enhancement.js')
          text=js.read_text(encoding='utf-8')
          if 'function lineupDisplayEntries(detail, side)' not in text:
              if needle not in text: raise SystemExit('lineupEntries block not found')
              text=text.replace(needle,needle+insert_func,1)
          if old_render not in text: raise SystemExit('renderLineupPanel block not found')
          text=text.replace(old_render,new_render,1)
          js.write_text(text,encoding='utf-8')

          css=Path('game-detail-enhancement.css')
          c=css.read_text(encoding='utf-8')
          old_css='.gdx-landscape-lineup{flex:1;min-height:0;display:grid;grid-template-rows:26px repeat(9,minmax(0,1fr));padding:5px 6px 7px;gap:2px}'
          new_css='.gdx-landscape-lineup{flex:1;min-height:0;display:grid;grid-template-rows:26px;grid-auto-rows:minmax(34px,1fr);padding:5px 6px 7px;gap:2px;overflow-y:auto;scrollbar-width:thin}.gdx-lineup-row.is-substitute strong{padding-left:3px;color:#b9d8f7}.gdx-lineup-row.is-substitute{background:rgba(255,255,255,.025)}'
          if old_css not in c: raise SystemExit('lineup css not found')
          css.write_text(c.replace(old_css,new_css,1),encoding='utf-8')

          vp=Path('version.json'); data=json.loads(vp.read_text(encoding='utf-8')); oldv=data['version']
          m=re.fullmatch(r'v(\d+)\.(\d+)',oldv)
          if not m: raise SystemExit(oldv)
          newv=f'v{m.group(1)}.{int(m.group(2))+1}'; cache_tag=f'v{m.group(1)}{int(m.group(2))+1}'
          vp.write_text(json.dumps({'version':newv},ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          index=Path('index.html').read_text(encoding='utf-8')
          index=re.sub(r'(<meta\s+name="app-version"\s+content=")v\d+\.\d+("\s*/?>)',rf'\g<1>{newv}\2',index,count=1)
          index=re.sub(r'\?v=v\d+\.\d+',f'?v={newv}',index)
          index=re.sub(r'(id="appVersionBadge"[^>]*>)v\d+\.\d+(</button>)',rf'\g<1>{newv}\2',index,count=1)
          Path('index.html').write_text(index,encoding='utf-8')
          app=Path('app.js').read_text(encoding='utf-8')
          app=re.sub(r"const APP_VERSION = 'v\d+\.\d+';",f"const APP_VERSION = '{newv}';",app,count=1)
          app=re.sub(r'\?v=v\d+\.\d+',f'?v={newv}',app)
          Path('app.js').write_text(app,encoding='utf-8')
          sw=Path('service-worker.js').read_text(encoding='utf-8')
          sw=re.sub(r'\?v=v\d+\.\d+',f'?v={newv}',sw)
          sw=re.sub(r"const CACHE_NAME = '[^']+';",f"const CACHE_NAME = 'baseball-player-card-pwa-{cache_tag}-auto';",sw,count=1)
          Path('service-worker.js').write_text(sw,encoding='utf-8')
          print(oldv,'->',newv)

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game-detail-enhancement.js game-detail-enhancement.css version.json index.html app.js service-worker.js
          git commit -m "Fix CPBL substitutions in lineup table [skip version bump]" || exit 0
          git push
