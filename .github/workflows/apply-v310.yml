name: Apply v3.10 MLB timezone cache fix

on:
  push:
    paths:
      - '.github/workflows/apply-v310.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v3.10 patch
        run: python .github/scripts/apply_v310.py
      - name: Syntax checks
        run: |
          node --check app.js
          node --check cpbl-realtime.js
          node --check npb-realtime.js
          node --check game-detail-enhancement.js
          node --check landscape-state.js
          node --check postseason-history.js
          node --check .github/scripts/smoke_v310.mjs
      - name: Verify release wiring
        run: |
          grep -q '"version":"v3.10"' version.json
          test ! -e .github/scripts/apply_v308.py
          test ! -e .github/scripts/smoke_v308.mjs
          test ! -e .github/workflows/apply-v308.yml
          test -e .github/scripts/apply_v309.py
          test -e .github/scripts/smoke_v309.mjs
          test -e .github/workflows/apply-v309.yml
      - name: Production integration smoke
        run: node .github/scripts/smoke_v310.mjs
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v3.10 fix MLB cross-timezone schedule cache" || exit 0
          git push
