name: Apply v2.07 last appearance fix

on:
  push:
    branches: [fix-last-appearance-v2.07]
    paths:
      - '.github/workflows/apply-v207-last-appearance.yml'

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-last-appearance-v2.07
      - name: Apply frontend patch and build
        run: python3 scripts/patch-v207-last-appearance.py
      - name: Syntax check generated bundle and modules
        run: |
          node --check app.js
          while IFS= read -r f; do
            [ -z "$f" ] || node --check "js/$f"
          done < js/module-order.txt
      - name: Smoke test US and CPBL previous appearance APIs
        run: |
          python3 - <<'PY'
          import json, re, urllib.request
          from pathlib import Path

          cfg = Path('js/00-core-config.js').read_text(encoding='utf-8')
          def grab(name):
              m = re.search(r"const\s+"+re.escape(name)+r"\s*=\s*'([^']+)'", cfg)
              if not m: raise SystemExit('missing '+name)
              return m.group(1)
          app_key = grab('CPBL_APP_KEY')
          anon_key = grab('CPBL_ANON_KEY')
          cpbl_url = grab('CPBL_API_URL')
          baseball_url = grab('BASEBALL_API_URL')

          def post(url, body, timeout=110):
              payload = dict(body, appKey=app_key, anonKey=anon_key)
              req = urllib.request.Request(url, data=json.dumps(payload).encode(), headers={'content-type':'text/plain;charset=UTF-8'}, method='POST')
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  data = json.loads(r.read().decode())
              if not data.get('ok'):
                  raise SystemExit(f'API error: {data}')
              return data

          us = post(baseball_url, {'action':'last-appearance','provider':'US','id':'660271','date':'2026-09-10'})
          last = us.get('lastAppearance')
          if not last or not last.get('date') or last['date'] >= '2026-09-10':
              raise SystemExit(f'Ohtani last appearance failed: {us}')
          print('US last appearance OK:', last.get('date'), last.get('leagueLevel'), last.get('opponent',''))

          cpbl = post(cpbl_url, {'action':'last-appearance','acnt':'0000001804','date':'2026-09-10','teamCode':'ADD'})
          last = cpbl.get('lastAppearance')
          if not last or not last.get('date') or last['date'] >= '2026-09-10':
              raise SystemExit(f'CPBL last appearance failed: {cpbl}')
          print('CPBL last appearance OK:', last.get('date'), last.get('leagueLevel'), last.get('opponent',''))
          PY
      - name: Commit v2.07
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js index.html 'index v2.07.html' service-worker.js js/00-core-config.js js/06-provider-cpbl.js
          git commit -m 'v2.07 add CPBL and MLB previous appearance lookup'
          git push origin HEAD:fix-last-appearance-v2.07
