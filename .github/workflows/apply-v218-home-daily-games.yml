name: Apply v2.18 homepage daily games

on:
  push:
    branches: [feature-v2.18-home-daily-games]
    paths:
      - 'scripts/patch-v218-home-daily-games.py'
      - '.github/workflows/apply-v218-home-daily-games.yml'

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v2.18 patch
        run: python3 scripts/patch-v218-home-daily-games.py

      - name: Validate homepage daily games wiring
        run: |
          grep -Fq "const APP_VERSION = 'v2.18'" js/00-core-config.js
          grep -Fq "LEAGUE_GAMES_API_URL" js/00-core-config.js
          grep -Fq "homeDailyGames: document.getElementById('homeDailyGames')" js/00-core-config.js
          grep -Fq "id=\"homeDailyGames\"" index.html
          grep -Fq "function renderHomeDailyGames" js/11-home-international.js
          grep -Fq "homeProCountry === 'US') return 'MLB'" js/11-home-international.js
          grep -Fq "home-games-scroller" js/11-home-international.js
          grep -Fq "renderHomeDailyGames({ force:true })" js/19-forms-events.js
          grep -Fq "v2.18 homepage daily league games" styles.css
          grep -Fq "./app.js?v=v2.18" index.html
          grep -Fq "baseball-player-card-pwa-v135" service-worker.js
          test -f 'index v2.18.html'
          test -f 'index v2.17.html'
          test ! -f 'index v2.16.html'

      - name: Verify league daily games API
        run: |
          python3 - <<'PY'
          import json, re, subprocess
          source=open('js/00-core-config.js',encoding='utf-8').read()
          url=re.search(r"const LEAGUE_GAMES_API_URL = '([^']+)'",source).group(1)
          key=re.search(r"const CPBL_APP_KEY = '([^']+)'",source).group(1)
          probes=[('CPBL','2026-09-11'),('NPB','2026-09-12'),('KBO','2026-09-12'),('MLB','2026-09-11')]
          for league,date in probes:
            payload=json.dumps({'appKey':key,'action':'daily-games','league':league,'date':date})
            raw=subprocess.check_output(['curl','-fsS','--retry','2','--retry-delay','1',url,'-H','content-type: application/json','--data',payload],text=True)
            data=json.loads(raw)
            assert data.get('ok') is True, (league,data)
            assert data.get('league') == league, (league,data)
            assert isinstance(data.get('games'),list), (league,data)
            for game in data['games']:
              assert {'away','home','status','time','venue','id'} <= set(game), (league,game)
            print(league,date,'games=',len(data['games']))
          PY

      - name: Syntax and deterministic build
        run: |
          for f in js/[0-9][0-9]-*.js; do node --check "$f"; done
          node --check app.js
          cp app.js /tmp/app-committed.js
          python3 scripts/build-app.py
          cmp -s /tmp/app-committed.js app.js

      - name: Chrome smoke test
        run: |
          python3 -m http.server 8765 >/tmp/player-stats-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo 'Chrome not preinstalled; static checks passed.'
            exit 0
          fi
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=9000 --dump-dom http://127.0.0.1:8765/index.html >/tmp/dom.html
          grep -Fq 'id="homePage"' /tmp/dom.html
          grep -Fq 'id="homeDailyGames"' /tmp/dom.html
          grep -Fq 'id="cardCanvas"' /tmp/dom.html
          grep -Fq 'content="v2.18"' /tmp/dom.html

      - name: Commit v2.18
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html 'index v2.18.html' js/00-core-config.js js/11-home-international.js js/19-forms-events.js styles.css service-worker.js
          if [ -f 'index v2.16.html' ]; then git rm -f 'index v2.16.html'; fi
          git commit -m 'v2.18 add daily league games to homepage'
          git push origin HEAD:feature-v2.18-home-daily-games
