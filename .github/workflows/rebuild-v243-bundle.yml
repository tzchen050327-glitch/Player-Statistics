name: Rebuild v2.43 app bundle

on:
  push:
    branches: [main]
    paths:
      - 'js/00-core-config.js'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build bundle
        run: |
          python3 scripts/build-app.py
          cp app.js app-v243.js
          node --check app.js
          node --check app-v243.js
      - name: Commit bundle
        run: |
          git config user.name 'chatgpt-bundle'
          git config user.email 'actions@users.noreply.github.com'
          git add app.js app-v243.js
          git commit -m 'Build immutable v2.43 app bundle'
          git push
