name: Landscape scoreboard v2.49

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/landscape-scoreboard-v249.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch landscape scoreboard
        run: |
          python3 .github/tmp-landscape-v249.py
          python3 scripts/build-app.py
          node --check app.js
          node --check game-detail-enhancement.js
          grep -Fq 'renderLandscapeBoard(detail, board)' game-detail-enhancement.js
          grep -Fq 'LANDSCAPE STADIUM BOARD v2.49' game-detail-enhancement.css
          grep -Fq "const APP_VERSION = 'v2.49';" app.js
          grep -Fq 'baseball-player-card-pwa-v249-stable-1' service-worker.js
          git diff --check
      - name: Commit v2.49
        run: |
          git config user.name 'chatgpt-release'
          git config user.email 'actions@users.noreply.github.com'
          git add game-detail-enhancement.js game-detail-enhancement.css js/00-core-config.js app.js index.html manifest.webmanifest service-worker.js version.json
          git commit -m 'Add landscape stadium scoreboard and release v2.49'
          git pull --rebase origin main
          git push
