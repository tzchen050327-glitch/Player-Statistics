name: Apply v2.67 CSS boundary fix
on:
  push:
    paths:
      - '.github/v267-css-boundary-fix-trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix CSS literal newline boundaries and sync v2.67
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('game-detail-enhancement.css')
          s = p.read_text(encoding='utf-8')
          s = s.replace('\\n', '\n')
          p.write_text(s, encoding='utf-8')

          files = [
              'app.js','index.html','service-worker.js','game-detail-enhancement.js',
              'game-detail-enhancement.css','report-layout.js','report-layout.css',
              'cpbl-realtime.js','live-static-update.js','cpbl-cache-router.js',
              'landscape-state.js','landscape-state.css','manifest.webmanifest',
              'rescue.html','styles.css'
          ]
          for name in files:
              p = Path(name)
              if not p.exists():
                  continue
              t = p.read_text(encoding='utf-8')
              t = t.replace('v2.66','v2.67').replace('v266','v267').replace('V266','V267')
              t = t.replace('pwa-v266','pwa-v267')
              p.write_text(t, encoding='utf-8')
          Path('version.json').write_text('{"version":"v2.67"}\n', encoding='utf-8')
          PY
      - name: Verify v2.67
        shell: bash
        run: |
          node --check app.js
          node --check game-detail-enhancement.js
          grep -q '"version":"v2.67"' version.json
          grep -q "APP_VERSION = 'v2.67'" app.js
          grep -q "baseball-player-card-pwa-v267" service-worker.js
          if grep -Fq '\n' game-detail-enhancement.css; then echo 'literal newline escape remains in CSS'; exit 1; fi
          grep -q 'v2.67 RUNNER LIVE INFO' game-detail-enhancement.css
      - name: Commit v2.67
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html service-worker.js game-detail-enhancement.js game-detail-enhancement.css report-layout.js report-layout.css cpbl-realtime.js live-static-update.js cpbl-cache-router.js landscape-state.js landscape-state.css manifest.webmanifest rescue.html styles.css version.json
          git commit -m 'Release v2.67 finalize runner live info layout'
          git push
