name: CPBL active lineup replace v3.22

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cpbl-active-lineup-replace-v322.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch active lineup rendering
        shell: python
        run: |
          import json, re
          from pathlib import Path

          js = Path('game-detail-enhancement.js')
          text = js.read_text(encoding='utf-8')

          pattern = re.compile(r'''  function renderLineupPanel\(detail,side\) \{\n.*?\n  \}\n\n  function currentPitcherInfo''', re.S)
          replacement = '''  function renderLineupPanel(detail,side) {
    const effective=effectiveCurrentBatter(detail);
    // lineups.*.batters is the canonical CURRENT nine-player batting order.
    // A pinch hitter / defensive replacement replaces that slot instead of
    // being appended below the player who left the game.
    const entries=lineupEntries(detail,side), current=compactName(effective?.fullName||effective?.name||effective?.playerName||'');
    const byOrder=new Map(entries.map((entry,index)=>[Number(entry?.order)||index+1,entry]));
    const rows=Array.from({length:9},(_,i)=>byOrder.get(i+1)||{order:i+1,number:'',name:'',avg:'',hits:'',homeRuns:'',rbi:''});
    return `<div class="gdx-landscape-lineup">${`<div class="gdx-lineup-head"><span>#</span><span>姓名</span><span>AVG</span><span>H</span><span>HR</span><span>RBI</span></div>`}${rows.map(e=>`<div class="gdx-lineup-row ${e.name&&samePlayerName(e.name,current)?'is-current':''}"><span>${esc(e.number||'—')}</span><strong>${esc(e.name||'—')}</strong><span>${esc(e.avg||'—')}</span><span>${esc(e.hits??'—')}</span><span>${esc(e.homeRuns??'—')}</span><span>${esc(e.rbi??'—')}</span></div>`).join('')}</div>`;
  }

  function currentPitcherInfo'''
          new_text, n = pattern.subn(replacement, text, count=1)
          if n != 1:
              raise SystemExit(f'renderLineupPanel patch count={n}')
          js.write_text(new_text, encoding='utf-8')

          vp=Path('version.json')
          data=json.loads(vp.read_text(encoding='utf-8'))
          oldv=data['version']
          m=re.fullmatch(r'v(\d+)\.(\d+)',oldv)
          if not m: raise SystemExit(oldv)
          newv=f'v{m.group(1)}.{int(m.group(2))+1}'
          cache_tag=f'v{m.group(1)}{int(m.group(2))+1}'
          vp.write_text(json.dumps({'version':newv},ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')

          index=Path('index.html').read_text(encoding='utf-8')
          index=re.sub(r'(<meta\s+name="app-version"\s+content=")v\d+\.\d+("\s*/?>)',rf'\g<1>{newv}\2',index,count=1)
          index=re.sub(r'\?v=v\d+\.\d+',f'?v={newv}',index)
          index=re.sub(r'(id="appVersionBadge"[^>]*>)v\d+\.\d+(</button>)',rf'\g<1>{newv}\2',index,count=1)
          Path('index.html').write_text(index,encoding='utf-8')

          app=Path('app.js').read_text(encoding='utf-8')
          app=re.sub(r"const APP_VERSION = 'v\d+\.\d+';",f"const APP_VERSION = '{newv}';",app,count=1)
          app=re.sub(r'\?v=v\d+\.\d+',f'?v={newv}',app)
          Path('app.js').write_text(app,encoding='utf-8')

          sw=Path('service-worker.js').read_text(encoding='utf-8')
          sw=re.sub(r'\?v=v\d+\.\d+',f'?v={newv}',sw)
          sw=re.sub(r"const CACHE_NAME = '[^']+';",f"const CACHE_NAME = 'baseball-player-card-pwa-{cache_tag}-auto';",sw,count=1)
          Path('service-worker.js').write_text(sw,encoding='utf-8')
          print(oldv,'->',newv)

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game-detail-enhancement.js version.json index.html app.js service-worker.js
          git commit -m "Show only active CPBL lineup replacements [skip version bump]" || exit 0
          git push
