name: Milestone NPB repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/milestones-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check requests beautifulsoup4
      - run: python scripts/build-milestones.py
      - name: Commit repaired snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/milestones.json
          git diff --cached --quiet && exit 0
          git commit -m "data: repair NPB milestones [skip version bump]"
          git pull --rebase origin main
          git push
