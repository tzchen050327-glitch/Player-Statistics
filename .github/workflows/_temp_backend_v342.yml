name: Temporary backend release v3.42

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_temp_backend_v342.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump visible app version
        shell: python
        run: |
          import json, re
          from pathlib import Path
          oldv='v3.41'; newv='v3.42'; cache_tag=newv.replace('.','')
          data=json.loads(Path('version.json').read_text(encoding='utf-8'))
          if data.get('version') != oldv: raise SystemExit(f"expected {oldv}, got {data.get('version')}")
          Path('version.json').write_text(json.dumps({'version':newv},ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          order=[x.strip() for x in Path('js/module-order.txt').read_text(encoding='utf-8').splitlines() if x.strip()]
          found=0
          for name in order:
            p=Path('js')/name
            s=p.read_text(encoding='utf-8')
            s,n=re.subn(r"const APP_VERSION = 'v\d+\.\d+';",f"const APP_VERSION = '{newv}';",s)
            found+=n
            s=re.sub(r'\?v=v\d+\.\d+',f'?v={newv}',s)
            p.write_text(s,encoding='utf-8')
          if found != 1: raise SystemExit(f'expected one APP_VERSION, found {found}')
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          s,n=re.subn(r'(<meta\s+name="app-version"\s+content=")v\d+\.\d+("\s*/?>)',rf'\g<1>{newv}\2',s,count=1)
          if not n: raise SystemExit('app-version meta not found')
          s=re.sub(r'\?v=v\d+\.\d+',f'?v={newv}',s)
          s=re.sub(r'(id="appVersionBadge"[^>]*>)v\d+\.\d+(</button>)',rf'\g<1>{newv}\2',s,count=1)
          p.write_text(s,encoding='utf-8')
          p=Path('service-worker.js'); s=p.read_text(encoding='utf-8')
          s=re.sub(r'\?v=v\d+\.\d+',f'?v={newv}',s)
          s=re.sub(r"const CACHE_NAME = '[^']+';",f"const CACHE_NAME = 'baseball-player-card-pwa-{cache_tag}-auto';",s,count=1)
          p.write_text(s,encoding='utf-8')
      - name: Build and verify
        run: |
          python3 scripts/build-app.py
          python3 scripts/build-app.py --check
          node --check app.js
      - name: Remove temporary workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_temp_backend_v342.yml
          git add version.json index.html service-worker.js app.js js
          git commit -m "Hydrate substitute hitter season stats v3.42 [skip version bump]"
          git push
