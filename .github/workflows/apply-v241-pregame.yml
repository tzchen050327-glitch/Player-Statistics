name: Apply v2.41 pregame fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v241-pregame.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          python3 .github/scripts/patch_v241_pregame.py
          python3 scripts/build-app.py
          node --check app.js
          grep -q "const APP_VERSION = 'v2.41'" js/00-core-config.js
          grep -q "npb-pregame-starters" js/00-core-config.js
          grep -q "NPB_PREGAME_STARTERS_API_URL" js/11-home-international.js
          grep -q 'grid-template-columns:repeat(2,minmax(0,1fr))' game-detail-enhancement.css
          grep -q 'v2.41-ui1' index.html
          grep -q 'baseball-player-card-pwa-v241-stable-1' service-worker.js
          git diff --check
      - name: Commit
        run: |
          git config user.name 'chatgpt-pregame'
          git config user.email 'actions@users.noreply.github.com'
          git add js/00-core-config.js js/11-home-international.js app.js game-detail-enhancement.css index.html service-worker.js
          git commit -m 'Fix NPB starter stats and bump v2.41'
          git push
