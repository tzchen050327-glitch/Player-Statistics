name: Validate canonical app source

on:
  push:
    branches: [main]
    paths:
      - 'js/**'
      - 'index.html'
      - 'service-worker.js'
      - 'version.json'
      - 'manifest.webmanifest'
      - 'game-detail-enhancement.js'
      - 'scripts/build-app.py'
      - '.github/workflows/auto-version-bump.yml'
      - '.github/workflows/validate-modular.yml'
  pull_request:
    paths:
      - 'js/**'
      - 'app.js'
      - 'index.html'
      - 'service-worker.js'
      - 'version.json'
      - 'manifest.webmanifest'
      - 'game-detail-enhancement.js'
      - 'scripts/build-app.py'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate modules and syntax
        shell: bash
        run: |
          test -s js/module-order.txt
          node --check js/module-loader.js
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            test -f "js/$f"
            node --check "js/$f"
          done < js/module-order.txt
          node --check service-worker.js
      - name: Validate version wiring and core guards
        shell: python
        run: |
          import json, re
          from pathlib import Path
          order = [line.strip() for line in Path('js/module-order.txt').read_text(encoding='utf-8').splitlines() if line.strip()]
          bundle = ''.join((Path('js') / name).read_text(encoding='utf-8') for name in order)
          html = Path('index.html').read_text(encoding='utf-8')
          sw = Path('service-worker.js').read_text(encoding='utf-8')
          loader = Path('js/module-loader.js').read_text(encoding='utf-8')
          v = json.loads(Path('version.json').read_text(encoding='utf-8'))['version']
          m = re.search(r"const APP_VERSION = '([^']+)';", bundle)
          assert m and m.group(1) == v
          assert f'<meta name="app-version" content="{v}" />' in html
          assert f'./js/module-loader.js?v={v}' in html
          assert './app.js?v=' not in html
          assert './app.js?v=' not in sw
          assert "const MODULE_ORDER_URL = './js/module-order.txt';" in sw
          assert './js/module-order.txt' in loader
          for needle in ['function setSyncUiLocked(locked)', 'async function importCpblDaily(player)', 'function seasonStatsForOutputRole(player, role)', 'bootApp();']:
              assert needle in bundle, f'missing guard: {needle}'
          enhancement = Path('game-detail-enhancement.js').read_text(encoding='utf-8')
          assert "if ((isCpbl || isNpb) && status==='live')" in enhancement, 'NPB portrait live missing'
          assert "const rows=isNpb ? [" in enhancement, 'NPB official pitcher decisions not rendered'
          assert "const decisionsHtml=renderGameDecisions(detail);" in enhancement, 'NPB decisions renderer disabled'
          assert "function cpblPassiveOutPreservedBases(detail,last)" in enhancement, 'CPBL runner rescue missing'
          assert "const preserved=cpblPassiveOutPreservedBases(detail,last);" in enhancement, 'CPBL runner rescue disabled'
          # CPBL live PA after-state: a caught fly at 2 outs must not erase a runner.
          import subprocess
          script = r"""
          const fs = require('fs');
          const vm = require('vm');
          const assert = require('assert/strict');
          const source = fs.readFileSync('game-detail-enhancement.js','utf8');
          const start = source.indexOf('  function cpblPassiveOutPreservedBases(detail,last) {');
          const end = source.indexOf('  function currentBaseState(detail) {', start);
          assert.ok(start !== -1 && end > start, 'base-preservation helper exists');
          const normalizeBaseState = value => {
            if (Array.isArray(value)) return {first:!!value[0],second:!!value[1],third:!!value[2]};
            const s=String(value||'');
            return {first:/一壘/.test(s),second:/二壘/.test(s),third:/三壘/.test(s)};
          };
          const context={
            normalizeBaseState,
            inferredOutsAfterPlay:play=>Number(play?.outsAfter??play?.outs??0),
            playMatchesCurrentHalf:(detail,play)=>detail.game?.inningLabel===String(play?.inning)+'局'+(play?.half==='bottom'?'下':'上')
          };
          const rescue=vm.runInNewContext(source.slice(start,end)+'\ncpblPassiveOutPreservedBases',context);
          const game={league:'CPBL',status:'live',game:{inningLabel:'4局下'}};
          const fly={inning:4,half:'bottom',result:'中飛',outs:'2',description:'打者-中外野手 飛球接殺出局。 2人出局。',baseStateBefore:[false,true,false],baseStateAfter:[false,false,false]};
          assert.deepEqual(Array.from(Object.values(rescue(game,fly))),[false,true,false],'二壘跑者 remains after caught fly');
          assert.equal(rescue(game,{...fly,outs:'3'}),null,'third out clears bases');
          assert.equal(rescue({...game,game:{inningLabel:'5局上'}},fly),null,'half inning changed');
          assert.equal(rescue(game,{...fly,result:'二壘安打'}),null,'hit is not a routine out');
          assert.equal(rescue(game,{...fly,description:'二壘跑者詹子賢出局。2人出局。'}),null,'explicit runner out');
          assert.equal(rescue(game,{...fly,baseStateBefore:[false,false,false]}),null,'no fabricated runner');
          assert.equal(rescue({...game,league:'NPB'},fly),null,'never change NPB rules');
          const inferStart=source.indexOf('  function inferredOutsAfterPlay(play, detail) {');
          const inferEnd=source.indexOf('  function playMatchesCurrentHalf(detail,play) {', inferStart);
          assert.ok(inferStart!==-1 && inferEnd>inferStart, 'context-aware outs function exists');
          const infer=vm.runInNewContext(source.slice(inferStart,inferEnd)+';inferredOutsAfterPlay', {
            parseOutNumber:value=>/^[0-3]$/.test(String(value??''))?Number(value):null
          });
          const flyAfter={outs:'2',result:'中飛',description:'打者中外野飛球接殺，2人出局。'};
          assert.equal(infer(flyAfter,{league:'CPBL',kindCode:'E'}),2,'postseason flyAfter at 2 outs is 2');
          assert.equal(infer({...flyAfter,outs:'3'},{league:'CPBL',kindCode:'E'}),3,'postseason third out');
          assert.equal(infer({outs:'1',result:'雙殺',description:'3人出局。'},{league:'CPBL',kindCode:'C'}),1,'postseason source outs authoritative');
          assert.equal(infer({outs:'2',result:'中飛',description:''},{league:'CPBL',kindCode:'A'}),3,'regular-season pre-PA outs unchanged');
          assert.equal(infer({outs:'1',result:'中飛',description:''},{league:'NPB'}),2,'NPB legacy inferred outs unchanged');
          // A completed PA in the previous half must not clear the CURRENT
          // half's official runner snapshot (8-bottom, 2 outs).
          const currentStart=source.indexOf('  function cpblNewHalfCurrent(detail,last){');
          const currentEnd=source.indexOf('  function currentBaseState(detail) {',currentStart);
          assert.ok(currentStart!==-1&&currentEnd>currentStart,'new-half snapshot guard');
          const newHalf=vm.runInNewContext(source.slice(currentStart,currentEnd)+';cpblNewHalfCurrent',{
            normalizeBaseState,
            compactName:value=>String(value||'').trim(),
            playMatchesCurrentHalf:context.playMatchesCurrentHalf
          });
          const current8={league:'CPBL',status:'live',game:{inningLabel:'8局下'},
            current:{outs:2,baseState:[true,false,true],runners:{first:'宋晟睿',second:'',third:'王威晨'}}};
          const oldHalf={inning:8,half:'top',outs:'3',result:'中飛'};
          const snap=newHalf(current8,oldHalf);
          assert.deepEqual(Array.from(snap.state),[true,false,true],'8-bottom base occupancy survives stale 8-top third out');
          assert.equal(snap.names.first,'宋晟睿');
          assert.equal(snap.names.third,'王威晨');
          assert.equal(newHalf(current8,{...oldHalf,half:'bottom'}),null,'same-half finished PA stays authoritative');
          assert.equal(newHalf({...current8,league:'NPB'},oldHalf),null,'NPB logic unaffected');
          // Requests begun before a Realtime update must not roll back it.
          const homeSource=fs.readFileSync('js/11-home-game-detail.js','utf8');
          const guardStart=homeSource.indexOf('    function homeCpblLiveProgress(detail) {');
          const guardEnd=homeSource.indexOf('    function homeGameDetailBudget() {',guardStart);
          assert.ok(guardStart!==-1&&guardEnd>guardStart,'in-flight CPBL progress guard exists');
          const liveGuard=vm.runInNewContext(homeSource.slice(guardStart,guardEnd)+';homeKeepNewerCpblLive');
          const mk=(inning,count,revision)=>({league:'CPBL',status:'live',kindCode:'E',
            game:{id:'4',kindCode:'E',inningLabel:inning},
            plays:Array.from({length:count},(_,i)=>({inning:i>=68?8:7,half:i>=68?'bottom':'top'})),
            _cpblPublishedRevision:revision});
          const newest=mk('8局下',73,142);
          assert.equal(liveGuard(mk('8局下',70,140),newest),newest,'do not replace 73 PAs with 70 PAs');
          assert.equal(liveGuard(mk('8局上',73,140),newest),newest,'do not roll back inning');
          assert.equal(liveGuard(mk('8局下',73,141),newest),newest,'do not roll back same-count revision');
          assert.notEqual(liveGuard(mk('8局下',74,143),newest),newest,'allow newer PA');
          // Same game, 9-top: PR 林祖傑 replaces 陳鏞基 at first base
          // before 陳聖平 finishes his PA; third-base 潘傑楷 stays put.
          const substitutionStart=source.indexOf('  function cpblResolveRunnerSubstitutions(detail,names) {');
          const substitutionEnd=source.indexOf('  function currentRunnerNames(detail) {', substitutionStart);
          assert.ok(substitutionStart>=0&&substitutionEnd>substitutionStart);
          const substituteResolver=vm.runInNewContext(
            source.slice(substitutionStart,substitutionEnd)+';cpblResolveRunnerSubstitutions',{
              compactName:value=>String(value||'').trim(),
              normName:value=>String(value||'').replace(/[・·.\\s]/g,'').toLowerCase(),
              samePlayerName:(a,b)=>String(a||'')===String(b||''),
              currentOffenseSide:detail=>/上/.test(detail.game?.inningLabel||'')?'away':'home'
            });
          const prRoster=[{name:'陳鏞基',position:'(1B)'},{name:'林祖傑',position:'(PR)'}];
          const prDetail={league:'CPBL',game:{inningLabel:'9局上'},
            lineups:{away:{roster:prRoster,batters:[{name:'林祖傑',position:'(PR)'}]}}};
          const namesAfter=substituteResolver(prDetail,{first:'陳鏞基',second:'',third:'潘傑楷'});
          assert.equal(namesAfter.first,'林祖傑','pinch runner replaces only the on-base original');
          assert.equal(namesAfter.third,'潘傑楷','unrelated third-base runner remains');
          const later=substituteResolver(prDetail,{first:'林泓弦',second:'陳聖平',third:''});
          assert.equal(later.first,'林泓弦','historical PR must not replace later first-base hitter');
          assert.equal(later.second,'陳聖平','unrelated second base remains');
          const barePr={...prDetail,lineups:{away:{batters:[{name:'林祖傑',position:'(PR)'}]}}};
          assert.equal(substituteResolver(barePr,{first:'林泓弦',second:'',third:''}).first,'林泓弦',
            'batting-nine PR tag alone must not invent substitution');
          const verified={...barePr,current:{runnerSubstitutions:[{base:'first',from:'陳鏞基',to:'林祖傑'}]}};
          assert.equal(substituteResolver(verified,{first:'陳鏞基',second:'',third:''}).first,'林祖傑',
            'backend verified substitution works without full roster');
          assert.equal(substituteResolver({...prDetail,league:'NPB'},{first:'陳鏞基'}).first,'陳鏞基',
            'NPB unchanged');
          console.log('CPBL base preservation regression tests passed');
          """
          subprocess.run(['node','-e',script],check=True)
          print('validated modular runtime', v)
