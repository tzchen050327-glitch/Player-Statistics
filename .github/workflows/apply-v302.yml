name: Apply v3.02 CPBL stale-current runners

on:
  push:
    paths:
      - '.github/workflows/apply-v302.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v3.02 patch
        run: python .github/scripts/apply_v302.py
      - name: Syntax checks
        run: |
          node --check app.js
          node --check cpbl-realtime.js
          node --check npb-realtime.js
          node --check game-detail-enhancement.js
          node --check landscape-state.js
          node --check postseason-history.js
          node --check .github/scripts/smoke_v302.mjs
      - name: Verify release wiring
        run: |
          grep -q '"version":"v3.02"' version.json
          grep -q 'shouldUseCpblLastAfter' game-detail-enhancement.js
          grep -q 'beforeKey!==afterKey && currentKey===beforeKey' game-detail-enhancement.js
          grep -q 'runnersAfter' game-detail-enhancement.js
          test ! -e .github/scripts/apply_v300.py
          test ! -e .github/scripts/smoke_v300.mjs
          test ! -e .github/workflows/apply-v300.yml
          test -e .github/scripts/apply_v301.py
          test -e .github/scripts/smoke_v301.mjs
          test -e .github/workflows/apply-v301.yml
      - name: Production integration smoke
        run: node .github/scripts/smoke_v302.mjs
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v3.02 fix CPBL stale live runner state" || exit 0
          git push
