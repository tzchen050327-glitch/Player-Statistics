name: Apply v2.83 NPB scoreboard scope fix

on:
  push:
    paths:
      - '.github/workflows/apply-v283.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python .github/scripts/apply_v283.py
      - name: Syntax check
        run: node --check app.js
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html service-worker.js version.json
          git commit -m "Release v2.83 fix NPB scoreboard competition scope" || exit 0
          git push
