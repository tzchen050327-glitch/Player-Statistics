name: Split v2.05 monolith

on:
  push:
    paths:
      - 'scripts/split-v2.05.py'

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Split current monolithic index
        run: python3 scripts/split-v2.05.py
      - name: Commit v2.05 split
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css app.js service-worker.js "index v2.04 monolith.html"
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "v2.05 split index into HTML CSS and JS"
          git push
