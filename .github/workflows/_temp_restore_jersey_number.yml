name: Temporary restore jersey number

on:
  push:
    paths:
      - '.github/workflows/_temp_restore_jersey_number.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore jersey number display only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('game-detail-enhancement.js')
          s = p.read_text(encoding='utf-8')
          old = "<span>${esc(e.order||'—')}</span><strong>${esc(e.name||'—')}</strong>"
          new = "<span>${esc(e.number||'—')}</span><strong>${esc(e.name||'—')}</strong>"
          if old not in s:
              raise SystemExit('target lineup display string not found')
          if s.count(old) != 1:
              raise SystemExit(f'unexpected target count: {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game-detail-enhancement.js
          git commit -m 'Restore jersey numbers in lineup display'
          git push
