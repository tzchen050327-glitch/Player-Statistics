name: Fix enhancement version override

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-enhancement-version.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch version source
        run: |
          python3 -c "from pathlib import Path; p=Path('game-detail-enhancement.js'); s=p.read_text(encoding='utf-8'); s=s.replace(\"const UI_VERSION = 'v2.40';\", \"const UI_VERSION = document.querySelector('meta[name=\\\"app-version\\\"]')?.getAttribute('content') || 'v2.42';\", 1); p.write_text(s,encoding='utf-8')"
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8').replace('game-detail-enhancement.js?v=v2.42-ui2','game-detail-enhancement.js?v=v2.42-ui3'); p.write_text(s,encoding='utf-8')"
          python3 -c "from pathlib import Path; p=Path('service-worker.js'); s=p.read_text(encoding='utf-8').replace('baseball-player-card-pwa-v242-stable-2','baseball-player-card-pwa-v242-stable-3').replace('game-detail-enhancement.js?v=v2.42-ui2','game-detail-enhancement.js?v=v2.42-ui3'); p.write_text(s,encoding='utf-8')"
          node --check game-detail-enhancement.js
          grep -q "meta\[name=\\\"app-version\\\"\]" game-detail-enhancement.js
          grep -q 'game-detail-enhancement.js?v=v2.42-ui3' index.html
          grep -q 'baseball-player-card-pwa-v242-stable-3' service-worker.js
          git diff --check
      - name: Commit
        run: |
          git config user.name 'chatgpt-version-fix'
          git config user.email 'actions@users.noreply.github.com'
          git add game-detail-enhancement.js index.html service-worker.js
          git commit -m 'Stop enhancement script from forcing v2.40'
          git push
