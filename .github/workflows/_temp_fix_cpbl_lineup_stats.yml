name: Temporary CPBL lineup stats hotfix

on:
  push:
    paths:
      - '.github/workflows/_temp_fix_cpbl_lineup_stats.yml'

permissions:
  contents: write

jobs:
  hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Patch CPBL lineup order and live batting totals
        shell: python
        run: |
          from pathlib import Path
          p = Path('game-detail-enhancement.js')
          text = p.read_text(encoding='utf-8')

          start = text.index('  function reconciledBattingStats(detail,entry) {')
          end = text.index('\n  function rawRoster(detail, side) {', start)
          new_func = r'''  function reconciledBattingStats(detail,entry) {
            const directAb=numericOrNull(entry?.ab??entry?.atBats);
            const directHits=numericOrNull(entry?.hits??entry?.h);
            const directHr=numericOrNull(entry?.homeRuns??entry?.hr);
            const directRbi=numericOrNull(entry?.rbi??entry?.rbis);
            const sourceAvg=safeCell(entry?.avg??entry?.average??entry?.battingAverage??'');

            const isCpbl=String(detail?.league||'').toUpperCase()==='CPBL';
            const status=String(detail?.status||'').toLowerCase();
            const gameAb=numericOrNull(entry?.gameAb);
            const gameHits=numericOrNull(entry?.gameHits);
            const gameHr=numericOrNull(entry?.gameHomeRuns);
            const gameRbi=numericOrNull(entry?.gameRbi);
            const pregameAb=numericOrNull(entry?.pregameAb);
            const pregameHits=numericOrNull(entry?.pregameHits);
            const pregameHr=numericOrNull(entry?.pregameHomeRuns);
            const pregameRbi=numericOrNull(entry?.pregameRbi);

            // During a CPBL game, the pregame snapshot + current game line is the
            // authoritative source.  This makes H/AVG/HR/RBI move immediately with
            // the live box instead of waiting for the season page to settle.
            if(isCpbl && ['live','suspended'].includes(status) && pregameAb!==null && pregameHits!==null){
              const ab=pregameAb+(gameAb??0);
              const hits=pregameHits+(gameHits??0);
              const homeRuns=(pregameHr??0)+(gameHr??0);
              const rbi=(pregameRbi??0)+(gameRbi??0);
              return {
                ab,
                avg:formatAverage(hits,ab,sourceAvg),
                hits,
                homeRuns,
                rbi,
                finalStatsReconciled:false
              };
            }

            if(!isCpbl||status!=='final'){
              return {
                ab:directAb,
                avg:sourceAvg,
                hits:directHits??0,
                homeRuns:directHr??0,
                rbi:directRbi??0,
                finalStatsReconciled:false
              };
            }

            // CPBL final payloads can revert season totals to the pregame snapshot while
            // preserving gameAb/gameHits/gameHomeRuns/gameRbi. Re-apply the game line so
            // the landscape lineup does not lose statistics after the game becomes final.
            // If explicit pregameAb exists and the season AB is already beyond it, assume
            // the source already incorporated the game and do not double-add.
            const shouldAddGame = gameAb!==null && (pregameAb===null || directAb===null || directAb<=pregameAb);
            if(!shouldAddGame){
              return {
                ab:directAb,
                avg:sourceAvg,
                hits:directHits??0,
                homeRuns:directHr??0,
                rbi:directRbi??0,
                finalStatsReconciled:false
              };
            }

            const ab=(directAb??0)+(gameAb??0);
            const hits=(directHits??0)+(gameHits??0);
            const homeRuns=(directHr??0)+(gameHr??0);
            const rbi=(directRbi??0)+(gameRbi??0);
            return {
              ab,
              avg:formatAverage(hits,ab,sourceAvg),
              hits,
              homeRuns,
              rbi,
              finalStatsReconciled:true
            };
          }
          '''
          text = text[:start] + new_func + text[end:]

          old = "<span>${esc(e.number||'—')}</span><strong>${esc(e.name||'—')}</strong>"
          new = "<span>${esc(e.order||'—')}</span><strong>${esc(e.name||'—')}</strong>"
          if text.count(old) != 1:
              raise SystemExit(f'expected one lineup number cell, found {text.count(old)}')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

      - name: Bump version to next release
        shell: python
        run: |
          import json, re
          from pathlib import Path
          data = json.loads(Path('version.json').read_text(encoding='utf-8'))
          old = str(data.get('version','')).strip()
          m = re.fullmatch(r'v(\d+)\.(\d+)', old)
          if not m: raise SystemExit(f'Unsupported version format: {old!r}')
          new = f'v{int(m.group(1))}.{int(m.group(2))+1}'
          cache_tag = new.replace('.', '')
          Path('version.json').write_text(json.dumps({'version':new},ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')

          order=[x.strip() for x in Path('js/module-order.txt').read_text(encoding='utf-8').splitlines() if x.strip()]
          found=0
          for name in order:
              p=Path('js')/name
              text=p.read_text(encoding='utf-8')
              text,n=re.subn(r"const APP_VERSION = 'v\d+\.\d+';",f"const APP_VERSION = '{new}';",text)
              found+=n
              text=re.sub(r'\?v=v\d+\.\d+',f'?v={new}',text)
              p.write_text(text,encoding='utf-8')
          if found!=1: raise SystemExit(f'expected one source APP_VERSION, found {found}')

          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          text,n=re.subn(r'(<meta\s+name="app-version"\s+content=")v\d+\.\d+("\s*/?>)',rf'\g<1>{new}\2',text,count=1)
          text=re.sub(r'\?v=v\d+\.\d+',f'?v={new}',text)
          text=re.sub(r'(id="appVersionBadge"[^>]*>)v\d+\.\d+(</button>)',rf'\g<1>{new}\2',text,count=1)
          if not n: raise SystemExit('app-version meta not found')
          p.write_text(text,encoding='utf-8')

          p=Path('service-worker.js')
          text=p.read_text(encoding='utf-8')
          text=re.sub(r'\?v=v\d+\.\d+',f'?v={new}',text)
          text=re.sub(r"const CACHE_NAME = '[^']+';",f"const CACHE_NAME = 'baseball-player-card-pwa-{cache_tag}-auto';",text,count=1)
          p.write_text(text,encoding='utf-8')
          print(f'{old} -> {new}')

      - name: Rebuild and validate
        run: |
          python3 scripts/build-app.py
          python3 scripts/build-app.py --check
          node --check app.js
          node --check game-detail-enhancement.js

      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/_temp_fix_cpbl_lineup_stats.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix CPBL lineup order and live batting totals [skip version bump]"
          git push
