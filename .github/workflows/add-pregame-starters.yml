name: Add pregame starter cards

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-pregame-starters.yml'

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch source and assets
        run: |
          python3 .github/scripts/add_pregame.py
          python3 scripts/build-app.py
          node --check app.js
          grep -q 'pregameStarterRequest' js/11-home-international.js
          grep -q 'PREGAME STARTER CARDS' game-detail-enhancement.css
          grep -q 'v2.40-ui5' index.html
          grep -q 'stable-9' service-worker.js
      - name: Commit changes
        run: |
          git config user.name 'chatgpt-pregame'
          git config user.email 'actions@users.noreply.github.com'
          git add js/11-home-international.js app.js game-detail-enhancement.css index.html service-worker.js
          git commit -m 'Show CPBL and NPB pregame starter info'
          git push
