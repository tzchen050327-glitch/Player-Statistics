name: Release v2.45
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-v245.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sed -i 's/v2\.44/v2.45/g' js/00-core-config.js index.html manifest.webmanifest game-detail-enhancement.js service-worker.js
          sed -i 's/v244/v245/g' service-worker.js
          printf '%s\n' '{"version":"v2.45"}' > version.json
          python3 scripts/build-app.py
          node --check app.js
          node --check game-detail-enhancement.js
          grep -Fq "const APP_VERSION = 'v2.45';" app.js
          grep -Fq './app.js?v=v2.45' index.html
          grep -Fq './app.js?v=v2.45' service-worker.js
          grep -Fq 'content="v2.45"' index.html
          git config user.name chatgpt-release
          git config user.email actions@users.noreply.github.com
          git add js/00-core-config.js app.js index.html manifest.webmanifest service-worker.js version.json game-detail-enhancement.js
          git commit -m 'Release v2.45'
          git push
