name: Apply v2.99 CPBL lineup bridge

on:
  push:
    paths:
      - '.github/workflows/apply-v299.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v2.99 patch
        run: python .github/scripts/apply_v299.py
      - name: Syntax checks
        run: |
          node --check app.js
          node --check cpbl-realtime.js
          node --check npb-realtime.js
          node --check game-detail-enhancement.js
          node --check landscape-state.js
          node --check postseason-history.js
          node --check .github/scripts/smoke_v299.mjs
      - name: Verify release wiring
        run: |
          grep -q '"version":"v2.99"' version.json
          grep -q "home-game-detail-state" app.js
          grep -q "home-game-detail-state" game-detail-enhancement.js
          test ! -e .github/scripts/apply_v297.py
          test ! -e .github/scripts/smoke_v297.mjs
          test ! -e .github/workflows/apply-v297.yml
          test -e .github/scripts/apply_v298.py
          test -e .github/scripts/smoke_v298.mjs
          test -e .github/workflows/apply-v298.yml
      - name: Production integration smoke
        run: node .github/scripts/smoke_v299.mjs
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v2.99 fix CPBL lineup rendering from published cache" || exit 0
          git push
