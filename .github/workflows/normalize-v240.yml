name: Normalize v2.40

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-v240.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize versions and restore game detail assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("const APP_VERSION = 'v2.33';", "const APP_VERSION = 'v2.40';", 1)
          s = s.replace('default-hitter.jpg?v=v2.33', 'default-hitter.jpg?v=v2.40')
          s = s.replace('default-pitcher.jpg?v=v2.33', 'default-pitcher.jpg?v=v2.40')
          p.write_text(s, encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<meta name="app-version" content="v2.33" />', '<meta name="app-version" content="v2.40" />', 1)
          s = s.replace('./styles.css?v=v2.33', './styles.css?v=v2.40')
          s = s.replace('>v2.31</button>', '>v2.40</button>')
          s = s.replace('./app.js?v=v2.33', './app.js?v=v2.40')
          if 'game-detail-enhancement.css' not in s:
              s = s.replace('</head>', '  <link rel="stylesheet" href="./game-detail-enhancement.css?v=v2.40" />\n</head>')
          if 'game-detail-enhancement.js' not in s:
              s = s.replace('</body>', '  <script src="./game-detail-enhancement.js?v=v2.40"></script>\n</body>')
          p.write_text(s, encoding='utf-8')
          PY

          cat > service-worker.js <<'EOF'
          const CACHE_NAME = 'baseball-player-card-pwa-v240-stable-1';
          const APP_SHELL = [
            './',
            './index.html',
            './styles.css?v=v2.40',
            './app.js?v=v2.40',
            './game-detail-enhancement.css?v=v2.40',
            './game-detail-enhancement.js?v=v2.40',
            './manifest.webmanifest',
            './icon-192.png',
            './icon-512.png'
          ];

          self.addEventListener('install', event => {
            self.skipWaiting();
            event.waitUntil((async () => {
              const cache = await caches.open(CACHE_NAME);
              await Promise.allSettled(APP_SHELL.map(async url => {
                try {
                  const response = await fetch(url, { cache: 'reload' });
                  if (response.ok) await cache.put(url, response.clone());
                } catch {}
              }));
            })());
          });

          self.addEventListener('activate', event => {
            event.waitUntil((async () => {
              const keys = await caches.keys();
              await Promise.all(keys.filter(key => key !== CACHE_NAME).map(key => caches.delete(key)));
              await self.clients.claim();
            })());
          });

          self.addEventListener('message', event => {
            if (event.data?.type === 'SKIP_WAITING') self.skipWaiting();
          });

          self.addEventListener('fetch', event => {
            if (event.request.method !== 'GET') return;

            const request = event.request;
            const url = new URL(request.url);
            const isCore = request.mode === 'navigate'
              || request.destination === 'document'
              || url.pathname.endsWith('/index.html')
              || url.pathname.endsWith('/app.js')
              || url.pathname.endsWith('/game-detail-enhancement.js');

            if (isCore) {
              event.respondWith((async () => {
                try {
                  const response = await fetch(request, { cache: 'no-store' });
                  if (response?.ok) {
                    const cache = await caches.open(CACHE_NAME);
                    cache.put(request, response.clone()).catch(() => {});
                  }
                  return response;
                } catch {
                  return await caches.match(request, { ignoreSearch: true })
                    || await caches.match('./index.html')
                    || Response.error();
                }
              })());
              return;
            }

            event.respondWith((async () => {
              const cached = await caches.match(request);
              if (cached) return cached;
              try {
                const response = await fetch(request);
                if (response?.ok && response.type !== 'opaque') {
                  caches.open(CACHE_NAME).then(cache => cache.put(request, response.clone()));
                }
                return response;
              } catch {
                return Response.error();
              }
            })());
          });
          EOF

      - name: Commit normalized v2.40
        shell: bash
        run: |
          git config user.name "chatgpt-fix"
          git config user.email "actions@users.noreply.github.com"
          git add app.js index.html service-worker.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Unify app version v2.40 and restore game detail UI"
          git push
