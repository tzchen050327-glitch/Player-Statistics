name: Apply v3.01 CPBL immediate runners

on:
  push:
    paths:
      - '.github/workflows/apply-v301.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fix v3.01 patch script bootstrap
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/apply_v301.py')
          lines=p.read_text(encoding='utf-8').splitlines()
          for i,line in enumerate(lines):
              if line.startswith("old_tail="):
                  lines[i] = "old_tail='<div class=\"gdx-pa-results\">${paHtml}</div></div></div></div>'; new_tail='<div class=\"gdx-pa-results\">${paHtml}</div></div>${prevHtml}</div></div>'"
                  break
          else:
              raise SystemExit('old_tail bootstrap line missing')
          p.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
      - name: Apply v3.01 patch
        run: python .github/scripts/apply_v301.py
      - name: Syntax checks
        run: |
          python -m py_compile .github/scripts/apply_v301.py
          node --check app.js
          node --check cpbl-realtime.js
          node --check npb-realtime.js
          node --check game-detail-enhancement.js
          node --check landscape-state.js
          node --check postseason-history.js
          node --check .github/scripts/smoke_v301.mjs
      - name: Verify release wiring
        run: |
          grep -q '"version":"v3.01"' version.json
          grep -q 'runnersAfter' game-detail-enhancement.js
          grep -q 'previousPlateAppearance' game-detail-enhancement.js
          grep -q 'gdx-live-previous-row' game-detail-enhancement.js
          test ! -e .github/scripts/apply_v299.py
          test ! -e .github/scripts/smoke_v299.mjs
          test ! -e .github/workflows/apply-v299.yml
          test -e .github/scripts/apply_v300.py
          test -e .github/scripts/smoke_v300.mjs
          test -e .github/workflows/apply-v300.yml
      - name: Production integration smoke
        run: node .github/scripts/smoke_v301.mjs
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v3.01 fix CPBL immediate runners and show previous batter" || exit 0
          git push
