name: Apply v2.33 CPBL pre-PA base state
on:
  push:
    branches: [feature-v2.33-cpbl-prepa-bases]
    paths:
      - 'scripts/patch-v233-cpbl-prepa-bases.py'
      - '.github/workflows/apply-v233-cpbl-prepa-bases.yml'
permissions:
  contents: write
jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-v2.33-cpbl-prepa-bases
          fetch-depth: 0
      - name: Apply v2.33 patch
        run: python3 scripts/patch-v233-cpbl-prepa-bases.py
      - name: Build bundle
        run: python3 scripts/build-app.py
      - name: Validate pre-PA display format
        run: |
          grep -q "壘有人" js/11-home-international.js
          grep -q "APP_VERSION = 'v2.33'" js/00-core-config.js
          grep -q "baseball-player-card-pwa-v150" service-worker.js
          test -f 'index v2.33.html'
      - name: Syntax and deterministic build
        run: |
          node --check app.js
          cp app.js /tmp/app-before.js
          python3 scripts/build-app.py
          cmp -s app.js /tmp/app-before.js
      - name: Chrome mobile smoke test
        run: |
          python3 -m http.server 8123 >/tmp/v233-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2
          google-chrome --headless=new --no-sandbox --disable-gpu --window-size=390,844 --dump-dom http://127.0.0.1:8123/index.html >/tmp/v233-dom.html
          grep -q '球員戰績圖片' /tmp/v233-dom.html
      - name: Commit v2.33
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/11-home-international.js js/00-core-config.js index.html 'index v2.33.html' service-worker.js app.js
          git commit -m 'v2.33 fix CPBL pre-PA base-state display'
          git push origin HEAD:feature-v2.33-cpbl-prepa-bases
