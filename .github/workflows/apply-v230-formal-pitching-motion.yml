name: Apply v2.30 formal pitching motion

on:
  push:
    branches: [feature-v2.30-formal-pitching-motion]
    paths:
      - 'scripts/patch-v230-formal-pitching-motion.py'
      - '.github/workflows/apply-v230-formal-pitching-motion.yml'

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v2.30 patch
        run: python3 scripts/patch-v230-formal-pitching-motion.py
      - name: Validate formal pitching motion
        run: |
          grep -Fq "const APP_VERSION = 'v2.30'" js/00-core-config.js
          grep -Fq 'battery-pitcher-formal' js/11-home-international.js
          grep -Fq 'battery-drive-leg' js/11-home-international.js
          grep -Fq 'battery-stride-leg' js/11-home-international.js
          grep -Fq 'battery-throw-arm-formal' js/11-home-international.js
          grep -Fq '@keyframes batteryPitcherBodyFormal' styles.css
          grep -Fq '@keyframes batteryStrideLegFormal' styles.css
          grep -Fq '@keyframes batteryThrowArmFormal' styles.css
          grep -Fq './app.js?v=v2.30' index.html
          grep -Fq 'baseball-player-card-pwa-v147' service-worker.js
          test -f 'index v2.30.html'
          test -f 'index v2.29.html'
      - name: Syntax and deterministic build
        run: |
          for f in js/[0-9][0-9]-*.js; do node --check "$f"; done
          node --check app.js
          cp app.js /tmp/app-committed.js
          python3 scripts/build-app.py
          cmp -s /tmp/app-committed.js app.js
      - name: Chrome mobile smoke test
        run: |
          python3 -m http.server 8765 >/tmp/http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          sleep 1
          CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$CHROME" ]; then exit 0; fi
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=411,900 --virtual-time-budget=9000 --dump-dom http://127.0.0.1:8765/index.html >/tmp/dom.html
          grep -Fq 'content="v2.30"' /tmp/dom.html
      - name: Commit v2.30
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html 'index v2.30.html' js/00-core-config.js js/11-home-international.js styles.css service-worker.js
          if [ -f 'index v2.28.html' ]; then git rm -f 'index v2.28.html'; fi
          git commit -m 'v2.30 add formal pitching delivery animation'
          git push origin HEAD:feature-v2.30-formal-pitching-motion
