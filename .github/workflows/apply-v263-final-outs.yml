name: Apply v2.63 final outs fix
on:
  push:
    paths:
      - '.github/v263-final-outs-trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v2.63 final outs fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('game-detail-enhancement.js')
          s = p.read_text(encoding='utf-8')

          old = """  function currentBaseState(detail) {\n    if (detail?.current?.baseState) return detail.current.baseState;\n    if (detail?.current?.bases) return detail.current.bases;\n    const plays = Array.isArray(detail?.plays) ? detail.plays : [];\n    const last = plays[plays.length - 1];\n    return last?.baseState || last?.basesAfter || last?.bases || '';\n  }\n"""
          new = """  function currentBaseState(detail) {\n    const plays = Array.isArray(detail?.plays) ? detail.plays : [];\n    const last = plays[plays.length - 1];\n    const status = String(detail?.status || '').toLowerCase();\n    if (status === 'final' || inferredOutsAfterPlay(last) >= 3) return [false,false,false];\n    if (detail?.current?.baseState) return detail.current.baseState;\n    if (detail?.current?.bases) return detail.current.bases;\n    return last?.baseState || last?.basesAfter || last?.bases || '';\n  }\n"""
          if old not in s:
              raise SystemExit('currentBaseState target not found')
          s = s.replace(old, new, 1)

          old = """  function inferredOutsAfterPlay(play) {\n    if (!play) return 0;\n    const before = parseOutNumber(play.outs);\n    if (before === null) return 0;\n    const text = `${play.raw || ''} ${play.result || ''}`;\n    let added = 0;\n    if (/三殺|トリプルプレー/i.test(text)) added = 3;\n    else if (/雙殺|併殺|ダブルプレー/i.test(text)) added = 2;\n    else if (/三振|ゴロ|滾地|フライ|飛球|ライナー|平飛|犧牲|犠牲|犠打|アウト/i.test(text)) added = 1;\n    return Math.min(3, before + added);\n  }\n\n  function currentOuts(detail) {\n    const direct = parseOutNumber(detail?.current?.outs);\n    if (direct !== null) return Math.min(2, direct);\n    const plays = Array.isArray(detail?.plays) ? detail.plays : [];\n    const last = plays[plays.length - 1];\n    if (!last) return 0;\n    const after = inferredOutsAfterPlay(last);\n    return after >= 3 ? 0 : after;\n  }\n"""
          new = """  function inferredOutsAfterPlay(play) {\n    if (!play) return 0;\n    const before = parseOutNumber(play.outs);\n    if (before === null) return 0;\n    const text = `${play.raw || ''} ${play.result || ''} ${play.description || ''}`;\n    if (/3\\s*人出局|三人出局|3\\s*出局/i.test(text)) return 3;\n    let added = 0;\n    if (/三殺|トリプルプレー/i.test(text)) added = 3;\n    else if (/雙殺|併殺|ダブルプレー|DP\\b/i.test(text)) added = 2;\n    else if (/三振|ゴロ|滾地|フライ|飛球|ライナー|平飛|犧牲|犠牲|犠打|アウト|出局/i.test(text)) added = 1;\n    return Math.min(3, before + added);\n  }\n\n  function currentOuts(detail) {\n    const plays = Array.isArray(detail?.plays) ? detail.plays : [];\n    const last = plays[plays.length - 1];\n    const after = inferredOutsAfterPlay(last);\n    if (String(detail?.status || '').toLowerCase() === 'final') return 3;\n    if (after >= 3) return 3;\n    const direct = parseOutNumber(detail?.current?.outs);\n    if (direct !== null) return Math.min(2, direct);\n    return after;\n  }\n"""
          if old not in s:
              raise SystemExit('outs target not found')
          s = s.replace(old, new, 1)

          old = """  function currentRunnerNames(detail) {\n    const direct = directRunnerNames(detail), inferred = inferRunnerNames(detail);\n    return {first:direct.first||inferred.first,second:direct.second||inferred.second,third:direct.third||inferred.third};\n  }\n"""
          new = """  function currentRunnerNames(detail) {\n    const plays = Array.isArray(detail?.plays) ? detail.plays : [];\n    const last = plays[plays.length - 1];\n    if (String(detail?.status || '').toLowerCase() === 'final' || inferredOutsAfterPlay(last) >= 3) {\n      return {first:'',second:'',third:''};\n    }\n    const direct = directRunnerNames(detail), inferred = inferRunnerNames(detail);\n    return {first:direct.first||inferred.first,second:direct.second||inferred.second,third:direct.third||inferred.third};\n  }\n"""
          if old not in s:
              raise SystemExit('currentRunnerNames target not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          files = [
              'app.js','index.html','service-worker.js','game-detail-enhancement.js',
              'game-detail-enhancement.css','report-layout.js','report-layout.css',
              'cpbl-realtime.js','live-static-update.js','cpbl-cache-router.js',
              'landscape-state.js','landscape-state.css','manifest.webmanifest',
              'rescue.html','styles.css'
          ]
          for name in files:
              p = Path(name)
              if not p.exists():
                  continue
              t = p.read_text(encoding='utf-8')
              t = t.replace('v2.62','v2.63').replace('v262','v263').replace('V262','V263')
              t = t.replace('pwa-v262','pwa-v263')
              p.write_text(t, encoding='utf-8')

          Path('version.json').write_text('{"version":"v2.63"}\n', encoding='utf-8')
          PY

      - name: Verify v2.63
        shell: bash
        run: |
          node --check app.js
          node --check game-detail-enhancement.js
          grep -q '"version":"v2.63"' version.json
          grep -q "APP_VERSION = 'v2.63'" app.js
          grep -q "baseball-player-card-pwa-v263" service-worker.js
          grep -q "status === 'final' || inferredOutsAfterPlay(last) >= 3" game-detail-enhancement.js
          grep -q "if (after >= 3) return 3" game-detail-enhancement.js

      - name: Commit v2.63
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html service-worker.js game-detail-enhancement.js game-detail-enhancement.css report-layout.js report-layout.css cpbl-realtime.js live-static-update.js cpbl-cache-router.js landscape-state.js landscape-state.css manifest.webmanifest rescue.html styles.css version.json
          git commit -m 'Release v2.63 correct post-play outs and clear bases'
          git push
