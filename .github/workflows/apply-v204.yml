name: Apply v2.04 patch

on:
  push:
    paths:
      - 'scripts/patch-v2.04.mjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: node scripts/patch-v2.04.mjs
      - name: Commit v2.04
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html "index v2.04.html"
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "v2.04 sync lock source metadata unified special records"
          git push
