name: CPBL landscape v2.51

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cpbl-landscape-v251.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix CPBL landscape team ownership
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('game-detail-enhancement.js')
          s = p.read_text(encoding='utf-8')

          old = "const name = compactName(current.fullName || current.name || direct.fullName || direct.name || '');\n    const stats = direct.stats || current.stats || direct || current;"
          new = "const name = compactName(direct.fullName || direct.name || current.fullName || current.name || '');\n    const stats = direct.stats || direct || current.stats || current;"
          if old not in s:
              raise SystemExit('pitcher priority hook not found')
          s = s.replace(old, new, 1)

          old = "const pitcher = compactName(detail?.current?.pitcher?.fullName || detail?.current?.pitcher?.name || raw?.pitcher?.name || ''); if (pitcher) map.p = pitcher;"
          new = "const pitcher = compactName(raw?.pitcher?.fullName || raw?.pitcher?.name || detail?.current?.pitcher?.fullName || detail?.current?.pitcher?.name || ''); if (pitcher) map.p = pitcher;"
          if old not in s:
              raise SystemExit('defense pitcher hook not found')
          s = s.replace(old, new, 1)

          old = "<span>${esc(entry.number || entry.order || '')}</span>"
          new = "<span>${esc(entry.number || '—')}</span>"
          if old not in s:
              raise SystemExit('jersey number hook not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

          sed -i 's/v2\.50/v2.51/g' js/00-core-config.js index.html manifest.webmanifest version.json game-detail-enhancement.js game-detail-enhancement.css service-worker.js
          sed -i 's/v250/v251/g' service-worker.js
          python3 scripts/build-app.py
          node --check app.js
          node --check game-detail-enhancement.js

      - name: Commit v2.51
        run: |
          git config user.name 'chatgpt-release'
          git config user.email 'actions@users.noreply.github.com'
          git add js/00-core-config.js app.js index.html manifest.webmanifest version.json game-detail-enhancement.js game-detail-enhancement.css service-worker.js
          git commit -m 'Fix CPBL landscape player ownership and release v2.51'
          git push
