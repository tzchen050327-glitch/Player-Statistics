name: Apply v2.71 NPB landscape board
on:
  push:
    paths:
      - '.github/v271-npb-landscape-trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable NPB landscape board and sync v2.71
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path('app.js')
          s = app.read_text(encoding='utf-8')
          cpbl_const = "    const CPBL_GAME_DETAIL_API_URL = 'https://kjndnsztbcpmkhictjkr.supabase.co/functions/v1/cpbl-game-detail';"
          npb_const = "    const NPB_GAME_DETAIL_API_URL = 'https://kjndnsztbcpmkhictjkr.supabase.co/functions/v1/npb-game-detail';"
          if npb_const not in s:
              if cpbl_const not in s:
                  raise SystemExit('CPBL_GAME_DETAIL_API_URL anchor not found')
              s = s.replace(cpbl_const, cpbl_const + '\n' + npb_const, 1)

          old_route = "      const detailApiUrl = league === 'CPBL' ? CPBL_GAME_DETAIL_API_URL : LEAGUE_GAME_DETAIL_API_URL;"
          new_route = "      const detailApiUrl = league === 'CPBL'\n        ? CPBL_GAME_DETAIL_API_URL\n        : league === 'NPB'\n          ? NPB_GAME_DETAIL_API_URL\n          : LEAGUE_GAME_DETAIL_API_URL;"
          if old_route in s:
              s = s.replace(old_route, new_route, 1)
          elif "? NPB_GAME_DETAIL_API_URL" not in s:
              raise SystemExit('leagueGameDetailRequest route anchor not found')
          app.write_text(s, encoding='utf-8')

          gdx = Path('game-detail-enhancement.js')
          s = gdx.read_text(encoding='utf-8')
          old_re = "  const DETAIL_URL_RE = /\\/(?:league-game-detail|cpbl-game-detail)(?:\\?|$)/i;"
          new_re = "  const DETAIL_URL_RE = /\\/(?:league-game-detail|cpbl-game-detail|npb-game-detail)(?:\\?|$)/i;"
          if old_re in s:
              s = s.replace(old_re, new_re, 1)
          elif 'npb-game-detail' not in s:
              raise SystemExit('DETAIL_URL_RE anchor not found')

          old_landscape = "    const landscapeMode=isCpbl && window.matchMedia('(orientation: landscape) and (min-width: 700px)').matches;"
          new_landscape = "    const supportsLandscape=isCpbl||isNpb;\n    const landscapeMode=supportsLandscape && window.matchMedia('(orientation: landscape) and (min-width: 700px)').matches;"
          if old_landscape in s:
              s = s.replace(old_landscape, new_landscape, 1)
          elif 'const supportsLandscape=isCpbl||isNpb;' not in s:
              raise SystemExit('landscape gate anchor not found')

          old_class = "    document.body.classList.toggle('gdx-cpbl-landscape',isCpbl);"
          new_class = "    document.body.classList.toggle('gdx-cpbl-landscape',supportsLandscape);"
          if old_class in s:
              s = s.replace(old_class, new_class, 1)

          old_remove = "    if (!isCpbl) body?.querySelectorAll('[data-gdx=\"landscape\"],[data-gdx=\"live\"]').forEach(node=>node.remove());"
          new_remove = "    if (!supportsLandscape) body?.querySelectorAll('[data-gdx=\"landscape\"],[data-gdx=\"live\"]').forEach(node=>node.remove());"
          if old_remove in s:
              s = s.replace(old_remove, new_remove, 1)
          gdx.write_text(s, encoding='utf-8')

          files = [
              'app.js','index.html','service-worker.js',
              'game-detail-enhancement.js','game-detail-enhancement.css',
              'report-layout.js','report-layout.css',
              'cpbl-realtime.js','live-static-update.js','cpbl-cache-router.js',
              'landscape-state.js','landscape-state.css',
              'manifest.webmanifest','rescue.html','styles.css'
          ]
          for name in files:
              p = Path(name)
              if not p.exists():
                  continue
              t = p.read_text(encoding='utf-8')
              t = t.replace('v2.70','v2.71').replace('v270','v271').replace('V270','V271')
              t = t.replace('pwa-v270','pwa-v271')
              p.write_text(t, encoding='utf-8')

          manifest = Path('manifest.webmanifest')
          ms = manifest.read_text(encoding='utf-8')
          ms = re.sub(r'("start_url"\s*:\s*")[^"]+("\s*,?)', r'\1./index.html?v=v2.71\2', ms, count=1)
          manifest.write_text(ms, encoding='utf-8')

          Path('version.json').write_text('{"version":"v2.71"}\n', encoding='utf-8')
          PY

      - name: Verify v2.71
        shell: bash
        run: |
          node --check app.js
          node --check game-detail-enhancement.js
          node --check report-layout.js
          node --check live-static-update.js
          node --check landscape-state.js
          grep -q "APP_VERSION = 'v2.71'" app.js
          grep -q "NPB_GAME_DETAIL_API_URL.*npb-game-detail" app.js
          grep -q "? NPB_GAME_DETAIL_API_URL" app.js
          grep -q "npb-game-detail" game-detail-enhancement.js
          grep -q "supportsLandscape=isCpbl||isNpb" game-detail-enhancement.js
          grep -q "baseball-player-card-pwa-v271" service-worker.js
          grep -q '"version":"v2.71"' version.json
          grep -q '"start_url": "./index.html?v=v2.71"' manifest.webmanifest
          grep -q 'game-detail-enhancement.js?v=v2.71' index.html

      - name: Commit v2.71
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html service-worker.js game-detail-enhancement.js game-detail-enhancement.css report-layout.js report-layout.css cpbl-realtime.js live-static-update.js cpbl-cache-router.js landscape-state.js landscape-state.css manifest.webmanifest rescue.html styles.css version.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Release v2.71 add NPB landscape scoreboard'
          git push
