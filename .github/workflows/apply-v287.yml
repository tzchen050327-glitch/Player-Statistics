name: Apply v2.87 CPBL pregame background prefetch

on:
  push:
    paths:
      - '.github/workflows/apply-v287.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply release metadata
        run: python .github/scripts/apply_v287.py
      - name: Syntax checks
        run: |
          node --check app.js
          node --check cpbl-realtime.js
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v2.87 CPBL pregame background prefetch" || exit 0
          git push
