name: Refresh milestone data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/build-milestones.py"
      - ".github/workflows/milestones-data.yml"

permissions:
  contents: write

concurrency:
  group: milestone-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser dependencies
        run: pip install --disable-pip-version-check requests beautifulsoup4

      - name: Build official league milestone snapshot
        run: python scripts/build-milestones.py

      - name: Commit snapshot when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/milestones.json
          git diff --cached --quiet && exit 0
          git commit -m "data: refresh CPBL NPB milestones [skip version bump]"
          git pull --rebase origin main
          git push
