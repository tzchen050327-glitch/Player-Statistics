name: Apply site-wide diagnostics

on:
  push:
    paths:
      - '.github/workflows/apply-site-diagnostics.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wire diagnostics into the app shell
        run: python .github/scripts/apply_site_diagnostics_wiring.py
      - name: Syntax checks
        run: |
          node --check diagnostic-runtime.js
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('diagnostics.html').read_text(encoding='utf-8')
          m = re.search(r'<script>\s*([\s\S]*?)\s*</script>', html)
          if not m:
              raise SystemExit('diagnostics inline script missing')
          Path('/tmp/diagnostics-inline.js').write_text(m.group(1), encoding='utf-8')
          PY
          node --check /tmp/diagnostics-inline.js
          grep -q 'diagnostic-runtime.js' index.html
          grep -q 'diagnostic-runtime.js' service-worker.js
      - name: Commit diagnostics wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git commit -m "Wire site-wide diagnostics into app runtime" || exit 0
          git push
