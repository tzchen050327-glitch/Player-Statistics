name: Apply v2.95 integration hardening

on:
  push:
    paths:
      - '.github/workflows/apply-v295.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v2.95 patch
        run: python .github/scripts/apply_v295.py
      - name: Syntax checks
        run: |
          node --check app.js
          node --check cpbl-realtime.js
          node --check postseason-history.js
          node --check .github/scripts/smoke_v295.mjs
      - name: Verify release wiring
        run: |
          grep -q "kindCodes:\['A','E','C'\]" app.js
          grep -q '"version":"v2.95"' version.json
          grep -q "cacheDiagnosticsBtn" app.js
          test ! -e .github/scripts/apply_v293.py
          test ! -e .github/workflows/apply-v293.yml
      - name: Production integration smoke
        run: node .github/scripts/smoke_v295.mjs
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v2.95 harden CPBL integrity and integration checks" || exit 0
          git push
