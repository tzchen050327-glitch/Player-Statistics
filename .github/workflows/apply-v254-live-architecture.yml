name: Apply v2.54 live architecture

on:
  push:
    paths:
      - '.github/v254-live-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch v2.54 frontend architecture
        run: python3 scripts/apply_v254.py

      - name: Syntax check
        run: |
          node --check app.js
          node --check live-static-update.js
          node --check cpbl-cache-router.js
          node --check game-detail-enhancement.js
          node --check report-layout.js
          node --check cpbl-realtime.js

      - name: Commit v2.54
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html styles.css game-detail-enhancement.css game-detail-enhancement.js live-static-update.js cpbl-cache-router.js service-worker.js rescue.html report-layout.css report-layout.js cpbl-realtime.js
          git commit -m "Release v2.54 CPBL backend push and CPBL-only landscape"
          git push
