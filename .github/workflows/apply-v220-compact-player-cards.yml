name: Apply v2.20 compact player cards

on:
  push:
    branches: [feature-v2.20-compact-player-cards]
    paths:
      - 'scripts/patch-v220-compact-player-cards.py'
      - '.github/workflows/apply-v220-compact-player-cards.yml'

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v2.20 patch
        run: python3 scripts/patch-v220-compact-player-cards.py

      - name: Validate compact player cards
        run: |
          grep -Fq "const APP_VERSION = 'v2.20'" js/00-core-config.js
          grep -Fq "v2.20 compact homepage player cards" styles.css
          grep -Fq "min-height:66px !important" styles.css
          grep -Fq "flex-direction:row !important" styles.css
          grep -Fq "./app.js?v=v2.20" index.html
          grep -Fq "baseball-player-card-pwa-v137" service-worker.js
          test -f 'index v2.20.html'
          test -f 'index v2.19.html'
          test ! -f 'index v2.18.html'

      - name: Syntax and deterministic build
        run: |
          for f in js/[0-9][0-9]-*.js; do node --check "$f"; done
          node --check app.js
          cp app.js /tmp/app-committed.js
          python3 scripts/build-app.py
          cmp -s /tmp/app-committed.js app.js

      - name: Chrome mobile smoke test
        run: |
          python3 -m http.server 8765 >/tmp/player-stats-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo 'Chrome not preinstalled; static checks passed.'
            exit 0
          fi
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=411,900 --virtual-time-budget=9000 --dump-dom http://127.0.0.1:8765/index.html >/tmp/dom.html
          grep -Fq 'id="recentPlayers"' /tmp/dom.html
          grep -Fq 'content="v2.20"' /tmp/dom.html

      - name: Commit v2.20
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html 'index v2.20.html' js/00-core-config.js styles.css service-worker.js
          if [ -f 'index v2.18.html' ]; then git rm -f 'index v2.18.html'; fi
          git commit -m 'v2.20 compact homepage player cards'
          git push origin HEAD:feature-v2.20-compact-player-cards
