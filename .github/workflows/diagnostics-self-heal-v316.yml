name: Diagnostics self-heal v3.16

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnostics-self-heal-v316.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply diagnostics self-heal patch
        run: python .github/scripts/patch_diagnostics_self_heal.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics.html diagnostic-runtime.js
          git diff --cached --quiet && exit 0
          git commit -m "Make diagnostics self-heal PWA and separate historical errors [skip version bump]"
          git push
