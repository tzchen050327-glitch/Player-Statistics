name: Apply v2.72 NPB backend live cache fixed

on:
  push:
    paths:
      - '.github/v272-npb-cache-trigger-fixed'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch release files
        run: python .github/scripts/apply_v272_npb_cache.py
      - name: Commit v2.72
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html styles.css game-detail-enhancement.css game-detail-enhancement.js live-static-update.js cpbl-cache-router.js cpbl-realtime.js npb-realtime.js service-worker.js rescue.html report-layout.css report-layout.js landscape-state.js landscape-state.css manifest.webmanifest version.json
          git commit -m "Release v2.72 add NPB backend cache and Realtime"
          git push
