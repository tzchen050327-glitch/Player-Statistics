name: Temporary canvas PA label v3.41

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_temp_canvas_pa_label_v341.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Patch report canvas PA label
        shell: python
        run: |
          import json, re
          from pathlib import Path

          p = Path('js/16-daily-canvas.js')
          s = p.read_text(encoding='utf-8')
          a = "            ctx.fillText(paLabel(pa), textX, y + (positioned ? 11 : 14));"
          b = "            const paText = paDisplayLabel(pa);\n            ctx.fillText(paText, textX, y + (positioned ? 11 : 14));"
          c = "              const width = ctx.measureText(paLabel(pa)).width;"
          d = "              const width = ctx.measureText(paText).width;"
          if a not in s: raise SystemExit('canvas fillText not found')
          if c not in s: raise SystemExit('canvas measureText not found')
          s = s.replace(a, b, 1).replace(c, d, 1)
          p.write_text(s, encoding='utf-8')

          data = json.loads(Path('version.json').read_text(encoding='utf-8'))
          oldv = str(data['version'])
          m = re.fullmatch(r'v(\d+)\.(\d+)', oldv)
          if not m: raise SystemExit(f'unsupported version {oldv}')
          newv = f'v{int(m.group(1))}.{int(m.group(2))+1}'
          if newv != 'v3.41': raise SystemExit(f'expected v3.41 from {oldv}, got {newv}')
          cache_tag = newv.replace('.', '')
          Path('version.json').write_text(json.dumps({'version':newv}, ensure_ascii=False, separators=(',', ':'))+'\n', encoding='utf-8')

          order = [x.strip() for x in Path('js/module-order.txt').read_text(encoding='utf-8').splitlines() if x.strip()]
          found = 0
          for name in order:
              q = Path('js') / name
              text = q.read_text(encoding='utf-8')
              text, n = re.subn(r"const APP_VERSION = 'v\d+\.\d+';", f"const APP_VERSION = '{newv}';", text)
              found += n
              text = re.sub(r'\?v=v\d+\.\d+', f'?v={newv}', text)
              q.write_text(text, encoding='utf-8')
          if found != 1: raise SystemExit(f'expected one APP_VERSION, found {found}')

          q = Path('index.html')
          text = q.read_text(encoding='utf-8')
          text, n = re.subn(r'(<meta\s+name="app-version"\s+content=")v\d+\.\d+("\s*/?>)', rf'\g<1>{newv}\2', text, count=1)
          text = re.sub(r'\?v=v\d+\.\d+', f'?v={newv}', text)
          text = re.sub(r'(id="appVersionBadge"[^>]*>)v\d+\.\d+(</button>)', rf'\g<1>{newv}\2', text, count=1)
          if not n: raise SystemExit('app-version meta not found')
          q.write_text(text, encoding='utf-8')

          q = Path('service-worker.js')
          text = q.read_text(encoding='utf-8')
          text = re.sub(r'\?v=v\d+\.\d+', f'?v={newv}', text)
          text = re.sub(r"const CACHE_NAME = '[^']+';", f"const CACHE_NAME = 'baseball-player-card-pwa-{cache_tag}-auto';", text, count=1)
          q.write_text(text, encoding='utf-8')

      - name: Build and verify
        run: |
          python3 scripts/build-app.py
          python3 scripts/build-app.py --check
          node --check app.js

      - name: Remove temporary workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_temp_canvas_pa_label_v341.yml
          git add version.json index.html service-worker.js app.js js
          git commit -m "Sync detailed PA labels to report canvas v3.41 [skip version bump]"
          git push
