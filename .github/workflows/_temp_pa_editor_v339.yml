name: Temporary PA editor v3.39

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_temp_pa_editor_v339.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/scripts/patch_pa_editor_v339.py
      - name: Build and verify
        run: |
          python3 scripts/build-app.py
          python3 scripts/build-app.py --check
          node --check app.js
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_temp_pa_editor_v339.yml
          git rm .github/scripts/patch_pa_editor_v339.py
          git add version.json index.html service-worker.js app.js js
          git commit -m "Fix PA choices and edit mode v3.39 [skip version bump]"
          git push
