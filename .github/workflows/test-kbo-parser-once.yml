name: Test KBO parser once

on:
  push:
    branches: [feature-v2.19-compact-daily-games]
    paths:
      - '.github/workflows/test-kbo-parser-once.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Verify KBO daily games parser
        run: |
          python3 - <<'PY'
          import json, subprocess
          url='https://kjndnsztbcpmkhictjkr.supabase.co/functions/v1/league-daily-games'
          payload=json.dumps({
            'appKey':'TyPAf0puXo-lBcrIf4Ky1wQryHaG2f4j',
            'action':'daily-games',
            'league':'KBO',
            'date':'2026-09-12'
          })
          raw=subprocess.check_output([
            'curl','-fsS','--retry','2','--retry-delay','1',url,
            '-H','content-type: application/json',
            '--data',payload
          ], text=True)
          data=json.loads(raw)
          print(json.dumps(data, ensure_ascii=False, indent=2))
          assert data.get('ok') is True, data
          pairs={(g.get('away'), g.get('home')) for g in data.get('games',[])}
          expected={
            ('NC恐龍','斗山熊'),
            ('LG雙子','三星獅'),
            ('KIA虎','KT巫師'),
            ('樂天巨人','培證英雄'),
          }
          assert expected <= pairs, (expected, pairs)
          assert all(a != h for a,h in pairs), pairs
          PY
