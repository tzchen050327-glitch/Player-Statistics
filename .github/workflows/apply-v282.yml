name: Apply v2.82 full postseason prefetch

on:
  push:
    paths:
      - '.github/workflows/apply-v282.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python .github/scripts/apply_v282.py
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js postseason-history.js index.html service-worker.js version.json
          git commit -m "Release v2.82 full postseason prefetch and detail context" || exit 0
          git push
