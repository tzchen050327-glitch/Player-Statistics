name: Apply v2.77 player context prefetch fixed
on:
  push:
    branches: [main]
    paths:
      - '.github/v277-player-context-prefetch-trigger-fixed'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v2.77 patch
        run: python3 .github/scripts/apply_v277.py
      - name: Verify v2.77
        run: |
          node --check app.js
          node --check postseason-history.js
          node --check cpbl-cache-router.js
          grep -q "const APP_VERSION = 'v2.77'" app.js
          grep -q "background:true" postseason-history.js
          grep -q "careerYears" app.js
          grep -q "careerYears" postseason-history.js
          grep -q "baseball-player-card-pwa-v277" service-worker.js
          test "$(cat version.json)" = '{"version":"v2.77"}'
      - name: Commit v2.77
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html service-worker.js styles.css live-static-update.js cpbl-realtime.js npb-realtime.js postseason-history.js postseason-history.css cpbl-cache-router.js game-detail-enhancement.js game-detail-enhancement.css report-layout.js report-layout.css landscape-state.js landscape-state.css manifest.webmanifest rescue.html version.json 2>/dev/null || true
          git commit -m 'Release v2.77 prefetch player career and postseason context'
          git push
