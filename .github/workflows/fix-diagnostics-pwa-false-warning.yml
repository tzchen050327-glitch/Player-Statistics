name: Fix diagnostics PWA false warning

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-diagnostics-pwa-false-warning.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine Service Worker diagnosis
        shell: python
        run: |
          from pathlib import Path
          path = Path('diagnostics.html')
          text = path.read_text(encoding='utf-8')
          old = "  if(location.protocol==='https:'&&p.supported&&!p.controller) pushIssue(state,'warning','PWA','目前頁面沒有 Service Worker controller','首次開啟或剛更新時可能暫時正常');"
          new = "  const activeRegistration=p.registrations.find(r=>r.active&&location.href.startsWith(r.scope));\n  p.controlState=p.controller?'controlled':activeRegistration?'active-uncontrolled':'unregistered';\n  if(location.protocol==='https:'&&p.supported&&!p.controller&&!activeRegistration) pushIssue(state,'warning','PWA','目前頁面沒有可用的 Service Worker','此 scope 沒有 active registration；PWA 離線與快取能力可能失效');"
          if old not in text:
              raise SystemExit('probePwa target not found')
          text = text.replace(old, new, 1)
          old_render = "['Service Worker 支援',p.supported?'是':'否'],['目前被 SW 控制',p.controller?'是':'否'],['Controller',p.controllerUrl||'—']"
          new_render = "['Service Worker 支援',p.supported?'是':'否'],['目前被 SW 控制',p.controller?'是':p.controlState==='active-uncontrolled'?'尚未接管（active registration 正常）':'否'],['Controller',p.controllerUrl||'—']"
          if old_render not in text:
              raise SystemExit('PWA render target not found')
          text = text.replace(old_render, new_render, 1)
          path.write_text(text, encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix PWA diagnostics false positive"
          git push
