name: Fix CPBL live card sync v2.46

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-cpbl-live-sync-v246.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch CPBL outer live score sync and release v2.46
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('js/11-home-international.js')
          s = p.read_text(encoding='utf-8')
          old = """                const verifiedStatus = String(verified?.status || '').toLowerCase();
                if (verifiedStatus) item.status = verifiedStatus;
                if (verified?.game?.awayScore !== undefined && verified.game.awayScore !== null) item.awayScore = verified.game.awayScore;
                if (verified?.game?.homeScore !== undefined && verified.game.homeScore !== null) item.homeScore = verified.game.homeScore;
                if (verified?.game?.inningLabel) item.inningLabel = verified.game.inningLabel;"""
          new = """                syncHomeDailyGameFromDetail('CPBL', date, item, verified);
                if (verified?.game?.inningLabel) item.inningLabel = verified.game.inningLabel;"""
          if old not in s:
              raise SystemExit('CPBL live verification block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          for name in ['js/00-core-config.js', 'index.html', 'manifest.webmanifest', 'game-detail-enhancement.js', 'service-worker.js']:
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              s = s.replace('v2.45', 'v2.46').replace('v245', 'v246')
              p.write_text(s, encoding='utf-8')

          Path('version.json').write_text('{"version":"v2.46"}\n', encoding='utf-8')
          PY
          python3 scripts/build-app.py
          node --check app.js
          node --check game-detail-enhancement.js
          grep -Fq "syncHomeDailyGameFromDetail('CPBL', date, item, verified);" js/11-home-international.js
          grep -Fq "const APP_VERSION = 'v2.46';" app.js
          grep -Fq 'content="v2.46"' index.html
          grep -Fq 'baseball-player-card-pwa-v246-stable-1' service-worker.js
          git diff --check
      - name: Commit fix
        run: |
          git config user.name 'chatgpt-release'
          git config user.email 'actions@users.noreply.github.com'
          git add js/11-home-international.js js/00-core-config.js app.js index.html manifest.webmanifest service-worker.js version.json game-detail-enhancement.js
          git commit -m 'Sync CPBL live cards from detail scoreboard and release v2.46'
          git pull --rebase origin main
          git push
