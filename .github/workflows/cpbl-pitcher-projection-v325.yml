name: CPBL pitcher projection v3.25

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cpbl-pitcher-projection-v325.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch app and bump version
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          old1="      currentRecord.cpblSeasonProjection = daily?.seasonProjection || null;"
          new1=old1+"\n      currentRecord.cpblSeasonProjectionByRole = daily?.seasonProjectionByRole || null;"
          if old1 not in s:
              raise SystemExit('projection assignment marker not found')
          s=s.replace(old1,new1,1)
          old2="""      const projection = currentRecord?.cpblSeasonProjection;
      if (
        role === 'hitter'
        && level === 'A'
        && playerScope(player) === 'cpbl'
        && projection?.complete
        && projection?.stats
      ) {
        return mergeStats(projection.stats, hitterDefaults);
      }
"""
          new2="""      const projection = currentRecord?.cpblSeasonProjectionByRole?.[role] || currentRecord?.cpblSeasonProjection;
      const projectionMatchesRole = projection?.role ? projection.role === role : role === 'hitter';
      if (
        level === 'A'
        && playerScope(player) === 'cpbl'
        && projectionMatchesRole
        && projection?.complete
        && projection?.stats
      ) {
        if (role === 'pitcher') return mergeStats(projection.stats, pitcherDefaults);
        return mergeStats(projection.stats, hitterDefaults);
      }
"""
          if old2 not in s:
              raise SystemExit('output projection marker not found')
          s=s.replace(old2,new2,1)
          new='v3.25'
          s=re.sub(r"const APP_VERSION = 'v\d+\.\d+';",f"const APP_VERSION = '{new}';",s,count=1)
          s=re.sub(r'\?v=v\d+\.\d+',f'?v={new}',s)
          p.write_text(s,encoding='utf-8')
          Path('version.json').write_text(json.dumps({'version':new},ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          p=Path('index.html'); s=p.read_text(encoding='utf-8'); s=re.sub(r'(<meta\s+name="app-version"\s+content=")v\d+\.\d+("\s*/?>)',rf'\g<1>{new}\2',s,count=1); s=re.sub(r'\?v=v\d+\.\d+',f'?v={new}',s); s=re.sub(r'(id="appVersionBadge"[^>]*>)v\d+\.\d+(</button>)',rf'\g<1>{new}\2',s,count=1); p.write_text(s,encoding='utf-8')
          p=Path('service-worker.js'); s=p.read_text(encoding='utf-8'); s=re.sub(r'\?v=v\d+\.\d+',f'?v={new}',s); s=re.sub(r"const CACHE_NAME = '[^']+';","const CACHE_NAME = 'baseball-player-card-pwa-v325-auto';",s,count=1); p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json index.html app.js service-worker.js
          git commit -m "Use Supabase pitcher pregame projection for reports v3.25 [skip version bump]" || exit 0
          git push
