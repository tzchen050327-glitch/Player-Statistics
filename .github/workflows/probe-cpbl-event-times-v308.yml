name: Probe CPBL event times v3.08

on:
  push:
    paths:
      - '.github/workflows/probe-cpbl-event-times-v308.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe CPBL event timestamps
        run: node .github/scripts/probe_cpbl_event_times_v308.mjs
