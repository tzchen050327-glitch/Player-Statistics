name: Fix CPBL outer status

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-cpbl-outer-status.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch source module and rebuild bundle
        run: |
          python - <<'PY'
          from pathlib import Path

          candidates = list(Path('js').glob('*.js'))
          target = None
          text = None
          for p in candidates:
              s = p.read_text(encoding='utf-8')
              if 'async function loadHomeDailyGames' in s and 'function homeDailyGamesRefreshDelay' in s:
                  target = p
                  text = s
                  break
          if not target:
              raise SystemExit('home daily games module not found')

          old = text
          text = text.replace("const HOME_DAILY_GAMES_TTL = 15 * 1000;", "const HOME_DAILY_GAMES_TTL = 30 * 1000;")
          text = text.replace("const HOME_DAILY_GAMES_TTL = 2 * 60 * 1000;", "const HOME_DAILY_GAMES_TTL = 30 * 1000;")
          text = text.replace("return league === 'MLB' ? 2 * 60 * 1000 : 15 * 1000;", "return league === 'MLB' ? 2 * 60 * 1000 : league === 'NPB' ? 60 * 1000 : 30 * 1000;")

          needle = """        const games = await leagueDailyGamesRequest(league, date);\n        homeDailyGamesCache.set(key, { at:Date.now(), games, error:'' });\n        return games;"""
          replacement = """        let games = await leagueDailyGamesRequest(league, date);\n\n        // CPBL's schedule feed can keep a suspended/reserved game marked as live.\n        // For games that the outer feed still calls live, verify against the authoritative\n        // single-game detail endpoint before rendering the card.\n        if (league === 'CPBL' && Array.isArray(games)) {\n          const liveGames = games.filter(item => String(item?.status || '').toLowerCase() === 'live' && item?.id);\n          if (liveGames.length) {\n            await Promise.all(liveGames.map(async item => {\n              try {\n                const verified = await leagueGameDetailRequest('CPBL', date, item);\n                const verifiedStatus = String(verified?.status || '').toLowerCase();\n                if (verifiedStatus) item.status = verifiedStatus;\n                if (verified?.game?.awayScore !== undefined && verified.game.awayScore !== null) item.awayScore = verified.game.awayScore;\n                if (verified?.game?.homeScore !== undefined && verified.game.homeScore !== null) item.homeScore = verified.game.homeScore;\n                if (verified?.game?.inningLabel) item.inningLabel = verified.game.inningLabel;\n              } catch (error) {\n                console.warn('CPBL 外層賽況驗證失敗', error);\n              }\n            }));\n          }\n        }\n\n        homeDailyGamesCache.set(key, { at:Date.now(), games, error:'' });\n        return games;"""
          if needle not in text:
              raise SystemExit('loadHomeDailyGames fetch block not found')
          text = text.replace(needle, replacement)

          if text == old:
              raise SystemExit('no source changes made')
          target.write_text(text, encoding='utf-8')
          print('patched', target)
          PY

          python3 scripts/build-app.py
          node --check app.js

      - name: Commit fix
        run: |
          git config user.name 'chatgpt-fix'
          git config user.email 'actions@users.noreply.github.com'
          git add js app.js
          git commit -m 'Verify CPBL outer live status via game detail'
          git push
