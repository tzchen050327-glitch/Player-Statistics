name: Apply v2.68 restore pickers
on:
  push:
    paths:
      - '.github/v268-restore-pickers-trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore picker dialogs and sync v2.68
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          if 'id="datePickerDialog"' not in html:
              anchor = '  <dialog id="deletePlayerDialog">'
              if anchor not in html:
                  raise SystemExit('index insertion anchor not found')
              block = Path('.github/patches/v268-picker-dialogs.html').read_text(encoding='utf-8').rstrip()
              html = html.replace(anchor, block + '\n\n' + anchor, 1)
              index.write_text(html, encoding='utf-8')
          files = ['app.js','index.html','service-worker.js','game-detail-enhancement.js','game-detail-enhancement.css','report-layout.js','report-layout.css','cpbl-realtime.js','live-static-update.js','cpbl-cache-router.js','landscape-state.js','landscape-state.css','manifest.webmanifest','rescue.html','styles.css']
          for name in files:
              p = Path(name)
              if not p.exists():
                  continue
              t = p.read_text(encoding='utf-8')
              t = t.replace('v2.67','v2.68').replace('v267','v268').replace('V267','V268')
              p.write_text(t, encoding='utf-8')
          Path('version.json').write_text('{"version":"v2.68"}\n', encoding='utf-8')
          PY
      - name: Verify v2.68 picker restore
        shell: bash
        run: |
          node --check app.js
          node --check game-detail-enhancement.js
          grep -q 'id="datePickerDialog"' index.html
          grep -q 'id="datePickerBody"' index.html
          grep -q 'id="datePickerYearGrid"' index.html
          grep -q 'id="seasonPickerDialog"' index.html
          grep -q 'id="seasonPickerList"' index.html
          grep -q '"version":"v2.68"' version.json
          grep -q "APP_VERSION = 'v2.68'" app.js
          grep -q 'baseball-player-card-pwa-v268' service-worker.js
      - name: Commit v2.68
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html service-worker.js game-detail-enhancement.js game-detail-enhancement.css report-layout.js report-layout.css cpbl-realtime.js live-static-update.js cpbl-cache-router.js landscape-state.js landscape-state.css manifest.webmanifest rescue.html styles.css version.json
          git commit -m 'Release v2.68 restore date and season picker dialogs'
          git push
