name: Apply v2.60 landscape turnover
on:
  push:
    paths:
      - '.github/v260-landscape-turnover-trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch landscape board and responsive typography
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          js = Path('game-detail-enhancement.js')
          s = js.read_text(encoding='utf-8')
          old = """  function renderLandscapeBoard(detail,board) {
    const offense=currentOffenseSide(detail), defense=offense==='away'?'home':'away', game=detail?.game||{};
    const side=(which)=>{
      const team=which==='away'?game.away||'客隊':game.home||'主隊', isOff=which===offense;
      return `<section class=\"gdx-landscape-side gdx-side-${which}\"><div class=\"gdx-landscape-team-head\"><span>${which==='away'?'AWAY':'HOME'}</span><strong>${esc(team)}</strong><em>${isOff?'ATTACK':'DEFENSE'}</em></div>${isOff?renderLineupPanel(detail,which):renderPitcherPanel(detail,which)}</section>`;
    };
    return `<section class=\"gdx-landscape-board game-detail-enhanced-marker\" data-gdx=\"landscape\">${side('away')}<div class=\"gdx-landscape-center\">${renderLandscapeScoreboard(detail,board)}<div class=\"gdx-landscape-lower\">${renderDefenseField(detail,defense)}${renderRunnerDiamond(detail)}</div></div>${side('home')}</section>`;
  }
"""
          new = """  function landscapeLineupReset(detail) {
    const status=String(detail?.status||'').toLowerCase();
    if (status==='final') return true;
    const plays=Array.isArray(detail?.plays)?detail.plays:[];
    const last=plays.length?plays.at(-1):null;
    return inferredOutsAfterPlay(last)>=3;
  }

  function renderLandscapeBoard(detail,board) {
    const offense=currentOffenseSide(detail), defense=offense==='away'?'home':'away', game=detail?.game||{};
    const resetToLineups=landscapeLineupReset(detail);
    const side=(which)=>{
      const team=which==='away'?game.away||'客隊':game.home||'主隊', isOff=which===offense;
      const showLineup=resetToLineups||isOff;
      const modeLabel=resetToLineups?'LINEUP':isOff?'ATTACK':'DEFENSE';
      return `<section class=\"gdx-landscape-side gdx-side-${which}\"><div class=\"gdx-landscape-team-head\"><span>${which==='away'?'AWAY':'HOME'}</span><strong>${esc(team)}</strong><em>${modeLabel}</em></div>${showLineup?renderLineupPanel(detail,which):renderPitcherPanel(detail,which)}</section>`;
    };
    return `<section class=\"gdx-landscape-board game-detail-enhanced-marker ${resetToLineups?'is-lineup-reset':''}\" data-gdx=\"landscape\">${side('away')}<div class=\"gdx-landscape-center\">${renderLandscapeScoreboard(detail,board)}<div class=\"gdx-landscape-lower\">${renderDefenseField(detail,defense)}${renderRunnerDiamond(detail)}</div></div>${side('home')}</section>`;
  }
"""
          if old not in s:
              raise SystemExit('renderLandscapeBoard block not found')
          s = s.replace(old, new, 1)
          js.write_text(s, encoding='utf-8')

          css = Path('game-detail-enhancement.css')
          c = css.read_text(encoding='utf-8')
          marker = '/* ===== LANDSCAPE RESPONSIVE TYPE v2.60 ===== */'
          if marker not in c:
              c += r'''

/* ===== LANDSCAPE RESPONSIVE TYPE v2.60 ===== */
@media (orientation:landscape) and (min-width:981px){
  .gdx-landscape-board{
    --gdx-type-xs:clamp(10px,.62vw,14px);
    --gdx-type-sm:clamp(11px,.74vw,16px);
    --gdx-type-md:clamp(13px,.9vw,19px);
    --gdx-type-lg:clamp(24px,2vw,42px);
  }
  .gdx-landscape-team-head{
    height:clamp(48px,6.2vh,72px);
    flex-basis:clamp(48px,6.2vh,72px);
    padding:clamp(7px,.7vw,13px) clamp(10px,1vw,18px);
    gap:clamp(7px,.6vw,12px);
  }
  .gdx-landscape-team-head>span,.gdx-landscape-team-head>em{font-size:var(--gdx-type-xs)}
  .gdx-landscape-team-head>strong{font-size:var(--gdx-type-md)}
  .gdx-landscape-lineup{
    grid-template-rows:clamp(28px,3.2vh,40px) repeat(9,minmax(0,1fr));
    padding:clamp(6px,.55vw,11px) clamp(7px,.7vw,13px) clamp(8px,.7vw,14px);
    gap:clamp(2px,.18vw,4px);
  }
  .gdx-lineup-head,.gdx-lineup-row{
    grid-template-columns:clamp(26px,1.7vw,36px) minmax(82px,1fr) clamp(46px,3.1vw,66px) clamp(34px,2.2vw,48px) clamp(36px,2.4vw,50px) clamp(42px,2.8vw,58px);
    gap:clamp(2px,.2vw,5px);
  }
  .gdx-lineup-head{font-size:var(--gdx-type-xs)}
  .gdx-lineup-row{font-size:var(--gdx-type-sm);padding:0 clamp(4px,.35vw,8px);border-radius:clamp(5px,.45vw,9px)}
  .gdx-lineup-row strong{font-size:var(--gdx-type-md)}
  .gdx-landscape-scoreline span{font-size:clamp(14px,.95vw,20px)}
  .gdx-landscape-scoreline strong{font-size:clamp(34px,3.3vw,64px)}
  .gdx-landscape-inning{font-size:var(--gdx-type-sm);padding:clamp(5px,.45vw,9px) clamp(10px,.8vw,16px)}
  .gdx-landscape-scoretable{font-size:clamp(11px,.72vw,15px)}
  .gdx-landscape-scoretable thead th{font-size:var(--gdx-type-xs)}
  .gdx-mini-title{font-size:var(--gdx-type-xs)}
  .gdx-fielder span,.gdx-runner-name{font-size:var(--gdx-type-sm)}
  .gdx-runner-outs{font-size:clamp(13px,.9vw,18px)}
  .gdx-pitcher-kicker{font-size:var(--gdx-type-xs)}
  .gdx-pitcher-name{font-size:var(--gdx-type-lg)}
  .gdx-pitcher-grid{gap:clamp(7px,.55vw,12px);margin-top:clamp(14px,1.2vw,24px)}
  .gdx-pitcher-grid>div{padding:clamp(7px,.55vw,12px) clamp(8px,.65vw,14px)}
  .gdx-pitcher-grid span{font-size:var(--gdx-type-xs)}
  .gdx-pitcher-grid b{font-size:clamp(15px,1vw,21px)}
}
@media (orientation:landscape) and (min-width:1600px){
  body.gdx-cpbl-landscape .gdx-landscape-board{grid-template-columns:minmax(300px,25%) minmax(620px,50%) minmax(300px,25%)}
  .gdx-landscape-lower{gap:clamp(10px,.7vw,16px);padding:clamp(10px,.7vw,16px)}
  .gdx-field-card,.gdx-runner-card{border-radius:clamp(12px,.8vw,18px)}
}
/* ===== LANDSCAPE RESPONSIVE TYPE v2.60 END ===== */
'''
          css.write_text(c, encoding='utf-8')

          active = [
            'app.js','index.html','service-worker.js','game-detail-enhancement.js','game-detail-enhancement.css',
            'report-layout.js','report-layout.css','cpbl-realtime.js','live-static-update.js','cpbl-cache-router.js',
            'manifest.webmanifest','rescue.html','styles.css'
          ]
          for name in active:
              p = Path(name)
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              text = text.replace('v2.59','v2.60').replace('v259','v260').replace('V259','V260').replace('pwa-v259','pwa-v260')
              p.write_text(text, encoding='utf-8')
          PY
      - name: Syntax check
        run: |
          node --check app.js
          node --check game-detail-enhancement.js
          node --check cpbl-realtime.js
          node --check report-layout.js
          node --check live-static-update.js
      - name: Commit v2.60
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html service-worker.js game-detail-enhancement.js game-detail-enhancement.css report-layout.js report-layout.css cpbl-realtime.js live-static-update.js cpbl-cache-router.js manifest.webmanifest rescue.html styles.css 2>/dev/null || true
          git commit -m 'Release v2.60 responsive landscape lineup turnover'
          git push
