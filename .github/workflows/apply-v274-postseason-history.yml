name: Apply v2.74 postseason history

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/v274-postseason-history-trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply postseason history browser
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def insert_once(text, marker, replacement, label):
              if replacement in text:
                  return text
              if marker not in text:
                  raise SystemExit(f'{label}: marker not found')
              return text.replace(marker, replacement, 1)

          Path('postseason-history.js').write_text(Path('.github/patches/v274-postseason-history.js').read_text())
          Path('postseason-history.css').write_text(Path('.github/patches/v274-postseason-history.css').read_text())

          index = Path('index.html').read_text()
          index = insert_once(
              index,
              '  <link rel="stylesheet" href="./landscape-state.css?v=v2.73" />\n',
              '  <link rel="stylesheet" href="./landscape-state.css?v=v2.73" />\n  <link rel="stylesheet" href="./postseason-history.css?v=v2.73" />\n',
              'index postseason css'
          )
          index = insert_once(
              index,
              '        <button class="press-btn tab-btn hidden" data-tab="secondary">其他成績</button>\n        <button class="press-btn tab-btn" data-tab="today">球員今日狀況</button>',
              '        <button class="press-btn tab-btn hidden" data-tab="secondary">其他成績</button>\n        <button class="press-btn tab-btn hidden" data-tab="postseason">季後賽</button>\n        <button class="press-btn tab-btn" data-tab="today">球員今日狀況</button>',
              'index postseason tab'
          )
          index = insert_once(
              index,
              '  <script src="./app.js?v=v2.73"></script>\n',
              '  <script src="./app.js?v=v2.73"></script>\n  <script src="./postseason-history.js?v=v2.73"></script>\n',
              'index postseason script'
          )
          Path('index.html').write_text(index)

          app = Path('app.js').read_text()
          if 'window.__getPlayerContext' not in app:
              pattern = re.compile(
                  r"(\n\s*function playerScope\(player\)\s*\{\s*\n"
                  r"\s*const scope = String\(player\?\.scope \|\| ''\)\.trim\(\);\s*\n"
                  r"\s*return scope === 'international' \|\| scope === 'overseas' \? scope : 'cpbl';\s*\n"
                  r"\s*\}\s*\n)"
              )
              matches = list(pattern.finditer(app))
              if len(matches) != 1:
                  raise SystemExit(f'app player context bridge: expected 1 playerScope function, got {len(matches)}')
              bridge = """    window.__getPlayerContext = () => ({ player:selectedPlayer(), selectedSeason, selectedTab });
              window.addEventListener('postseason-open-game', event => {
                const detail = event?.detail || {};
                if (detail?.game && detail?.league && detail?.date) openHomeGameDetail(detail.game, detail.league, detail.date);
              });

          """
              m = matches[0]
              app = app[:m.end()] + bridge + app[m.end():]

          old_visibility = "els.seasonSelect?.closest('.season-field')?.classList.toggle('hidden', errorPageActive || (levelTabs && !statsTabActive));"
          new_visibility = "els.seasonSelect?.closest('.season-field')?.classList.toggle('hidden', errorPageActive || (levelTabs && !statsTabActive && selectedTab !== 'postseason'));"
          if new_visibility not in app:
              count = app.count(old_visibility)
              if count != 1:
                  raise SystemExit(f'app postseason season picker: expected 1 match, got {count}')
              app = app.replace(old_visibility, new_visibility, 1)
          Path('app.js').write_text(app)

          sw = Path('service-worker.js').read_text()
          if "'./postseason-history.js?v=v2.73'" not in sw:
              marker = "  './npb-realtime.js?v=v2.73',\n  './app.js?v=v2.73',"
              replacement = "  './npb-realtime.js?v=v2.73',\n  './postseason-history.css?v=v2.73',\n  './app.js?v=v2.73',\n  './postseason-history.js?v=v2.73',"
              if marker not in sw:
                  raise SystemExit('service worker postseason assets: marker not found')
              sw = sw.replace(marker, replacement, 1)
          Path('service-worker.js').write_text(sw)

          files = [
              'app.js','index.html','service-worker.js','game-detail-enhancement.js','game-detail-enhancement.css',
              'report-layout.js','report-layout.css','cpbl-realtime.js','npb-realtime.js','live-static-update.js',
              'cpbl-cache-router.js','landscape-state.js','landscape-state.css','manifest.webmanifest','rescue.html','styles.css',
              'postseason-history.js','postseason-history.css'
          ]
          for name in files:
              p = Path(name)
              if not p.exists():
                  continue
              text = p.read_text()
              text = text.replace('v2.73','v2.74').replace('v273','v274')
              p.write_text(text)
          Path('version.json').write_text('{"version":"v2.74"}\n')
          PY

      - name: Verify v2.74
        run: |
          node --check app.js
          node --check postseason-history.js
          node --check game-detail-enhancement.js
          grep -q "const APP_VERSION = 'v2.74'" app.js
          grep -q 'window.__getPlayerContext' app.js
          grep -q 'data-tab="postseason"' index.html
          grep -q 'postseason-history.js?v=v2.74' index.html
          grep -q 'postseason-history.css?v=v2.74' index.html
          grep -q 'postseason-history.js?v=v2.74' service-worker.js
          grep -q 'postseason-history.css?v=v2.74' service-worker.js
          grep -q 'baseball-player-card-pwa-v274' service-worker.js
          grep -q '"version":"v2.74"' version.json

      - name: Commit release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html service-worker.js version.json manifest.webmanifest rescue.html styles.css \
            game-detail-enhancement.js game-detail-enhancement.css report-layout.js report-layout.css \
            cpbl-realtime.js npb-realtime.js live-static-update.js cpbl-cache-router.js landscape-state.js landscape-state.css \
            postseason-history.js postseason-history.css
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Release v2.74 add historical postseason browser'
            git push origin HEAD:main
          fi
