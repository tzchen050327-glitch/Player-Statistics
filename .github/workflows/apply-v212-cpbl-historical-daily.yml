name: Apply v2.12 CPBL historical daily fix

on:
  push:
    branches: [fix-v2.12-cpbl-historical-daily]
    paths:
      - 'scripts/patch-v212-cpbl-historical-daily.py'
      - '.github/workflows/apply-v212-cpbl-historical-daily.yml'

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Live smoke test Buchanan historical game
        shell: bash
        run: |
          set -euo pipefail
          readarray -t CFG < <(python3 - <<'PY'
          import re
          s=open('js/00-core-config.js',encoding='utf-8').read()
          for key in ['CPBL_API_URL','CPBL_APP_KEY','CPBL_ANON_KEY']:
              m=re.search(rf"const {key} = '([^']+)'",s)
              if not m: raise SystemExit(f'missing {key}')
              print(m.group(1))
          PY
          )
          API="${CFG[0]}"
          APP="${CFG[1]}"
          ANON="${CFG[2]}"

          PROFILE=$(curl -fsS -X POST "$API" -H 'content-type: application/json' \
            --data-binary "$(jq -nc --arg app "$APP" --arg anon "$ANON" '{action:"player-profile",acnt:"0000007570",appKey:$app,anonKey:$anon}')")
          CURRENT_TEAM=$(jq -r '.player.teamCode // empty' <<<"$PROFILE")
          test -n "$CURRENT_TEAM"
          echo "Current team code resolved; exercising historical lookup with current-team code."

          DAILY=$(curl -fsS -X POST "$API" -H 'content-type: application/json' \
            --data-binary "$(jq -nc --arg app "$APP" --arg anon "$ANON" --arg team "$CURRENT_TEAM" '{action:"daily",acnt:"0000007570",date:"2025-08-17",teamCode:$team,kindCode:"A",appKey:$app,anonKey:$anon}')")
          echo "$DAILY" | jq '{ok,found:.daily.found,kindCode:.daily.kindCode,game:.daily.game,pitcher:.daily.pitcher}'

          test "$(jq -r '.ok' <<<"$DAILY")" = "true"
          test "$(jq -r '.daily.found' <<<"$DAILY")" = "true"
          test "$(jq -r '.daily.kindCode' <<<"$DAILY")" = "A"
          test "$(jq -r '.daily.pitcher.innings' <<<"$DAILY")" = "9.0"
          test "$(jq -r '.daily.pitcher.decision' <<<"$DAILY")" = "W"
          test "$(jq -r '.daily.pitcher.cg' <<<"$DAILY")" = "true"
          test "$(jq -r '.daily.pitcher.sho' <<<"$DAILY")" = "true"

      - name: Apply v2.12 release wiring
        run: python3 scripts/patch-v212-cpbl-historical-daily.py

      - name: Validate version and archives
        run: |
          grep -Fq "const APP_VERSION = 'v2.12';" js/00-core-config.js
          grep -Fq 'v2.12' index.html
          grep -Fq 'baseball-player-card-pwa-v129' service-worker.js
          test -f 'index v2.11.html'
          test -f 'index v2.12.html'
          test ! -e 'index v2.10.html'

      - name: Syntax and deterministic build
        run: |
          for f in js/[0-9][0-9]-*.js; do node --check "$f"; done
          node --check app.js
          cp app.js /tmp/app-v212.js
          python3 scripts/build-app.py
          cmp -s /tmp/app-v212.js app.js

      - name: Commit v2.12
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'v2.12 fix CPBL historical daily lookup after team changes'
            git push
          fi
