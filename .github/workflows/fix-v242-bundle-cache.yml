name: Fix v2.42 cached bundle mismatch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-v242-bundle-cache.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use immutable app bundle
        run: |
          cp app.js app-v242.js
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8').replace('v2.42-ui1','v2.42-ui2').replace('./app.js?v=v2.42-ui2','./app-v242.js?v=v2.42-ui2'); p.write_text(s,encoding='utf-8')"
          python3 -c "from pathlib import Path; p=Path('service-worker.js'); s=p.read_text(encoding='utf-8').replace('baseball-player-card-pwa-v242-stable-1','baseball-player-card-pwa-v242-stable-2').replace('v2.42-ui1','v2.42-ui2').replace('./app.js?v=v2.42-ui2','./app-v242.js?v=v2.42-ui2').replace(\"url.pathname.endsWith('/app.js')\",\"(url.pathname.endsWith('/app.js') || url.pathname.endsWith('/app-v242.js'))\",1); p.write_text(s,encoding='utf-8')"
          node --check app-v242.js
          grep -q "const APP_VERSION = 'v2.42'" app-v242.js
          grep -q 'app-v242.js?v=v2.42-ui2' index.html
          grep -q 'baseball-player-card-pwa-v242-stable-2' service-worker.js
          git diff --check
      - name: Commit
        run: |
          git config user.name 'chatgpt-bundle'
          git config user.email 'actions@users.noreply.github.com'
          git add app-v242.js index.html service-worker.js
          git commit -m 'Pin v2.42 app bundle by filename'
          git push
