name: Apply v3.06 realtime + scoreboard timing

on:
  push:
    paths:
      - '.github/workflows/apply-v306.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v3.06 patch
        run: python .github/scripts/apply_v306.py
      - name: Syntax checks
        run: |
          node --check app.js
          node --check cpbl-realtime.js
          node --check npb-realtime.js
          node --check game-detail-enhancement.js
          node --check landscape-state.js
          node --check postseason-history.js
          node --check .github/scripts/smoke_v306.mjs
      - name: Verify release wiring
        run: |
          grep -q '"version":"v3.06"' version.json
          grep -q 'visibleInningCells' game-detail-enhancement.js
          grep -q 'refreshFromRealtimeSignal' cpbl-realtime.js
          grep -q 'void refreshFromRealtimeSignal(payload?.new)' cpbl-realtime.js
          test ! -e .github/scripts/apply_v304.py
          test ! -e .github/scripts/smoke_v304.mjs
          test ! -e .github/workflows/apply-v304.yml
          test -e .github/scripts/apply_v305.py
          test -e .github/scripts/smoke_v305.mjs
          test -e .github/workflows/apply-v305.yml
      - name: Production integration smoke
        run: node .github/scripts/smoke_v306.mjs
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v3.06 improve CPBL realtime and scoreboard timing" || exit 0
          git push
