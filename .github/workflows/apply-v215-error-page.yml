name: Apply v2.15 CPBL error page

on:
  push:
    branches: [feature-v2.15-error-page]
    paths:
      - 'scripts/patch-v215-error-page.py'
      - '.github/workflows/apply-v215-error-page.yml'

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply v2.15 patch
        run: python3 scripts/patch-v215-error-page.py

      - name: Validate error-page wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          config = Path('js/00-core-config.js').read_text(encoding='utf-8')
          cpbl = Path('js/06-provider-cpbl.js').read_text(encoding='utf-8')
          editor = Path('js/13-daily-editor.js').read_text(encoding='utf-8')
          controller = Path('js/15-render-controller.js').read_text(encoding='utf-8')
          styles = Path('styles.css').read_text(encoding='utf-8')
          sw = Path('service-worker.js').read_text(encoding='utf-8')
          assert "const APP_VERSION = 'v2.15';" in config
          assert "async function refreshCpblGameErrors" in cpbl
          assert "function renderCpblErrorsPage(player)" in cpbl
          assert "action:'game-errors'" in cpbl.replace(' ', '') or "'game-errors'" in cpbl
          assert 'id="playerErrorPageBtn"' in editor
          assert "selectedTab = 'errors';" in editor
          assert "selectedTab === 'errors'" in controller
          assert "error-management" in controller
          assert 'today-player-name-link' in styles
          assert 'error-player-card' in styles
          assert 'baseball-player-card-pwa-v132' in sw
          assert Path('index v2.14.html').exists()
          assert Path('index v2.15.html').exists()
          assert not Path('index v2.13.html').exists()
          PY

      - name: Syntax and deterministic build
        run: |
          for f in js/[0-9][0-9]-*.js; do node --check "$f"; done
          node --check app.js
          cp app.js /tmp/app-v215.js
          python3 scripts/build-app.py
          cmp -s /tmp/app-v215.js app.js

      - name: Browser smoke test
        run: |
          python3 -m http.server 8765 >/tmp/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          test -n "$CHROME"
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=7000 --dump-dom http://127.0.0.1:8765/index.html >/tmp/dom.html
          grep -Fq 'content="v2.15"' /tmp/dom.html
          grep -Fq 'v2.15' /tmp/dom.html

      - name: Commit v2.15
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'v2.15 add CPBL fielding error page'
            git push
          fi
