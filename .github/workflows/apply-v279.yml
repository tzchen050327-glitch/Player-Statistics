name: Apply v2.79 NPB CS advantage

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v279.yml'
      - '.github/scripts/apply_v279.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v2.79 patch
        run: python3 .github/scripts/apply_v279.py
      - name: Commit v2.79
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git add postseason-history.js app.js index.html service-worker.js version.json
          git commit -m "Release v2.79 NPB CS running score advantage"
          git push
