name: Probe CPBL timing fields

on:
  push:
    paths:
      - '.github/workflows/probe-cpbl-time.yml'
      - '.github/scripts/probe_cpbl_time.py'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe raw CPBL timing fields
        run: python .github/scripts/probe_cpbl_time.py
