name: Apply v2.22 CPBL status fix

on:
  push:
    branches: [feature-v2.22-cpbl-status-fix]
    paths:
      - 'scripts/patch-v222-cpbl-status-fix.py'
      - '.github/workflows/apply-v222-cpbl-status-fix.yml'

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v2.22 patch
        run: python3 scripts/patch-v222-cpbl-status-fix.py
      - name: Validate CPBL status rendering
        run: |
          grep -Fq "const APP_VERSION = 'v2.22'" js/00-core-config.js
          grep -Fq "const statusLabel = homeDailyGameStatusLabel(game);" js/11-home-international.js
          ! grep -Fq "league === 'CPBL' && status === 'final'" js/11-home-international.js
          grep -Fq "./app.js?v=v2.22" index.html
          grep -Fq "baseball-player-card-pwa-v139" service-worker.js
          test -f 'index v2.22.html'
          test -f 'index v2.21.html'
          test ! -f 'index v2.20.html'
      - name: Syntax and deterministic build
        run: |
          for f in js/[0-9][0-9]-*.js; do node --check "$f"; done
          node --check app.js
          cp app.js /tmp/app-committed.js
          python3 scripts/build-app.py
          cmp -s /tmp/app-committed.js app.js
      - name: Chrome mobile smoke test
        run: |
          python3 -m http.server 8765 >/tmp/player-stats-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$CHROME" ]; then exit 0; fi
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=411,900 --virtual-time-budget=9000 --dump-dom http://127.0.0.1:8765/index.html >/tmp/dom.html
          grep -Fq 'content="v2.22"' /tmp/dom.html
      - name: Commit v2.22
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html 'index v2.22.html' js/00-core-config.js js/11-home-international.js service-worker.js
          if [ -f 'index v2.20.html' ]; then git rm -f 'index v2.20.html'; fi
          git commit -m 'v2.22 fix CPBL pregame status rendering'
          git push origin HEAD:feature-v2.22-cpbl-status-fix
