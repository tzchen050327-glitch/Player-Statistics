name: Remove starter GS
on:
  push:
    branches: [main]
    paths: ['.github/workflows/remove-starter-gs.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sed -i "/out.push(\['GS', String(stats.starts)\]);/d" js/11-home-international.js
          python3 scripts/build-app.py
          node --check app.js
          git config user.name chatgpt-release
          git config user.email actions@users.noreply.github.com
          git add js/11-home-international.js app.js
          git commit -m 'Keep only G in pregame starter stats'
          git push
