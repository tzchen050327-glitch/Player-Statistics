name: Fix CPBL live lineup and base state

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-cpbl-live-lineup-base-v320.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch CPBL live state and version
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('game-detail-enhancement.js')
          s = p.read_text(encoding='utf-8')

          anchor = "if (String(data?.league || '').toUpperCase() !== 'CPBL') return data;"
          replacement = anchor + "\n    const hasLivePlays = Array.isArray(data?.plays) && data.plays.length > 0;\n    const liveStatus = String(data?.status || data?.game?.status || '').toLowerCase();\n    if (hasLivePlays || ['live','playing','inprogress','in_progress','final'].includes(liveStatus)) return data;"
          if 'const hasLivePlays =' not in s:
              if anchor not in s: raise SystemExit('pregame anchor not found')
              s = s.replace(anchor, replacement, 1)

          stale = "    const currentName=compactName(detail?.current?.batter?.fullName||detail?.current?.batter?.name||'');\n    const lastName=compactName(last?.batter?.fullName||last?.batter?.name||last?.batter||last?.hitter||'');\n    if(currentName && lastName && samePlayerName(currentName,lastName)) return true;\n\n"
          if stale in s:
              s = s.replace(stale, '', 1)

          old = "    return beforeKey!==afterKey && currentKey===beforeKey;"
          new = "    const hasCurrent = detail?.current?.baseState !== undefined && detail?.current?.baseState !== null\n      || detail?.current?.bases !== undefined && detail?.current?.bases !== null;\n    return hasCurrent && beforeKey!==afterKey && currentKey===beforeKey;"
          if old in s:
              s = s.replace(old, new, 1)
          elif 'return hasCurrent && beforeKey!==afterKey && currentKey===beforeKey;' not in s:
              raise SystemExit('base-state anchor not found')

          p.write_text(s, encoding='utf-8')

          # Version bump: current app is v2.77 -> v2.78 everywhere versioned.
          for name in ['index.html','app.js','service-worker.js','version.json','game-detail-enhancement.js']:
              q = Path(name)
              if q.exists():
                  t = q.read_text(encoding='utf-8')
                  t = t.replace('v2.77', 'v2.78').replace('VERSION 2.77', 'VERSION 2.78')
                  q.write_text(t, encoding='utf-8')

          # Bust explicit asset query versions in index when they use 2.77 without v.
          q = Path('index.html')
          if q.exists():
              t = q.read_text(encoding='utf-8')
              t = re.sub(r'([?&](?:v|ver|version)=)2\.77\b', r'\g<1>2.78', t)
              q.write_text(t, encoding='utf-8')

      - name: Syntax check
        run: node --check game-detail-enhancement.js

      - name: Verify fix
        run: |
          grep -q "const hasLivePlays" game-detail-enhancement.js
          grep -q "return hasCurrent && beforeKey!==afterKey && currentKey===beforeKey" game-detail-enhancement.js
          ! grep -q "samePlayerName(currentName,lastName)) return true" game-detail-enhancement.js
          grep -q "v2.78" game-detail-enhancement.js

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game-detail-enhancement.js index.html app.js service-worker.js version.json
          git diff --cached --quiet && exit 0
          git commit -m "v2.78 fix CPBL live lineup and base state [skip version bump]"
          git push
