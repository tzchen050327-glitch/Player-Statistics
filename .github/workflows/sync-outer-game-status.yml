name: Sync outer game status

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-outer-game-status.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch outer game status sync
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text(encoding='utf-8')
          old = s

          s = s.replace("const HOME_DAILY_GAMES_TTL = 2 * 60 * 1000;", "const HOME_DAILY_GAMES_TTL = 15 * 1000;")
          s = s.replace("return league === 'MLB' ? 2 * 60 * 1000 : league === 'NPB' ? 60 * 1000 : 30 * 1000;", "return league === 'MLB' ? 2 * 60 * 1000 : 15 * 1000;")
          s = s.replace("if (status === 'cancelled') return '取消／延期';", "if (status === 'cancelled') return '保留／延期／取消';")

          old_close = """      document.body.classList.remove('home-game-detail-open');\n      if (currentPage === 'home') scheduleHomeDailyGamesAutoRefresh();"""
          new_close = """      document.body.classList.remove('home-game-detail-open');\n      if (currentPage === 'home') {\n        renderHomeDailyGames();\n        scheduleHomeDailyGamesAutoRefresh();\n      }"""
          s = s.replace(old_close, new_close)

          old_fetch = """        homeGameDetailCache.set(key, { at:Date.now(), detail });\n        if (detail?.game?.id && !game.id) game.id = detail.game.id;\n        renderHomeGameDetail(detail, game);"""
          new_fetch = """        homeGameDetailCache.set(key, { at:Date.now(), detail });\n        if (detail?.game?.id && !game.id) game.id = detail.game.id;\n\n        // Keep the outer daily-game card in sync with the authoritative detail response.\n        // This is especially important for suspended/reserved games: the detail endpoint\n        // can know the game stopped before the schedule endpoint cache expires.\n        const detailStatus = String(detail?.status || '').toLowerCase();\n        if (detailStatus) game.status = detailStatus;\n        if (detail?.game) {\n          if (detail.game.awayScore !== undefined && detail.game.awayScore !== null) game.awayScore = detail.game.awayScore;\n          if (detail.game.homeScore !== undefined && detail.game.homeScore !== null) game.homeScore = detail.game.homeScore;\n          if (detail.game.inningLabel) game.inningLabel = detail.game.inningLabel;\n        }\n        const dailyKey = `${league}|${date}`;\n        const dailyCached = homeDailyGamesCache.get(dailyKey);\n        if (dailyCached && Array.isArray(dailyCached.games)) {\n          const target = dailyCached.games.find(item =>\n            (game.id && item?.id && String(item.id) === String(game.id)) ||\n            (String(item?.away || '') === String(game?.away || '') && String(item?.home || '') === String(game?.home || ''))\n          );\n          if (target) Object.assign(target, {\n            status: game.status,\n            awayScore: game.awayScore,\n            homeScore: game.homeScore,\n            inningLabel: game.inningLabel || target.inningLabel\n          });\n          dailyCached.at = Date.now();\n        }\n\n        renderHomeGameDetail(detail, game);"""
          s = s.replace(old_fetch, new_fetch)

          if s == old:
              raise SystemExit('Expected app.js patterns not found; no changes made.')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name 'chatgpt-fix'
          git config user.email 'actions@users.noreply.github.com'
          git add app.js
          git commit -m 'Sync outer card status with game detail'
          git push
