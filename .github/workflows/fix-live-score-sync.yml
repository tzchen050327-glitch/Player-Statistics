name: Fix live score sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-live-score-sync.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch home live refresh and score sync
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('js/11-home-international.js')
          s = p.read_text(encoding='utf-8')
          old = s
          s = s.replace('const HOME_GAME_DETAIL_AUTO_LIMIT = 120;', 'const HOME_GAME_DETAIL_AUTO_LIMIT = 2400;')
          s = s.replace('const HOME_DAILY_AUTO_REFRESH_LIMIT = 360;', 'const HOME_DAILY_AUTO_REFRESH_LIMIT = 2400;')
          s = s.replace("return league === 'MLB' ? 2 * 60 * 1000 : 60 * 1000;", "return league === 'MLB' ? 2 * 60 * 1000 : 15 * 1000;")
          s = s.replace("const delay = activeHomeGameDetail.league === 'NPB' ? 90 * 1000 : 60 * 1000;", 'const delay = 15 * 1000;')
          s = s.replace("}, globalThis.navigator?.connection?.saveData ? delay * 2 : delay);", '}, delay);')

          marker = "    function stopHomeGameDetailRefresh() {\n"
          helper = '''    function detailRunsFromScoreboard(detail, side) {\n      const values = Array.isArray(detail?.scoreboard?.[side]) ? detail.scoreboard[side] : [];\n      let total = 0;\n      let found = false;\n      for (const value of values) {\n        const raw = String(value ?? '').trim();\n        if (!/^\\d+$/.test(raw)) continue;\n        total += Number(raw);\n        found = true;\n      }\n      return found ? total : null;\n    }\n\n    function syncHomeDailyGameFromDetail(league, date, game, detail) {\n      const info = detail?.game || {};\n      const awayRuns = detailRunsFromScoreboard(detail, 'away');\n      const homeRuns = detailRunsFromScoreboard(detail, 'home');\n      const normalizedStatus = String(detail?.status || '').toLowerCase();\n      const apply = target => {\n        if (!target) return;\n        const awayScore = awayRuns !== null ? awayRuns : Number(info?.awayScore);\n        const homeScore = homeRuns !== null ? homeRuns : Number(info?.homeScore);\n        if (Number.isFinite(awayScore)) target.awayScore = awayScore;\n        if (Number.isFinite(homeScore)) target.homeScore = homeScore;\n        if (normalizedStatus) target.status = normalizedStatus;\n        if (info?.id && !target.id) target.id = info.id;\n      };\n      apply(game);\n      const daily = homeDailyGamesCache.get(`${league}|${date}`);\n      const games = Array.isArray(daily?.games) ? daily.games : [];\n      const target = games.find(item =>\n        (info?.id && item?.id && String(info.id) === String(item.id))\n        || (String(item?.away || '') === String(info?.away || game?.away || '')\n          && String(item?.home || '') === String(info?.home || game?.home || ''))\n      );\n      apply(target);\n    }\n\n'''
          if helper not in s:
              if marker not in s:
                  raise SystemExit('stopHomeGameDetailRefresh marker missing')
              s = s.replace(marker, helper + marker, 1)

          needle = "        homeGameDetailCache.set(key, { at:Date.now(), detail });\n"
          replacement = needle + "        syncHomeDailyGameFromDetail(league, date, game, detail);\n"
          if 'syncHomeDailyGameFromDetail(league, date, game, detail);' not in s:
              if needle not in s:
                  raise SystemExit('detail cache marker missing')
              s = s.replace(needle, replacement, 1)

          if s == old:
              raise SystemExit('No source changes made')
          p.write_text(s, encoding='utf-8')
          PY
          python3 scripts/build-app.py
          node --check app.js
      - name: Commit fix
        run: |
          git config user.name 'chatgpt-fix'
          git config user.email 'actions@users.noreply.github.com'
          git add js/11-home-international.js app.js
          git commit -m 'Sync live detail score to daily game cards'
          git push
