name: CPBL report season projection v3.24

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cpbl-report-season-projection-v324.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch report season projection
        shell: python
        run: |
          from pathlib import Path

          path = Path('app.js')
          text = path.read_text(encoding='utf-8')

          old = """    function seasonStatsForOutputRole(player, role) {
      const level = supportsLeagueLevelTabs(player) ? selectedLevel : 'A';
      const pair = roleStatsPair(player, selectedSeason, level);
"""
          new = """    function seasonStatsForOutputRole(player, role) {
      const level = supportsLeagueLevelTabs(player) ? selectedLevel : 'A';
      const projection = currentRecord?.cpblSeasonProjection;
      if (
        role === 'hitter'
        && level === 'A'
        && playerScope(player) === 'cpbl'
        && projection?.complete
        && projection?.stats
      ) {
        return mergeStats(projection.stats, hitterDefaults);
      }
      const pair = roleStatsPair(player, selectedSeason, level);
"""
          if old not in text:
              raise SystemExit('seasonStatsForOutputRole marker not found')
          text = text.replace(old, new, 1)

          old2 = """      const appliedRoles = await applyOfficialDailyRolesToRecord(daily, { confirmHitterOverwrite:true });
      if (!appliedRoles) return false;

      const isToday = els.gameDate.value === localISODate();
"""
          new2 = """      const appliedRoles = await applyOfficialDailyRolesToRecord(daily, { confirmHitterOverwrite:true });
      if (!appliedRoles) return false;
      currentRecord.cpblSeasonProjection = daily?.seasonProjection || null;

      const isToday = els.gameDate.value === localISODate();
"""
          if old2 not in text:
              raise SystemExit('daily import marker not found')
          text = text.replace(old2, new2, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Use CPBL pregame projection for daily reports" || exit 0
          git push
