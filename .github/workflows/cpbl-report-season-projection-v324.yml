name: CPBL report season projection v3.24

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cpbl-report-season-projection-v324.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch report season projection
        shell: python
        run: |
          from pathlib import Path
          path = Path('app.js')
          text = path.read_text(encoding='utf-8')

          old = (
              "    function seasonStatsForOutputRole(player, role) {\n"
              "      const level = supportsLeagueLevelTabs(player) ? selectedLevel : 'A';\n"
              "      const pair = roleStatsPair(player, selectedSeason, level);\n"
          )
          new = (
              "    function seasonStatsForOutputRole(player, role) {\n"
              "      const level = supportsLeagueLevelTabs(player) ? selectedLevel : 'A';\n"
              "      const projection = currentRecord?.cpblSeasonProjection;\n"
              "      if (\n"
              "        role === 'hitter'\n"
              "        && level === 'A'\n"
              "        && playerScope(player) === 'cpbl'\n"
              "        && projection?.complete\n"
              "        && projection?.stats\n"
              "      ) {\n"
              "        return mergeStats(projection.stats, hitterDefaults);\n"
              "      }\n"
              "      const pair = roleStatsPair(player, selectedSeason, level);\n"
          )
          if old not in text:
              raise SystemExit('seasonStatsForOutputRole marker not found')
          text = text.replace(old, new, 1)

          old2 = (
              "      const appliedRoles = await applyOfficialDailyRolesToRecord(daily, { confirmHitterOverwrite:true });\n"
              "      if (!appliedRoles) return false;\n"
              "\n"
              "      const isToday = els.gameDate.value === localISODate();\n"
          )
          new2 = (
              "      const appliedRoles = await applyOfficialDailyRolesToRecord(daily, { confirmHitterOverwrite:true });\n"
              "      if (!appliedRoles) return false;\n"
              "      currentRecord.cpblSeasonProjection = daily?.seasonProjection || null;\n"
              "\n"
              "      const isToday = els.gameDate.value === localISODate();\n"
          )
          if old2 not in text:
              raise SystemExit('daily import marker not found')
          text = text.replace(old2, new2, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Use CPBL pregame projection for daily reports" || exit 0
          git push
