name: Temporary inline PA editor v3.40

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_temp_pa_inline_v340.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply v3.40 patch
        run: python3 .github/scripts/apply_v340.py
      - name: Build and verify
        run: |
          python3 scripts/build-app.py
          python3 scripts/build-app.py --check
          node --check app.js
      - name: Remove temporary files and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_temp_pa_inline_v340.yml .github/scripts/apply_v340.py
          git add version.json index.html service-worker.js app.js js
          git commit -m "Show specific PA results and edit inline v3.40 [skip version bump]"
          git push
