name: CPBL lineup probe
on:
  push:
    paths:
      - ".github/workflows/cpbl-lineup-probe.yml"
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe CPBL box
        shell: python
        run: |
          import requests, re
          u="https://www.cpbl.com.tw/box/index?gameSno=283&kindCode=A&year=2026"
          r=requests.get(u,headers={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36"},timeout=30,allow_redirects=True)
          print("STATUS",r.status_code)
          print("URL",r.url)
          print("CT",r.headers.get("content-type"))
          print("LEN",len(r.text))
          print("HAS_TOKEN",bool(re.search(r'name=["\\\']__RequestVerificationToken["\\\'][^>]*value=["\\\']([^"\\\']+)["\\\']',r.text,re.I)))
          print("HEAD",r.text[:500].replace("\n"," "))
