name: Bump v3.27 defense positions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-v327-defense.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set v3.27
        shell: python
        run: |
          import json, re
          from pathlib import Path
          new='v3.27'
          Path('version.json').write_text(json.dumps({'version':new},ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          p=Path('index.html'); s=p.read_text(encoding='utf-8'); s=re.sub(r'(<meta\s+name="app-version"\s+content=")v\d+\.\d+("\s*/?>)',rf'\g<1>{new}\2',s,count=1); s=re.sub(r'\?v=v\d+\.\d+',f'?v={new}',s); s=re.sub(r'(id="appVersionBadge"[^>]*>)v\d+\.\d+(</button>)',rf'\g<1>{new}\2',s,count=1); p.write_text(s,encoding='utf-8')
          p=Path('app.js'); s=p.read_text(encoding='utf-8'); s=re.sub(r"const APP_VERSION = 'v\d+\.\d+';",f"const APP_VERSION = '{new}';",s,count=1); s=re.sub(r'\?v=v\d+\.\d+',f'?v={new}',s); p.write_text(s,encoding='utf-8')
          p=Path('service-worker.js'); s=p.read_text(encoding='utf-8'); s=re.sub(r'\?v=v\d+\.\d+',f'?v={new}',s); s=re.sub(r"const CACHE_NAME = '[^']+';","const CACHE_NAME = 'baseball-player-card-pwa-v327-auto';",s,count=1); p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json index.html app.js service-worker.js
          git commit -m "chore: bump app version to v3.27 [skip version bump]" || exit 0
          git push
