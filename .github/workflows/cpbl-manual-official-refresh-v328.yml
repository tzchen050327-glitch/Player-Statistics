name: CPBL manual official refresh v3.28

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cpbl-manual-official-refresh-v328.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add manual CPBL official refresh and bump version
        shell: python
        run: |
          import json, re
          from pathlib import Path

          # index.html: add a manual official refresh button on player page.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'id="forceOfficialRefreshBtn"' not in s:
              marker = '''        <div class="player-page-right">\n          <div class="season-field">'''
              repl = '''        <div class="player-page-right">\n          <button id="forceOfficialRefreshBtn" class="press-btn hidden" type="button">重新抓官方個人頁</button>\n          <div class="season-field">'''
              if marker not in s:
                  raise SystemExit('player-page-right marker not found')
              s = s.replace(marker, repl, 1)
          p.write_text(s, encoding='utf-8')

          # app.js: endpoint constant.
          p = Path('app.js')
          s = p.read_text(encoding='utf-8')
          if 'CPBL_OFFICIAL_REFRESH_API_URL' not in s:
              marker = "    const CPBL_DAILY_CACHE_API_URL = 'https://kjndnsztbcpmkhictjkr.supabase.co/functions/v1/cpbl-daily-cache';"
              repl = marker + "\n    const CPBL_OFFICIAL_REFRESH_API_URL = 'https://kjndnsztbcpmkhictjkr.supabase.co/functions/v1/cpbl-official-season-refresh';"
              if marker not in s:
                  raise SystemExit('daily cache constant marker not found')
              s = s.replace(marker, repl, 1)

          # Add safe manual refresh function before season stat applier.
          if 'async function forceOfficialSeasonRefresh' not in s:
              marker = '    function applyCpblSeasonStatsToPlayer(player, stats, year, kindCode = selectedLevel) {'
              if marker not in s:
                  raise SystemExit('applyCpblSeasonStatsToPlayer marker not found')
              fn = r'''    async function forceOfficialSeasonRefresh() {
      const player = selectedPlayer();
      if (!player || playerScope(player) !== 'cpbl') return;
      if (!player.cpblAcnt) {
        setStatus('此球員尚未連結中職官網。', true);
        return;
      }
      const btn = document.getElementById('forceOfficialRefreshBtn');
      const original = btn?.textContent || '重新抓官方個人頁';
      if (btn) {
        btn.disabled = true;
        btn.textContent = '抓取中…';
      }
      try {
        const response = await fetch(CPBL_OFFICIAL_REFRESH_API_URL, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            appKey: CPBL_APP_KEY,
            acnt: player.cpblAcnt,
            year: selectedSeason,
            kindCode: selectedLevel,
            date: String(els.gameDate?.value || ''),
            teamCode: player.cpblTeamCode || ''
          })
        });
        const data = await response.json().catch(() => null);
        if (!response.ok || !data?.ok || !data?.stats) {
          throw new Error(data?.error || `官方個人頁更新失敗（${response.status}）`);
        }
        applyCpblSeasonStatsToPlayer(player, data.stats, selectedSeason, selectedLevel);
        await savePlayer(player);
        await markSuccessfulSeasonSyncMeta();
        try { await loadRecord(); } catch (error) { console.warn('手動官方更新後重新載入單場失敗', error); }
        renderAll();
        if (data.officialCaughtUp === false) {
          setStatus('CPBL 個人選手頁尚未完成結算；已保留 Supabase 暫算值，單場 Box 的勝敗／救援／中繼仍會套用。');
        } else {
          setStatus('CPBL 個人選手頁已完成結算，已切換為官方正式累積成績。');
        }
      } catch (error) {
        console.warn('手動抓取 CPBL 官方個人頁失敗', error);
        setStatus(error?.message || '手動抓取官方個人頁失敗。', true);
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.textContent = original;
        }
      }
    }

    document.addEventListener('click', event => {
      const btn = event.target?.closest?.('#forceOfficialRefreshBtn');
      if (!btn) return;
      forceOfficialSeasonRefresh();
    });

'''
              s = s.replace(marker, fn + marker, 1)

          # Show manual button only on a linked CPBL player page.
          marker = "      const errorPageActive = playerPageActive && selectedTab === 'errors' && playerScope(player) === 'cpbl';"
          if 'forceOfficialRefreshBtn' not in s[s.find('function renderAll()'):s.find('function renderAll()')+1200]:
              repl = marker + "\n      const forceOfficialRefreshBtn = document.getElementById('forceOfficialRefreshBtn');\n      if (forceOfficialRefreshBtn) {\n        const showOfficialRefresh = playerPageActive && playerScope(player) === 'cpbl' && Boolean(player?.cpblAcnt);\n        forceOfficialRefreshBtn.classList.toggle('hidden', !showOfficialRefresh);\n      }"
              if marker not in s:
                  raise SystemExit('renderAll marker not found')
              s = s.replace(marker, repl, 1)

          new='v3.28'
          s=re.sub(r"const APP_VERSION = 'v\d+\.\d+';",f"const APP_VERSION = '{new}';",s,count=1)
          s=re.sub(r'\?v=v\d+\.\d+',f'?v={new}',s)
          p.write_text(s,encoding='utf-8')

          # Version references.
          Path('version.json').write_text(json.dumps({'version':new},ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          p=Path('index.html'); s=p.read_text(encoding='utf-8'); s=re.sub(r'(<meta\s+name="app-version"\s+content=")v\d+\.\d+("\s*/?>)',rf'\g<1>{new}\2',s,count=1); s=re.sub(r'\?v=v\d+\.\d+',f'?v={new}',s); s=re.sub(r'(id="appVersionBadge"[^>]*>)v\d+\.\d+(</button>)',rf'\g<1>{new}\2',s,count=1); p.write_text(s,encoding='utf-8')
          p=Path('service-worker.js'); s=p.read_text(encoding='utf-8'); s=re.sub(r'\?v=v\d+\.\d+',f'?v={new}',s); s=re.sub(r"const CACHE_NAME = '[^']+';","const CACHE_NAME = 'baseball-player-card-pwa-v328-auto';",s,count=1); p.write_text(s,encoding='utf-8')

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js version.json service-worker.js
          git commit -m "Add safe manual CPBL official refresh v3.28 [skip version bump]" || exit 0
          git push
