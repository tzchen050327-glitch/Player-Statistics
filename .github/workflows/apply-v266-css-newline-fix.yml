name: Apply v2.66 CSS newline fix
on:
  push:
    paths:
      - '.github/v266-css-newline-fix-trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix runner live info CSS newlines and sync v2.66
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('game-detail-enhancement.css')
          s = p.read_text(encoding='utf-8')
          start_marker = '/* ===== v2.65 RUNNER LIVE INFO ===== */'
          end_marker = '/* ===== v2.65 RUNNER LIVE INFO END ===== */'
          if start_marker not in s or end_marker not in s:
              raise SystemExit('runner live info block not found')
          start = s.index(start_marker)
          end = s.index(end_marker, start) + len(end_marker)
          block = s[start:end].replace('\\n', '\n')
          s = s[:start] + block + s[end:]
          p.write_text(s, encoding='utf-8')

          files = [
              'app.js','index.html','service-worker.js','game-detail-enhancement.js',
              'game-detail-enhancement.css','report-layout.js','report-layout.css',
              'cpbl-realtime.js','live-static-update.js','cpbl-cache-router.js',
              'landscape-state.js','landscape-state.css','manifest.webmanifest',
              'rescue.html','styles.css'
          ]
          for name in files:
              p = Path(name)
              if not p.exists():
                  continue
              t = p.read_text(encoding='utf-8')
              t = t.replace('v2.65','v2.66').replace('v265','v266').replace('V265','V266')
              t = t.replace('pwa-v265','pwa-v266')
              p.write_text(t, encoding='utf-8')
          Path('version.json').write_text('{"version":"v2.66"}\n', encoding='utf-8')
          PY
      - name: Verify v2.66
        shell: bash
        run: |
          node --check app.js
          node --check game-detail-enhancement.js
          grep -q '"version":"v2.66"' version.json
          grep -q "APP_VERSION = 'v2.66'" app.js
          grep -q "baseball-player-card-pwa-v266" service-worker.js
          if grep -q '\\n@media' game-detail-enhancement.css; then exit 1; fi
          grep -q 'v2.66 RUNNER LIVE INFO' game-detail-enhancement.css
      - name: Commit v2.66
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html service-worker.js game-detail-enhancement.js game-detail-enhancement.css report-layout.js report-layout.css cpbl-realtime.js live-static-update.js cpbl-cache-router.js landscape-state.js landscape-state.css manifest.webmanifest rescue.html styles.css version.json
          git commit -m 'Release v2.66 fix runner live info CSS formatting'
          git push
