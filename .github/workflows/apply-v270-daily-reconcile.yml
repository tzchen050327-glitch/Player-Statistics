name: Apply v2.70 daily reconcile release
on:
  push:
    paths:
      - '.github/v270-daily-reconcile-trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync active app versions to v2.70
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          files = [
              'app.js','index.html','service-worker.js','game-detail-enhancement.js',
              'game-detail-enhancement.css','report-layout.js','report-layout.css',
              'cpbl-realtime.js','live-static-update.js','cpbl-cache-router.js',
              'landscape-state.js','landscape-state.css','manifest.webmanifest',
              'rescue.html','styles.css'
          ]
          for name in files:
              p = Path(name)
              if not p.exists():
                  continue
              t = p.read_text(encoding='utf-8')
              t = t.replace('v2.69','v2.70').replace('v269','v270').replace('V269','V270')
              t = t.replace('pwa-v269','pwa-v270')
              # manifest start_url had been stranded at an older release.
              if name == 'manifest.webmanifest':
                  import re
                  t = re.sub(r'"start_url"\s*:\s*"\.\/index\.html\?v=v2\.\d+"', '"start_url": "./index.html?v=v2.70"', t)
              p.write_text(t, encoding='utf-8')
          Path('version.json').write_text('{"version":"v2.70"}\n', encoding='utf-8')
          PY
      - name: Verify v2.70
        shell: bash
        run: |
          node --check app.js
          node --check game-detail-enhancement.js
          node --check cpbl-realtime.js
          node --check live-static-update.js
          grep -q "APP_VERSION = 'v2.70'" app.js
          grep -q 'baseball-player-card-pwa-v270' service-worker.js
          grep -q '"version":"v2.70"' version.json
          grep -q 'index.html?v=v2.70' manifest.webmanifest
          grep -q 'game-detail-enhancement.css?v=v2.70' index.html
      - name: Commit v2.70
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html service-worker.js game-detail-enhancement.js game-detail-enhancement.css report-layout.js report-layout.css cpbl-realtime.js live-static-update.js cpbl-cache-router.js landscape-state.js landscape-state.css manifest.webmanifest rescue.html styles.css version.json
          git commit -m 'Release v2.70 reconcile CPBL daily plate appearances and RBI'
          git push
