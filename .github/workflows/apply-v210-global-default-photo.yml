name: Apply v2.10 global default photo

on:
  push:
    branches: [feature-v2.10-global-default-photo]
    paths:
      - 'scripts/patch-v210-global-default-photo.py'
      - '.github/workflows/apply-v210-global-default-photo.yml'

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply v2.10 patch and build
        run: python3 scripts/patch-v210-global-default-photo.py

      - name: Validate global fallback wiring
        run: |
          test -s assets/default-hitter.jpg
          test -s assets/default-pitcher.jpg
          file assets/default-hitter.jpg | grep -qi 'JPEG image data'
          file assets/default-pitcher.jpg | grep -qi 'JPEG image data'
          grep -Fq "const APP_VERSION = 'v2.10';" js/00-core-config.js
          grep -Fq "function effectiveDefaultPhotoRole(player, roleHint = '')" js/18-canvas-utils.js
          grep -Fq "async function resolvePlayerDisplayPhoto(player, roleHint = '')" js/18-canvas-utils.js
          grep -Fq "resolvePlayerDisplayPhoto(player, effectiveType)" js/16-daily-canvas.js
          grep -Fq "resolvePlayerDisplayPhoto(player,role)" js/21-annual-report.js
          grep -Fq "id=\"activePlayerPhotoPreview\"" js/14-photo-template-ui.js
          grep -Fq "defaultRolePhotoUrl(defaultRole)" js/14-photo-template-ui.js
          grep -Fq "沒有上傳照片時會自動使用這張" js/14-photo-template-ui.js
          grep -Fq "CPBL, NPB, KBO" js/18-canvas-utils.js
          grep -Fq "MLB/MiLB and international" js/18-canvas-utils.js
          grep -Fq "./assets/default-hitter.jpg?v=v2.10" service-worker.js
          grep -Fq "./assets/default-pitcher.jpg?v=v2.10" service-worker.js
          test -f 'index v2.09.html'
          test -f 'index v2.10.html'
          test ! -e 'index v2.08.html'

      - name: Syntax check all modules and bundle
        run: |
          for f in js/[0-9][0-9]-*.js; do node --check "$f"; done
          node --check app.js

      - name: Verify deterministic bundle
        run: |
          cp app.js /tmp/app-v210.js
          python3 scripts/build-app.py
          cmp -s /tmp/app-v210.js app.js

      - name: Smoke test application and fallback assets
        run: |
          python3 -m http.server 8765 >/tmp/player-stats-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          curl -fsS http://127.0.0.1:8765/assets/default-hitter.jpg >/tmp/default-hitter.jpg
          curl -fsS http://127.0.0.1:8765/assets/default-pitcher.jpg >/tmp/default-pitcher.jpg
          test -s /tmp/default-hitter.jpg
          test -s /tmp/default-pitcher.jpg
          CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          if [ -n "$CHROME" ]; then
            "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=7000 --dump-dom http://127.0.0.1:8765/index.html >/tmp/dom.html
            grep -Fq 'id="cardCanvas"' /tmp/dom.html
            grep -Fq 'content="v2.10"' /tmp/dom.html
          fi

      - name: Commit v2.10
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'v2.10 apply default hitter and pitcher photos across all scopes'
            git push
          fi
