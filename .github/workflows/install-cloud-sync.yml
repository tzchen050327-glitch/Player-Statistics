name: Install cloud sync integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-cloud-sync.yml'

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch bootstrap and keep v2.40 stable
        run: |
          python - <<'PY'
          from pathlib import Path

          core = Path('js/00-core-config.js')
          text = core.read_text(encoding='utf-8')
          text = text.replace("v2.33", "v2.40")
          core.write_text(text, encoding='utf-8')

          bootstrap = Path('js/23-bootstrap.js')
          text = bootstrap.read_text(encoding='utf-8')
          needle = """        players = await idbGetAll(STORES.players);\n        photos = await idbGetAll(STORES.photos);\n"""
          replacement = """        players = await idbGetAll(STORES.players);\n        photos = await idbGetAll(STORES.photos);\n        if (typeof cloudSyncInitialMerge === 'function') {\n          await cloudSyncInitialMerge();\n        }\n"""
          if replacement not in text:
              if needle not in text:
                  raise SystemExit('bootstrap local-load anchor not found')
              text = text.replace(needle, replacement, 1)
          bootstrap.write_text(text, encoding='utf-8')

          cloud = Path('js/07a-cloud-sync.js')
          text = cloud.read_text(encoding='utf-8')
          text = text.replace(
              "      if (typeof renderAll === 'function') renderAll();",
              "      if (els?.gameDate?.value && typeof renderAll === 'function') renderAll();"
          )
          cloud.write_text(text, encoding='utf-8')

          sw = Path('service-worker.js')
          sw_text = sw.read_text(encoding='utf-8')
          sw_text = sw_text.replace("baseball-player-card-pwa-v240-stable-2", "baseball-player-card-pwa-v240-stable-3")
          sw.write_text(sw_text, encoding='utf-8')
          PY

          python3 scripts/build-app.py
          node --check app.js
          grep -q "const APP_VERSION = 'v2.40';" app.js
          grep -q "07a-cloud-sync.js" js/module-order.txt
          grep -q "cloudSyncInitialMerge" js/23-bootstrap.js

      - name: Commit built cloud sync
        run: |
          git config user.name 'chatgpt-cloud-sync'
          git config user.email 'actions@users.noreply.github.com'
          git add js/00-core-config.js js/07a-cloud-sync.js js/23-bootstrap.js app.js service-worker.js
          git commit -m 'Add selective cloud sync groups'
          git push
