name: Fix live refresh intervals

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-live-refresh-intervals.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch live refresh intervals and rebuild
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path('js/11-home-international.js')
          text = target.read_text(encoding='utf-8')
          old = text

          # Outer daily-game cards: CPBL/KBO 30s, NPB 45s, MLB 120s.
          text = text.replace(
              "return league === 'MLB' ? 2 * 60 * 1000 : league === 'NPB' ? 60 * 1000 : 30 * 1000;",
              "return league === 'MLB' ? 2 * 60 * 1000 : league === 'NPB' ? 45 * 1000 : 30 * 1000;"
          )

          # Single-game LIVE detail should stay CPBL 30s / NPB 45s.
          expected = "const delay = activeHomeGameDetail.league === 'NPB' ? 45 * 1000 : 30 * 1000;"
          if expected not in text:
              raise SystemExit('single-game refresh interval is not CPBL 30s / NPB 45s')

          if text == old:
              raise SystemExit('no source changes made')

          target.write_text(text, encoding='utf-8')
          print('patched', target)
          PY

          python3 scripts/build-app.py
          node --check app.js

      - name: Commit fix
        run: |
          git config user.name 'chatgpt-fix'
          git config user.email 'actions@users.noreply.github.com'
          git add js/11-home-international.js app.js
          git commit -m 'Align CPBL and NPB live refresh intervals'
          git push
