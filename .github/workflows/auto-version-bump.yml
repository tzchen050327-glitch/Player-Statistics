name: Auto bump app version

on:
  push:
    branches:
      - main
    paths:
      - '*.js'
      - '*.css'
      - '*.html'
      - 'js/**'
      - '.github/scripts/**'
      - 'manifest.webmanifest'

permissions:
  contents: write

jobs:
  bump-version:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip version bump]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump visible app version
        shell: python
        run: |
          import json
          import re
          from pathlib import Path

          version_path = Path('version.json')
          index_path = Path('index.html')
          sw_path = Path('service-worker.js')

          data = json.loads(version_path.read_text(encoding='utf-8'))
          old = str(data.get('version', '')).strip()
          m = re.fullmatch(r'v(\d+)\.(\d+)', old)
          if not m:
              raise SystemExit(f'Unsupported version format: {old!r}')

          major = int(m.group(1))
          revision = int(m.group(2)) + 1
          new = f'v{major}.{revision}'

          version_path.write_text(json.dumps({'version': new}, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          index = index_path.read_text(encoding='utf-8')
          if old not in index:
              raise SystemExit(f'{old} not found in index.html')
          index_path.write_text(index.replace(old, new), encoding='utf-8')

          sw = sw_path.read_text(encoding='utf-8')
          sw = sw.replace(old, new)
          cache_tag = f'v{major}{revision}'
          sw = re.sub(
              r"const CACHE_NAME = '[^']+';",
              f"const CACHE_NAME = 'baseball-player-card-pwa-{cache_tag}-auto';",
              sw,
              count=1,
          )
          sw_path.write_text(sw, encoding='utf-8')

          print(f'{old} -> {new}')

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json index.html service-worker.js
          git commit -m "chore: auto bump app version [skip version bump]" || exit 0
          git push
