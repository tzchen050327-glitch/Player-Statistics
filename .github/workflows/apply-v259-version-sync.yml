name: Apply v2.59 version sync
on:
  push:
    paths:
      - '.github/v259-version-sync-trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync all active app resource versions to v2.59
        shell: bash
        run: |
          set -euo pipefail
          files=(
            app.js index.html service-worker.js
            game-detail-enhancement.js game-detail-enhancement.css
            report-layout.js report-layout.css
            cpbl-realtime.js live-static-update.js cpbl-cache-router.js
            manifest.webmanifest rescue.html styles.css
          )
          for f in "${files[@]}"; do
            if [ -f "$f" ]; then
              sed -i 's/v2\.58/v2.59/g; s/v258/v259/g; s/V258/V259/g; s/pwa-v258/pwa-v259/g' "$f"
            fi
          done
      - name: Syntax check
        run: |
          node --check app.js
          node --check game-detail-enhancement.js
          [ ! -f cpbl-realtime.js ] || node --check cpbl-realtime.js
          [ ! -f report-layout.js ] || node --check report-layout.js
          [ ! -f live-static-update.js ] || node --check live-static-update.js
      - name: Commit v2.59
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html service-worker.js game-detail-enhancement.js game-detail-enhancement.css report-layout.js report-layout.css cpbl-realtime.js live-static-update.js cpbl-cache-router.js manifest.webmanifest rescue.html styles.css 2>/dev/null || true
          git commit -m 'Release v2.59 CPBL live data authority split'
          git push
