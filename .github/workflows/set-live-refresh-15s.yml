name: Set live refresh 15s

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/set-live-refresh-15s.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update live refresh interval
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text(encoding='utf-8')
          old = s
          s = s.replace('const HOME_GAME_DETAIL_AUTO_LIMIT = 120;', 'const HOME_GAME_DETAIL_AUTO_LIMIT = 2400;')
          s = s.replace("const delay = activeHomeGameDetail.league === 'NPB' ? 90 * 1000 : 60 * 1000;", 'const delay = 15 * 1000;')
          s = s.replace("}, globalThis.navigator?.connection?.saveData ? delay * 2 : delay);", '}, delay);')
          if s == old:
              raise SystemExit('Expected live refresh code was not found; no changes made.')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name 'chatgpt-fix'
          git config user.email 'actions@users.noreply.github.com'
          git add app.js
          git commit -m 'Refresh live game detail every 15 seconds'
          git push
