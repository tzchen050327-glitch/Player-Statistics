name: Add CPBL games stat and release v2.43

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-cpbl-games-v243.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch CPBL starter stats and version
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('js/11-home-international.js')
          s = p.read_text(encoding='utf-8')
          old = """      if (String(stats.whip ?? '').trim()) out.push(['WHIP', String(stats.whip)]);\n      if (String(stats.starts ?? '').trim()) out.push(['GS', String(stats.starts)]);\n      else if (String(stats.games ?? '').trim()) out.push(['G', String(stats.games)]);\n      return out.slice(0, 9);"""
          new = """      if (String(stats.whip ?? '').trim()) out.push(['WHIP', String(stats.whip)]);\n      if (String(stats.starts ?? '').trim()) out.push(['GS', String(stats.starts)]);\n      if (String(stats.games ?? '').trim()) out.push(['G', String(stats.games)]);\n      return out.slice(0, 10);"""
          if old not in s:
              raise SystemExit('starter stat block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('js/00-core-config.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("const APP_VERSION = 'v2.42';", "const APP_VERSION = 'v2.43';", 1)
          s = s.replace('./assets/default-hitter.jpg?v=v2.42', './assets/default-hitter.jpg?v=v2.43')
          s = s.replace('./assets/default-pitcher.jpg?v=v2.42', './assets/default-pitcher.jpg?v=v2.43')
          p.write_text(s, encoding='utf-8')

          p = Path('game-detail-enhancement.js')
          s = p.read_text(encoding='utf-8').replace("|| 'v2.42';", "|| 'v2.43';", 1)
          p.write_text(s, encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('content="v2.42"', 'content="v2.43"', 1)
          s = s.replace('>v2.42</button>', '>v2.43</button>', 1)
          s = s.replace('./styles.css?v=v2.42-ui2', './styles.css?v=v2.43-ui1')
          s = s.replace('./game-detail-enhancement.css?v=v2.42-ui2', './game-detail-enhancement.css?v=v2.43-ui1')
          s = s.replace('./app-v242.js?v=v2.42-ui2', './app.js?v=v2.43')
          s = s.replace('./game-detail-enhancement.js?v=v2.42-ui3', './game-detail-enhancement.js?v=v2.43-ui1')
          p.write_text(s, encoding='utf-8')

          p = Path('manifest.webmanifest')
          s = p.read_text(encoding='utf-8').replace('./index.html?v=v2.42', './index.html?v=v2.43')
          p.write_text(s, encoding='utf-8')

          Path('version.json').write_text('{"version":"v2.43"}\n', encoding='utf-8')

          p = Path('service-worker.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("const CACHE_NAME = 'baseball-player-card-pwa-v242-stable-3';", "const CACHE_NAME = 'baseball-player-card-pwa-v243-stable-1';", 1)
          s = s.replace('./styles.css?v=v2.42-ui2', './styles.css?v=v2.43-ui1')
          s = s.replace('./app-v242.js?v=v2.42-ui2', './app.js?v=v2.43')
          s = s.replace('./game-detail-enhancement.css?v=v2.42-ui2', './game-detail-enhancement.css?v=v2.43-ui1')
          s = s.replace('./game-detail-enhancement.js?v=v2.42-ui3', './game-detail-enhancement.js?v=v2.43-ui1')
          s = s.replace('./index.html?v=v2.42', './index.html?v=v2.43')
          s = s.replace('__v242', '__v243')
          s = s.replace("(url.pathname.endsWith('/app.js') || url.pathname.endsWith('/app-v242.js'))", "url.pathname.endsWith('/app.js')")
          p.write_text(s, encoding='utf-8')
          PY

          python3 scripts/build-app.py
          node --check app.js
          node --check game-detail-enhancement.js
          grep -Fq "out.push(['GS', String(stats.starts)])" js/11-home-international.js
          grep -Fq "out.push(['G', String(stats.games)])" js/11-home-international.js
          grep -Fq "return out.slice(0, 10);" js/11-home-international.js
          grep -Fq "const APP_VERSION = 'v2.43';" app.js
          grep -Fq './app.js?v=v2.43' index.html
          grep -Fq './app.js?v=v2.43' service-worker.js
          grep -Fq 'baseball-player-card-pwa-v243-stable-1' service-worker.js
          git diff --check

      - name: Commit release
        run: |
          git config user.name 'chatgpt-release'
          git config user.email 'actions@users.noreply.github.com'
          git add js/11-home-international.js js/00-core-config.js app.js index.html manifest.webmanifest service-worker.js version.json game-detail-enhancement.js
          git commit -m 'Show CPBL games played in starter cards and release v2.43'
          git push
