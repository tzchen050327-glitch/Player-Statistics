name: Apply v2.11 default artwork

on:
  push:
    branches: [feature-v2.11-default-art-replacement]
    paths:
      - 'scripts/patch-v211-default-art.py'
      - '.github/workflows/apply-v211-default-art.yml'

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply v2.11 patch
        run: python3 scripts/patch-v211-default-art.py

      - name: Validate artwork and wiring
        run: |
          test -s assets/default-hitter.jpg
          test -s assets/default-pitcher.jpg
          file assets/default-hitter.jpg | grep -qi 'JPEG image data'
          file assets/default-pitcher.jpg | grep -qi 'JPEG image data'
          grep -Fq "const APP_VERSION = 'v2.11';" js/00-core-config.js
          grep -Fq "./assets/default-hitter.jpg?v=v2.11" js/00-core-config.js
          grep -Fq "./assets/default-pitcher.jpg?v=v2.11" js/00-core-config.js
          grep -Fq "resolvePlayerDisplayPhoto" js/16-daily-canvas.js
          grep -Fq "resolvePlayerDisplayPhoto" js/21-annual-report.js
          grep -Fq "activePlayerPhotoPreview" js/14-photo-template-ui.js
          test -f 'index v2.10.html'
          test -f 'index v2.11.html'
          test ! -e 'index v2.09.html'

      - name: Syntax and deterministic build checks
        run: |
          for f in js/[0-9][0-9]-*.js; do node --check "$f"; done
          node --check app.js
          cp app.js /tmp/app-v211.js
          python3 scripts/build-app.py
          cmp -s /tmp/app-v211.js app.js

      - name: Smoke test assets and app
        run: |
          python3 -m http.server 8765 >/tmp/http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          sleep 1
          curl -fsS http://127.0.0.1:8765/assets/default-hitter.jpg >/tmp/h.jpg
          curl -fsS http://127.0.0.1:8765/assets/default-pitcher.jpg >/tmp/p.jpg
          test -s /tmp/h.jpg
          test -s /tmp/p.jpg
          curl -fsS http://127.0.0.1:8765/index.html | grep -Fq 'v2.11'

      - name: Commit v2.11
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'v2.11 replace default hitter and pitcher artwork'
            git push
          fi
