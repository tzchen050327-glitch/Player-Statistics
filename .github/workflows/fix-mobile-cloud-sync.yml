name: Fix mobile cloud sync control

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-mobile-cloud-sync.yml'

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix mobile cloud control and home tabs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cloud = Path('js/07a-cloud-sync.js')
          text = cloud.read_text(encoding='utf-8')

          old_create = """        button.id = 'cloudSyncBtn';
        button.className = 'cloud-sync-header-btn';
        button.type = 'button';
        button.textContent = '雲端同步';
        button.addEventListener('click', () => {
"""
          new_create = """        button.id = 'cloudSyncBtn';
        button.className = 'cloud-sync-header-btn';
        button.type = 'button';
        button.setAttribute('aria-label', '球員資料雲端同步');
        button.innerHTML = '<span class="cloud-sync-glyph" aria-hidden="true">☁</span><span class="cloud-sync-label">雲端同步</span><span class="cloud-sync-dot" aria-hidden="true"></span>';
        button.addEventListener('click', () => {
"""
          if old_create not in text:
              raise SystemExit('cloud sync button create anchor not found')
          text = text.replace(old_create, new_create, 1)

          old_refresh = """      const button = document.getElementById('cloudSyncBtn');
      if (button) {
        button.textContent = cloudSyncLastError ? '同步異常' : cloudSyncBusy ? '同步中' : cloudSyncCredentials ? '已同步' : '雲端同步';
        button.classList.toggle('is-connected', Boolean(cloudSyncCredentials) && !cloudSyncLastError);
"""
          new_refresh = """      const button = document.getElementById('cloudSyncBtn');
      if (button) {
        const label = button.querySelector('.cloud-sync-label');
        if (label) label.textContent = cloudSyncLastError ? '同步異常' : cloudSyncBusy ? '同步中' : cloudSyncCredentials ? '已同步' : '雲端同步';
        button.classList.toggle('is-connected', Boolean(cloudSyncCredentials) && !cloudSyncLastError);
"""
          if old_refresh not in text:
              raise SystemExit('cloud sync refresh anchor not found')
          text = text.replace(old_refresh, new_refresh, 1)
          cloud.write_text(text, encoding='utf-8')

          css = Path('styles.css')
          css_text = css.read_text(encoding='utf-8')
          marker = '/* ===== CLOUD SYNC MOBILE HARDENING ===== */'
          if marker not in css_text:
              css_text += r'''

/* ===== CLOUD SYNC MOBILE HARDENING ===== */
#homePage #homeZoneSwitch.home-root-switch{
  display:grid !important;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr) !important;
  width:100% !important;
}
#homePage #homeZoneSwitch.home-root-switch > .home-zone-btn{
  width:100% !important;
  min-width:0 !important;
}
.cloud-sync-header-btn::before,
.cloud-sync-header-btn::after{
  content:none !important;
  display:none !important;
}
.cloud-sync-header-btn{
  position:relative;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:5px;
}
.cloud-sync-glyph{
  display:inline-block;
  font-size:16px;
  line-height:1;
  flex:0 0 auto;
}
.cloud-sync-label{
  display:inline-block;
  white-space:nowrap;
}
.cloud-sync-dot{
  display:block;
  width:7px;
  height:7px;
  border-radius:50%;
  background:rgba(255,255,255,.45);
  box-shadow:0 0 0 2px rgba(255,255,255,.10);
  flex:0 0 auto;
}
.cloud-sync-header-btn.is-connected .cloud-sync-dot{background:#35c46a;}
.cloud-sync-header-btn.is-error .cloud-sync-dot{background:#ff6b6b;}
.cloud-sync-header-btn.is-busy .cloud-sync-dot{background:#ffd166;animation:cloudSyncPulse 1s ease-in-out infinite;}
@media (max-width:900px), (hover:none) and (pointer:coarse){
  .cloud-sync-header-btn{
    width:32px !important;
    min-width:32px !important;
    max-width:32px !important;
    height:30px !important;
    min-height:30px !important;
    padding:3px !important;
    gap:0 !important;
    overflow:visible !important;
  }
  .cloud-sync-header-btn .cloud-sync-label{
    display:none !important;
  }
  .cloud-sync-header-btn .cloud-sync-glyph{
    display:block !important;
    font-size:17px !important;
    line-height:1 !important;
  }
  .cloud-sync-header-btn .cloud-sync-dot{
    position:absolute !important;
    right:2px !important;
    top:2px !important;
    display:block !important;
    width:6px !important;
    height:6px !important;
  }
}
/* ===== CLOUD SYNC MOBILE HARDENING END ===== */
'''
          css.write_text(css_text, encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          html = html.replace('./styles.css?v=v2.40', './styles.css?v=v2.40-ui2')
          html = html.replace('./app.js?v=v2.40', './app.js?v=v2.40-ui2')
          index.write_text(html, encoding='utf-8')

          sw = Path('service-worker.js')
          sw_text = sw.read_text(encoding='utf-8')
          sw_text = sw_text.replace('baseball-player-card-pwa-v240-stable-4', 'baseball-player-card-pwa-v240-stable-5')
          sw_text = sw_text.replace("'./styles.css?v=v2.40'", "'./styles.css?v=v2.40-ui2'")
          sw_text = sw_text.replace("'./app.js?v=v2.40'", "'./app.js?v=v2.40-ui2'")
          sw.write_text(sw_text, encoding='utf-8')
          PY

          python3 scripts/build-app.py
          node --check app.js
          grep -q "cloud-sync-label" js/07a-cloud-sync.js
          grep -q "CLOUD SYNC MOBILE HARDENING" styles.css
          grep -q "grid-template-columns:minmax(0,1fr) minmax(0,1fr) !important" styles.css
          grep -q "styles.css?v=v2.40-ui2" index.html
          grep -q "app.js?v=v2.40-ui2" index.html
          grep -q "baseball-player-card-pwa-v240-stable-5" service-worker.js

      - name: Commit fixes
        run: |
          git config user.name 'chatgpt-ui-fix'
          git config user.email 'actions@users.noreply.github.com'
          git add js/07a-cloud-sync.js styles.css index.html app.js service-worker.js
          git commit -m 'Fix mobile sync icon and restore two-tab width'
          git push
