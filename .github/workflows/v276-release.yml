name: v2.76 release
on:
  push:
    branches:
      - main
    paths:
      - '.github/v276-release-trigger'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump active app resources to v2.76
        shell: bash
        run: |
          set -euo pipefail
          files=(
            app.js index.html service-worker.js
            game-detail-enhancement.js game-detail-enhancement.css
            report-layout.js report-layout.css
            cpbl-realtime.js npb-realtime.js live-static-update.js cpbl-cache-router.js
            landscape-state.js landscape-state.css
            manifest.webmanifest rescue.html styles.css
            postseason-history.js postseason-history.css
          )
          for f in "${files[@]}"; do
            if [ -f "$f" ]; then
              sed -i 's/v2\.75/v2.76/g; s/v275/v276/g; s/V275/V276/g' "$f"
            fi
          done
          printf '%s\n' '{"version":"v2.76"}' > version.json
      - name: Verify release
        shell: bash
        run: |
          node --check app.js
          node --check postseason-history.js
          node --check cpbl-cache-router.js
          node --check service-worker.js
          grep -q "const APP_VERSION = 'v2.76'" app.js
          grep -q 'content="v2.76"' index.html
          grep -q 'baseball-player-card-pwa-v276' service-worker.js
          grep -q 'postseason-history.js?v=v2.76' index.html
          grep -q 'cpbl-cache-router.js?v=v2.76' index.html
          test "$(cat version.json)" = '{"version":"v2.76"}'
      - name: Commit v2.76
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html service-worker.js game-detail-enhancement.js game-detail-enhancement.css report-layout.js report-layout.css cpbl-realtime.js npb-realtime.js live-static-update.js cpbl-cache-router.js landscape-state.js landscape-state.css manifest.webmanifest rescue.html styles.css postseason-history.js postseason-history.css version.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Release v2.76 postseason tabs and year picker cache refresh'
          git push
