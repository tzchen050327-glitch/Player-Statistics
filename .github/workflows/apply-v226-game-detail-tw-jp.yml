name: Apply v2.26 CPBL NPB game detail

on:
  push:
    branches: [feature-v2.26-game-detail-tw-jp]
    paths:
      - 'scripts/patch-v226-game-detail-tw-jp.py'
      - '.github/workflows/apply-v226-game-detail-tw-jp.yml'

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v2.26 patch
        run: python3 scripts/patch-v226-game-detail-tw-jp.py
      - name: Validate game detail wiring
        run: |
          grep -Fq "const APP_VERSION = 'v2.26'" js/00-core-config.js
          grep -Fq "LEAGUE_GAME_DETAIL_API_URL" js/00-core-config.js
          grep -Fq "function homeGameDetailSupported" js/11-home-international.js
          grep -Fq "return league === 'CPBL' || league === 'NPB';" js/11-home-international.js
          grep -Fq "const HOME_GAME_DETAIL_AUTO_LIMIT = 120;" js/11-home-international.js
          grep -Fq "activeHomeGameDetail.league === 'NPB' ? 90 * 1000 : 60 * 1000" js/11-home-international.js
          grep -Fq "data-game-detail-index" js/11-home-international.js
          grep -Fq "目前打者" js/11-home-international.js
          grep -Fq "目前投手" js/11-home-international.js
          grep -Fq "全場逐打席" js/11-home-international.js
          grep -Fq "home-game-detail-overlay" styles.css
          grep -Fq './app.js?v=v2.26' index.html
          grep -Fq 'baseball-player-card-pwa-v143' service-worker.js
          test -f 'index v2.26.html'
          test -f 'index v2.25.html'
          test ! -f 'index v2.24.html'
      - name: Syntax and deterministic build
        run: |
          for f in js/[0-9][0-9]-*.js; do node --check "$f"; done
          node --check app.js
          cp app.js /tmp/app-committed.js
          python3 scripts/build-app.py
          cmp -s /tmp/app-committed.js app.js
      - name: Chrome mobile smoke test
        run: |
          python3 -m http.server 8765 >/tmp/player-stats-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$CHROME" ]; then exit 0; fi
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=411,900 --virtual-time-budget=9000 --dump-dom http://127.0.0.1:8765/index.html >/tmp/dom.html
          grep -Fq 'content="v2.26"' /tmp/dom.html
      - name: Commit v2.26
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html 'index v2.26.html' js/00-core-config.js js/11-home-international.js styles.css service-worker.js
          if [ -f 'index v2.24.html' ]; then git rm -f 'index v2.24.html'; fi
          git commit -m 'v2.26 add CPBL NPB full game play by play'
          git push origin HEAD:feature-v2.26-game-detail-tw-jp
