name: Update pregame starter stats

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-pregame-stats.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch starter cards
        run: |
          python3 -c "from pathlib import Path; import re; p=Path('js/11-home-international.js'); s=p.read_text(encoding='utf-8'); a=s.index('    function homeStarterStatItems(starter) {'); b=s.index('    function homeStarterCard',a); r='    function homeStarterStatItems(starter) {\\n      const stats = starter?.stats || {};\\n      const out = [];\\n      const win = String(stats.wins ?? \\'\\').trim();\\n      const loss = String(stats.losses ?? \\'\\').trim();\\n      if (win || loss) out.push([\\'勝敗\\', `\\${win || 0}-\\${loss || 0}`]);\\n      if (String(stats.era ?? \\'\\').trim()) out.push([\\'ERA\\', String(stats.era)]);\\n      if (String(stats.ip ?? \\'\\').trim()) out.push([\\'IP\\', String(stats.ip)]);\\n      if (String(stats.so ?? \\'\\').trim()) out.push([\\'SO\\', String(stats.so)]);\\n      if (String(stats.hits ?? \\'\\').trim()) out.push([\\'被安打\\', String(stats.hits)]);\\n      if (String(stats.homeRuns ?? \\'\\').trim()) out.push([\\'被全壘打\\', String(stats.homeRuns)]);\\n      if (String(stats.fourDead ?? \\'\\').trim()) out.push([\\'四死球\\', String(stats.fourDead)]);\\n      if (String(stats.whip ?? \\'\\').trim()) out.push([\\'WHIP\\', String(stats.whip)]);\\n      if (String(stats.starts ?? \\'\\').trim()) out.push([\\'GS\\', String(stats.starts)]);\\n      else if (String(stats.games ?? \\'\\').trim()) out.push([\\'G\\', String(stats.games)]);\\n      return out.slice(0, 9);\\n    }\\n\\n'; p.write_text(s[:a]+r+s[b:],encoding='utf-8'); h=Path('index.html').read_text(encoding='utf-8'); Path('index.html').write_text(re.sub(r'v2\\.40-ui\\d+','v2.40-ui6',h),encoding='utf-8'); w=Path('service-worker.js').read_text(encoding='utf-8'); w=re.sub(r'baseball-player-card-pwa-v240-stable-\\d+','baseball-player-card-pwa-v240-stable-10',w); w=re.sub(r'v2\\.40-ui\\d+','v2.40-ui6',w); Path('service-worker.js').write_text(w,encoding='utf-8')"
          python3 scripts/build-app.py
          node --check app.js
          grep -q '被全壘打' js/11-home-international.js
          grep -q '四死球' js/11-home-international.js
          grep -q 'v2.40-ui6' index.html
          grep -q 'stable-10' service-worker.js
      - name: Commit
        run: |
          git config user.name 'chatgpt-pregame'
          git config user.email 'actions@users.noreply.github.com'
          git add js/11-home-international.js app.js index.html service-worker.js
          git commit -m 'Show more pregame pitcher stats'
          git push
