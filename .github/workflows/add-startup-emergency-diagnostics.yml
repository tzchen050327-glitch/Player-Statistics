name: Add startup emergency diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-startup-emergency-diagnostics.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add always-available startup diagnostics entry
        shell: python
        run: |
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')

          marker = '        <div id="appSplashVersion" class="app-splash-version">VERSION</div>\n'
          block = '''        <div id="appSplashVersion" class="app-splash-version">VERSION</div>\n        <div id="startupEmergencyDiagnostics" style="margin-top:14px;text-align:center;position:relative;z-index:2147483647">\n          <a href="./diagnostics.html?source=startup" style="display:inline-block;padding:8px 12px;border:1px solid rgba(255,255,255,.55);border-radius:10px;color:inherit;text-decoration:none;font-size:13px;background:rgba(255,255,255,.10)">啟動異常？開啟診斷</a>\n        </div>\n'''
          if 'id="startupEmergencyDiagnostics"' not in text:
              if marker not in text:
                  raise SystemExit('startup splash marker not found')
              text = text.replace(marker, block, 1)
              index.write_text(text, encoding='utf-8')

          sw = Path('service-worker.js')
          sw_text = sw.read_text(encoding='utf-8')
          shell_marker = "  './index.html',\n"
          if "'./diagnostics.html'" not in sw_text:
              if shell_marker not in sw_text:
                  raise SystemExit('service worker app-shell marker not found')
              sw_text = sw_text.replace(shell_marker, shell_marker + "  './diagnostics.html',\n", 1)
          core_marker = "  const isCoreAsset = url.pathname.endsWith('/diagnostic-runtime.js')\n"
          if "url.pathname.endsWith('/diagnostics.html')" not in sw_text:
              if core_marker not in sw_text:
                  raise SystemExit('service worker core marker not found')
              sw_text = sw_text.replace(core_marker, "  const isCoreAsset = url.pathname.endsWith('/diagnostics.html')\n    || url.pathname.endsWith('/diagnostic-runtime.js')\n", 1)
          sw.write_text(sw_text, encoding='utf-8')
      - name: Commit startup rescue entry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git diff --cached --quiet && exit 0
          git commit -m "Add startup emergency diagnostics access"
          git push
