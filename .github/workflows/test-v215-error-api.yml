name: Test v2.15 CPBL error API

on:
  push:
    branches: [feature-v2.15-error-page]
    paths: ['.github/workflows/test-v215-error-api.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query player and game errors
        run: |
          python3 - <<'PY'
          import json, re, urllib.request, urllib.error
          from pathlib import Path
          cfg=Path('js/00-core-config.js').read_text(encoding='utf-8')
          def grab(name):
              m=re.search(rf"const {name} = '([^']+)'",cfg)
              assert m, name
              return m.group(1)
          url=grab('CPBL_API_URL')
          app=grab('CPBL_APP_KEY')
          anon=grab('CPBL_ANON_KEY')
          def post(body):
              body={**body,'appKey':app,'anonKey':anon}
              req=urllib.request.Request(url,data=json.dumps(body).encode(),headers={'content-type':'application/json'},method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=45) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  text=e.read().decode('utf-8','replace')
                  print('HTTP_ERROR',e.code,text)
                  try:return json.loads(text)
                  except: raise
          p=post({'action':'search-player','name':'威能帝','number':'49'})
          print('PLAYER',json.dumps(p,ensure_ascii=False))
          player=p.get('player') or {}
          assert p.get('ok') and player.get('acnt') and player.get('teamCode'), p
          g=post({'action':'game-errors','acnt':player['acnt'],'date':'2026-09-11','teamCode':player['teamCode'],'kindCode':'A'})
          print('ERRORS',json.dumps(g,ensure_ascii=False))
          assert g.get('ok') is True, g
          assert isinstance(g.get('errors'),list), g
          if g.get('found'):
              for row in g['errors']:
                  assert int(row.get('count') or 0)>0, row
                  assert row.get('name') or row.get('acnt'), row
          PY
