name: Apply v2.61 final lineup and update check fix
on:
  push:
    paths:
      - '.github/v261-fix-trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v2.61 fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # 1) Make the primary landscape renderer own inning-end / FINAL side panels.
          p = Path('game-detail-enhancement.js')
          s = p.read_text(encoding='utf-8')
          old = """  function renderLandscapeBoard(detail,board) {\n    const offense=currentOffenseSide(detail), defense=offense==='away'?'home':'away', game=detail?.game||{};\n    const side=(which)=>{\n      const team=which==='away'?game.away||'客隊':game.home||'主隊', isOff=which===offense;\n      return `<section class=\"gdx-landscape-side gdx-side-${which}\"><div class=\"gdx-landscape-team-head\"><span>${which==='away'?'AWAY':'HOME'}</span><strong>${esc(team)}</strong><em>${isOff?'ATTACK':'DEFENSE'}</em></div>${isOff?renderLineupPanel(detail,which):renderPitcherPanel(detail,which)}</section>`;\n    };\n    return `<section class=\"gdx-landscape-board game-detail-enhanced-marker\" data-gdx=\"landscape\">${side('away')}<div class=\"gdx-landscape-center\">${renderLandscapeScoreboard(detail,board)}<div class=\"gdx-landscape-lower\">${renderDefenseField(detail,defense)}${renderRunnerDiamond(detail)}</div></div>${side('home')}</section>`;\n  }\n"""
          new = """  function landscapeShowBothLineups(detail) {\n    if (String(detail?.status || '').toLowerCase() === 'final') return true;\n    const plays = Array.isArray(detail?.plays) ? detail.plays : [];\n    return inferredOutsAfterPlay(plays.at(-1)) >= 3;\n  }\n\n  function renderLandscapeBoard(detail,board) {\n    const offense=currentOffenseSide(detail), defense=offense==='away'?'home':'away', game=detail?.game||{};\n    const showBothLineups=landscapeShowBothLineups(detail);\n    const side=(which)=>{\n      const team=which==='away'?game.away||'客隊':game.home||'主隊', isOff=which===offense;\n      const showLineup=showBothLineups||isOff;\n      const stateLabel=showBothLineups?'LINEUP':(isOff?'ATTACK':'DEFENSE');\n      return `<section class=\"gdx-landscape-side gdx-side-${which}\"><div class=\"gdx-landscape-team-head\"><span>${which==='away'?'AWAY':'HOME'}</span><strong>${esc(team)}</strong><em>${stateLabel}</em></div>${showLineup?renderLineupPanel(detail,which):renderPitcherPanel(detail,which)}</section>`;\n    };\n    return `<section class=\"gdx-landscape-board game-detail-enhanced-marker\" data-gdx=\"landscape\">${side('away')}<div class=\"gdx-landscape-center\">${renderLandscapeScoreboard(detail,board)}<div class=\"gdx-landscape-lower\">${renderDefenseField(detail,defense)}${renderRunnerDiamond(detail)}</div></div>${side('home')}</section>`;\n  }\n"""
          if old not in s:
              raise SystemExit('renderLandscapeBoard target not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # 2) Do not run a second JS authority over the same landscape panel.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('  <script src="./landscape-state.js?v=v2.60"></script>\n', '')
          p.write_text(s, encoding='utf-8')

          p = Path('service-worker.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("  './landscape-state.js?v=v2.60',\n", '')
          p.write_text(s, encoding='utf-8')

          # 3) Version comparison must be monotonic, not merely different.
          p = Path('app.js')
          s = p.read_text(encoding='utf-8')
          anchor = """    async function checkAppUpdate({ manual = false, showProgress = false, keepProgressOpen = false } = {}) {\n"""
          helper = """    function parseAppVersion(value) {\n      const match = String(value || '').trim().match(/^v?(\\d+)\\.(\\d+)(?:\\.(\\d+))?$/i);\n      if (!match) return null;\n      return [Number(match[1]), Number(match[2]), Number(match[3] || 0)];\n    }\n\n    function isRemoteVersionNewer(remote, current = APP_VERSION) {\n      const r = parseAppVersion(remote);\n      const c = parseAppVersion(current);\n      if (!r || !c) return false;\n      for (let i = 0; i < 3; i += 1) {\n        if (r[i] > c[i]) return true;\n        if (r[i] < c[i]) return false;\n      }\n      return false;\n    }\n\n    async function checkAppUpdate({ manual = false, showProgress = false, keepProgressOpen = false } = {}) {\n"""
          if anchor not in s:
              raise SystemExit('checkAppUpdate anchor not found')
          s = s.replace(anchor, helper, 1)
          target = "remoteVersion && remoteVersion !== APP_VERSION"
          if s.count(target) < 2:
              raise SystemExit('remote version comparison targets not found')
          s = s.replace(target, "remoteVersion && isRemoteVersionNewer(remoteVersion)")
          p.write_text(s, encoding='utf-8')

          # 4) Formal v2.61 sync across active resources.
          files = [
              'app.js','index.html','service-worker.js','game-detail-enhancement.js',
              'game-detail-enhancement.css','report-layout.js','report-layout.css',
              'cpbl-realtime.js','live-static-update.js','cpbl-cache-router.js',
              'landscape-state.js','landscape-state.css','manifest.webmanifest',
              'rescue.html','styles.css'
          ]
          for name in files:
              p = Path(name)
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              s = s.replace('v2.60','v2.61').replace('v260','v261').replace('V260','V261')
              s = s.replace('pwa-v260','pwa-v261')
              p.write_text(s, encoding='utf-8')

          Path('version.json').write_text('{"version":"v2.61"}\n', encoding='utf-8')
          PY

      - name: Verify v2.61
        shell: bash
        run: |
          node --check app.js
          node --check game-detail-enhancement.js
          node --check cpbl-realtime.js
          node --check report-layout.js
          node --check live-static-update.js
          grep -q '"version":"v2.61"' version.json
          grep -q "APP_VERSION = 'v2.61'" app.js
          grep -q "baseball-player-card-pwa-v261" service-worker.js
          ! grep -q 'landscape-state.js' index.html
          ! grep -q 'landscape-state.js' service-worker.js
          ! grep -q 'remoteVersion && remoteVersion !== APP_VERSION' app.js

      - name: Commit v2.61
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html service-worker.js game-detail-enhancement.js game-detail-enhancement.css report-layout.js report-layout.css cpbl-realtime.js live-static-update.js cpbl-cache-router.js landscape-state.js landscape-state.css manifest.webmanifest rescue.html styles.css version.json
          git commit -m 'Release v2.61 final lineup and version check fix'
          git push
