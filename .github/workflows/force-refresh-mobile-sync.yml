name: Force refresh mobile sync UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/force-refresh-mobile-sync.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force new asset URLs and service worker cache
        run: |
          sed -i 's#./styles.css?v=v2.40#./styles.css?v=v2.40-ui4#g' index.html
          sed -i 's#./app.js?v=v2.40#./app.js?v=v2.40-ui4#g' index.html
          sed -i 's#./game-detail-enhancement.css?v=v2.40#./game-detail-enhancement.css?v=v2.40-ui4#g' index.html
          sed -i 's#./game-detail-enhancement.js?v=v2.40#./game-detail-enhancement.js?v=v2.40-ui4#g' index.html
          python3 -c "from pathlib import Path; p=Path('service-worker.js'); s=p.read_text(); import re; s=re.sub(r\"const CACHE_NAME = '[^']+';\", \"const CACHE_NAME = 'baseball-player-card-pwa-v240-stable-8';\", s, count=1); s=re.sub(r\"'./styles\\.css\\?v=[^']+'\", \"'./styles.css?v=v2.40-ui4'\", s); s=re.sub(r\"'./app\\.js\\?v=[^']+'\", \"'./app.js?v=v2.40-ui4'\", s); s=re.sub(r\"'./game-detail-enhancement\\.css\\?v=[^']+'\", \"'./game-detail-enhancement.css?v=v2.40-ui4'\", s); s=re.sub(r\"'./game-detail-enhancement\\.js\\?v=[^']+'\", \"'./game-detail-enhancement.js?v=v2.40-ui4'\", s); needle=\"    || url.pathname.endsWith('/app.js')\\n\"; s=s if \"url.pathname.endsWith('/styles.css')\" in s else s.replace(needle, needle+\"    || url.pathname.endsWith('/styles.css')\\n\", 1); p.write_text(s)"
          grep -q 'styles.css?v=v2.40-ui4' index.html
          grep -q 'baseball-player-card-pwa-v240-stable-8' service-worker.js
          grep -q "url.pathname.endsWith('/styles.css')" service-worker.js
      - name: Commit cache refresh
        run: |
          git config user.name 'chatgpt-cache-fix'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html service-worker.js
          git commit -m 'Force refresh updated mobile UI assets'
          git push
