name: Sync 2026 Panther Cup rosters
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/sync_panther_rosters.py'
      - '.github/workflows/sync-panther-rosters.yml'
  schedule:
    - cron: '22 3 * * *'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Import 2026 official school rosters
        id: import
        continue-on-error: true
        run: python -u scripts/sync_panther_rosters.py
      - name: Upload import diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panther-roster-diagnostics
          if-no-files-found: warn
          path: |
            data/black-panther-rosters-2026-report.json
            data/black-panther-rosters-2026.json
      - name: Commit verified roster data
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/black-panther-rosters-2026.json data/black-panther-rosters-2026-report.json 2>/dev/null || true
          if ! git diff --cached --quiet; then git commit -m "Update verified 2026 Panther Cup rosters"; git push; fi
