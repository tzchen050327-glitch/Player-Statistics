name: Sync 2026 Panther Cup rosters
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/sync_panther_rosters.py'
      - '.github/workflows/sync-panther-rosters.yml'
  schedule:
    - cron: '22 3 * * *'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python scripts/sync_panther_rosters.py
      - name: Commit verified roster data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/black-panther-rosters-2026.json data/black-panther-rosters-2026-report.json
          if ! git diff --cached --quiet; then git commit -m "Update verified 2026 Panther Cup rosters"; git push; fi
