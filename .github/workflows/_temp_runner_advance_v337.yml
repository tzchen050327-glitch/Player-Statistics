name: Temporary runner advance v3.37

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_temp_runner_advance_v337.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Patch frontend fallback and bump v3.37
        shell: python
        run: |
          import json, re
          from pathlib import Path

          p = Path('game-detail-enhancement.js')
          text = p.read_text(encoding='utf-8')
          old_action = r'(上(?:一壘|二壘|三壘)|回本壘(?:得分)?|出局)'
          new_action = r'((?:趁傳(?:進壘)?\s*)?上(?:一壘|二壘|三壘)|回本壘(?:得分)?|出局)'
          if old_action not in text:
              raise SystemExit('runner action regex not found')
          text = text.replace(old_action, new_action, 1)
          old_if = r'if(/^上/.test(action)){'
          new_if = r'if(/上(?:一壘|二壘|三壘)$/.test(action)){'
          if old_if not in text:
              raise SystemExit('runner action destination check not found')
          text = text.replace(old_if, new_if, 1)
          p.write_text(text, encoding='utf-8')

          data = json.loads(Path('version.json').read_text(encoding='utf-8'))
          old = str(data['version'])
          m = re.fullmatch(r'v(\d+)\.(\d+)', old)
          if not m:
              raise SystemExit(f'unsupported version {old}')
          new = f'v{int(m.group(1))}.{int(m.group(2))+1}'
          if new != 'v3.37':
              raise SystemExit(f'expected v3.37 from {old}, got {new}')
          cache_tag = new.replace('.', '')
          Path('version.json').write_text(json.dumps({'version':new}, ensure_ascii=False, separators=(',', ':'))+'\n', encoding='utf-8')

          order = [x.strip() for x in Path('js/module-order.txt').read_text(encoding='utf-8').splitlines() if x.strip()]
          found = 0
          for name in order:
              q = Path('js') / name
              s = q.read_text(encoding='utf-8')
              s, n = re.subn(r"const APP_VERSION = 'v\d+\.\d+';", f"const APP_VERSION = '{new}';", s)
              found += n
              s = re.sub(r'\?v=v\d+\.\d+', f'?v={new}', s)
              q.write_text(s, encoding='utf-8')
          if found != 1:
              raise SystemExit(f'expected one APP_VERSION, found {found}')

          q = Path('index.html')
          s = q.read_text(encoding='utf-8')
          s, n = re.subn(r'(<meta\s+name="app-version"\s+content=")v\d+\.\d+("\s*/?>)', rf'\g<1>{new}\2', s, count=1)
          s = re.sub(r'\?v=v\d+\.\d+', f'?v={new}', s)
          s = re.sub(r'(id="appVersionBadge"[^>]*>)v\d+\.\d+(</button>)', rf'\g<1>{new}\2', s, count=1)
          if not n:
              raise SystemExit('app-version meta not found')
          q.write_text(s, encoding='utf-8')

          q = Path('service-worker.js')
          s = q.read_text(encoding='utf-8')
          s = re.sub(r'\?v=v\d+\.\d+', f'?v={new}', s)
          s = re.sub(r"const CACHE_NAME = '[^']+';", f"const CACHE_NAME = 'baseball-player-card-pwa-{cache_tag}-auto';", s, count=1)
          q.write_text(s, encoding='utf-8')
          print(f'{old} -> {new}')
      - name: Build canonical app bundle
        run: |
          python3 scripts/build-app.py
          python3 scripts/build-app.py --check
          node --check app.js
          node --check game-detail-enhancement.js
      - name: Remove temporary workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_temp_runner_advance_v337.yml
          git add version.json index.html service-worker.js app.js js game-detail-enhancement.js
          git commit -m "Fix CPBL runner advance parsing v3.37 [skip version bump]"
          git push
