name: Apply mobile sync layout override
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-mobile-sync-css.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append final UI override
        run: |
          cat >> game-detail-enhancement.css <<'EOF'

          /* mobile cloud sync + two-tab width override */
          #homePage #homeZoneSwitch.home-root-switch {
            display: grid !important;
            grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
            width: 100% !important;
          }
          #homePage #homeZoneSwitch.home-root-switch > .home-zone-btn {
            width: 100% !important;
            min-width: 0 !important;
          }
          @media (max-width: 900px), (hover: none) and (pointer: coarse) {
            #cloudSyncBtn.cloud-sync-header-btn {
              width: 32px !important;
              min-width: 32px !important;
              max-width: 32px !important;
              height: 30px !important;
              min-height: 30px !important;
              padding: 3px !important;
              gap: 0 !important;
              font-size: 0 !important;
              overflow: visible !important;
            }
            #cloudSyncBtn.cloud-sync-header-btn::before {
              content: '☁' !important;
              display: block !important;
              font-size: 17px !important;
              line-height: 1 !important;
            }
            #cloudSyncBtn.cloud-sync-header-btn::after {
              content: '' !important;
              display: block !important;
              position: absolute !important;
              right: 2px !important;
              top: 2px !important;
              width: 6px !important;
              height: 6px !important;
              border-radius: 50% !important;
            }
          }
          EOF
          git config user.name 'chatgpt-ui-fix'
          git config user.email 'actions@users.noreply.github.com'
          git add game-detail-enhancement.css
          git commit -m 'Fix mobile cloud icon and restore tab width'
          git push
