name: Apply v2.52 layout fix

on:
  push:
    paths:
      - '.github/v252-layout-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch v2.52
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          files = [
              'app.js', 'index.html', 'styles.css', 'game-detail-enhancement.css',
              'game-detail-enhancement.js', 'live-static-update.js',
              'cpbl-cache-router.js', 'service-worker.js', 'rescue.html'
          ]
          for name in files:
              p = Path(name)
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              text = text.replace('v2.51', 'v2.52').replace('v251', 'v252').replace('V251', 'V252')
              text = re.sub(r'\?v=v2\.52-[A-Za-z0-9._-]+', '?v=v2.52', text)
              p.write_text(text, encoding='utf-8')

          sw = Path('service-worker.js')
          text = sw.read_text(encoding='utf-8')
          text = re.sub(r"const CACHE_NAME = '[^']+';", "const CACHE_NAME = 'baseball-player-card-pwa-v252';", text, count=1)
          text = re.sub(r"(\./(?:styles\.css|live-static-update\.js|app\.js|cpbl-cache-router\.js|game-detail-enhancement\.css|game-detail-enhancement\.js))\?v=[^']+", r"\1?v=v2.52", text)
          sw.write_text(text, encoding='utf-8')

          js = Path('game-detail-enhancement.js')
          text = js.read_text(encoding='utf-8')
          old = "return `<div class=\"gdx-field-card\"><div class=\"gdx-mini-title\">守備</div><div class=\"gdx-field-shape\">${spots.map(pos=>`<div class=\"gdx-fielder gdx-pos-${pos}\"><span>${esc(field[pos]||'—')}</span></div>`).join('')}</div></div>`;"
          new = "return `<div class=\"gdx-field-card\"><div class=\"gdx-mini-title\">守備</div><div class=\"gdx-field-shape\"></div><div class=\"gdx-fielders-layer\">${spots.map(pos=>`<div class=\"gdx-fielder gdx-pos-${pos}\"><span>${esc(field[pos]||'—')}</span></div>`).join('')}</div></div>`;"
          if old not in text:
              raise SystemExit('renderDefenseField target not found')
          js.write_text(text.replace(old, new, 1), encoding='utf-8')

          css = Path('game-detail-enhancement.css')
          text = css.read_text(encoding='utf-8')
          marker = '/* ===== v2.52 DESKTOP REPORT LAYOUT ===== */'
          if marker not in text:
              text += r'''

/* ===== v2.52 DESKTOP REPORT LAYOUT ===== */
@media (orientation:landscape) and (min-width:700px){
  body.home-game-detail-open .home-game-detail-page{width:100%!important;max-width:none!important;margin:0!important;min-height:100dvh!important;box-shadow:none!important;background:#091728!important;}
  body.home-game-detail-open .game-detail-sticky-head{display:none!important;}
  body.home-game-detail-open .gdx-landscape-board{width:100vw!important;height:100dvh!important;grid-template-columns:minmax(250px,20%) minmax(0,60%) minmax(250px,20%)!important;}
  body.home-game-detail-open .gdx-landscape-center{min-width:0!important;}
  body.home-game-detail-open .gdx-landscape-lower{grid-template-columns:minmax(0,1.75fr) minmax(170px,.65fr)!important;gap:10px!important;padding:10px!important;}
  .gdx-field-card{overflow:hidden!important;}
  .gdx-field-shape{position:absolute!important;inset:24px 10px 10px!important;z-index:0!important;overflow:hidden!important;background:linear-gradient(145deg,rgba(25,105,72,.45),rgba(12,67,51,.38))!important;clip-path:polygon(50% 0,100% 54%,83% 100%,17% 100%,0 54%)!important;border-radius:40%!important;pointer-events:none!important;}
  .gdx-field-shape:before{content:none!important;}
  .gdx-field-shape:after{content:''!important;position:absolute!important;z-index:1!important;left:28%!important;right:28%!important;top:34%!important;bottom:10%!important;border:1px solid rgba(232,207,153,.34)!important;transform:rotate(45deg)!important;pointer-events:none!important;}
  .gdx-fielders-layer{position:absolute!important;inset:24px 10px 10px!important;z-index:4!important;overflow:visible!important;pointer-events:none!important;}
  .gdx-fielders-layer .gdx-fielder{z-index:5!important;max-width:44%!important;padding:3px 7px!important;background:rgba(3,15,25,.9)!important;border-color:rgba(255,255,255,.2)!important;box-shadow:0 2px 8px rgba(0,0,0,.32)!important;}
  .gdx-fielders-layer .gdx-fielder span{overflow:visible!important;text-overflow:clip!important;font-size:10px!important;}
  .gdx-pos-lf{left:25%!important;top:28%!important;}.gdx-pos-rf{left:75%!important;top:28%!important;}.gdx-pos-3b{left:27%!important;top:66%!important;}.gdx-pos-1b{left:73%!important;top:66%!important;}
}
@media (orientation:landscape) and (min-width:700px) and (max-width:1100px){
  body.home-game-detail-open .gdx-landscape-board{grid-template-columns:minmax(190px,23%) minmax(0,54%) minmax(190px,23%)!important;}
  body.home-game-detail-open .gdx-landscape-lower{grid-template-columns:minmax(0,1.5fr) minmax(130px,.7fr)!important;padding:6px!important;gap:6px!important;}
  .gdx-fielders-layer .gdx-fielder span{font-size:8px!important;}
}
/* ===== v2.52 DESKTOP REPORT LAYOUT END ===== */
'''
          css.write_text(text, encoding='utf-8')
          PY

      - name: Commit v2.52
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html styles.css game-detail-enhancement.css game-detail-enhancement.js live-static-update.js cpbl-cache-router.js service-worker.js rescue.html
          git commit -m "Release v2.52 desktop report layout and unified versioning"
          git push
