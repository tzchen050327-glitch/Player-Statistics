name: Apply v2.52 layout fix

on:
  push:
    paths:
      - '.github/v252-layout-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch v2.52
        run: |
          python3 <<'PY'
          from pathlib import Path
          import base64, re
          current = ['app.js','index.html','styles.css','game-detail-enhancement.css','game-detail-enhancement.js','live-static-update.js','cpbl-cache-router.js','service-worker.js','rescue.html']
          for name in current:
              p = Path(name)
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              s = s.replace('v2.51','v2.52').replace('v251','v252').replace('V251','V252')
              s = re.sub(r'\?v=v2\.52-[A-Za-z0-9._-]+','?v=v2.52',s)
              p.write_text(s,encoding='utf-8')
          sw = Path('service-worker.js')
          s = sw.read_text(encoding='utf-8')
          s = re.sub(r"const CACHE_NAME = '[^']+';","const CACHE_NAME = 'baseball-player-card-pwa-v252';",s,count=1)
          s = re.sub(r"(\./(?:styles\.css|live-static-update\.js|app\.js|cpbl-cache-router\.js|game-detail-enhancement\.css|game-detail-enhancement\.js))\?v=[^']+",r"\1?v=v2.52",s)
          sw.write_text(s,encoding='utf-8')
          js = Path('game-detail-enhancement.js')
          s = js.read_text(encoding='utf-8')
          old = "return `<div class=\"gdx-field-card\"><div class=\"gdx-mini-title\">守備</div><div class=\"gdx-field-shape\">${spots.map(pos=>`<div class=\"gdx-fielder gdx-pos-${pos}\"><span>${esc(field[pos]||'—')}</span></div>`).join('')}</div></div>`;"
          new = "return `<div class=\"gdx-field-card\"><div class=\"gdx-mini-title\">守備</div><div class=\"gdx-field-shape\"></div><div class=\"gdx-fielders-layer\">${spots.map(pos=>`<div class=\"gdx-fielder gdx-pos-${pos}\"><span>${esc(field[pos]||'—')}</span></div>`).join('')}</div></div>`;"
          if old not in s:
              raise SystemExit('renderDefenseField target not found')
          js.write_text(s.replace(old,new,1),encoding='utf-8')
          css = Path('game-detail-enhancement.css')
          s = css.read_text(encoding='utf-8')
          marker = '/* ===== v2.52 DESKTOP REPORT LAYOUT ===== */'
          if marker not in s:
              extra = base64.b64decode('   gPT09PT0gdjIuNTIgREVT S1RPUCBSRVBPUlQgTEFZT1VUIEVORCA9PT09PSAqLwo='.replace(' ', '')).decode('utf-8')
              s += extra
          css.write_text(s,encoding='utf-8')
          PY
      - name: Commit v2.52
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html styles.css game-detail-enhancement.css game-detail-enhancement.js live-static-update.js cpbl-cache-router.js service-worker.js rescue.html
          git commit -m "Release v2.52 desktop report layout and unified versioning"
          git push
