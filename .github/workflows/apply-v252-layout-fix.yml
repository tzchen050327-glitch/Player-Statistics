name: Apply v2.52 app version

on:
  push:
    paths:
      - '.github/v252-layout-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump app.js to v2.52
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text(encoding='utf-8')
          if 'v2.51' not in s:
              raise SystemExit('v2.51 not found in app.js')
          p.write_text(s.replace('v2.51','v2.52').replace('v251','v252').replace('V251','V252'), encoding='utf-8')
          PY
      - name: Commit app.js v2.52
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Bump app.js to v2.52"
          git push
