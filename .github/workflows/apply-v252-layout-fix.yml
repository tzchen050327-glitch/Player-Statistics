name: Sync v2.53 release assets

on:
  push:
    paths:
      - '.github/v253-layout-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync v2.53 version across runtime assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          current = [
              'app.js','index.html','styles.css','game-detail-enhancement.css',
              'game-detail-enhancement.js','live-static-update.js',
              'cpbl-cache-router.js','service-worker.js','rescue.html',
              'report-layout.css','report-layout.js'
          ]

          for name in current:
              p = Path(name)
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              s = s.replace('v2.52','v2.53').replace('v252','v253').replace('V252','V253')
              s = re.sub(r'\?v=v2\.53-[A-Za-z0-9._-]+','?v=v2.53',s)
              p.write_text(s,encoding='utf-8')

          idx = Path('index.html')
          s = idx.read_text(encoding='utf-8')
          if 'report-layout.css' not in s:
              s = s.replace(
                  '<link rel="stylesheet" href="./game-detail-enhancement.css?v=v2.53" />',
                  '<link rel="stylesheet" href="./game-detail-enhancement.css?v=v2.53" />\n  <link rel="stylesheet" href="./report-layout.css?v=v2.53" />'
              )
          if 'report-layout.js' not in s:
              s = s.replace(
                  '<script src="./game-detail-enhancement.js?v=v2.53"></script>',
                  '<script src="./game-detail-enhancement.js?v=v2.53"></script>\n  <script src="./report-layout.js?v=v2.53"></script>'
              )
          idx.write_text(s,encoding='utf-8')

          sw = Path('service-worker.js')
          s = sw.read_text(encoding='utf-8')
          s = re.sub(r"const CACHE_NAME = '[^']+';","const CACHE_NAME = 'baseball-player-card-pwa-v253';",s,count=1)
          s = re.sub(r"(\./(?:styles\.css|live-static-update\.js|app\.js|cpbl-cache-router\.js|game-detail-enhancement\.css|game-detail-enhancement\.js|report-layout\.css|report-layout\.js))\?v=[^']+",r"\1?v=v2.53",s)
          sw.write_text(s,encoding='utf-8')

          leftovers = []
          for name in current:
              p = Path(name)
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              if 'v2.52' in text or 'v252' in text or 'V252' in text:
                  leftovers.append(name)
          if leftovers:
              raise SystemExit('Old v2.52 token remains in: ' + ', '.join(leftovers))
          PY
      - name: Commit synchronized v2.53 release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html styles.css game-detail-enhancement.css game-detail-enhancement.js live-static-update.js cpbl-cache-router.js service-worker.js rescue.html report-layout.css report-layout.js
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Release v2.53 desktop field geometry and unified versioning"
            git push
          fi
