name: Apply v2.08 international total report

on:
  push:
    branches: [feature-v2.08-international-total-report]
    paths:
      - '.github/workflows/apply-v208-international-total-report.yml'

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-v2.08-international-total-report
      - name: Apply v2.08 patch and build
        run: python3 scripts/patch-v208-international-total-report.py
      - name: Syntax check modules and bundle
        run: |
          node --check app.js
          while IFS= read -r f; do
            [ -z "$f" ] || node --check "js/$f"
          done < js/module-order.txt
      - name: Validate international total report wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          bundle = Path('app.js').read_text(encoding='utf-8')
          html = Path('index.html').read_text(encoding='utf-8')
          sw = Path('service-worker.js').read_text(encoding='utf-8')
          assert "const APP_VERSION = 'v2.08';" in bundle
          assert '<meta name="app-version" content="v2.08" />' in html
          assert './app.js?v=v2.08' in html
          assert './app.js?v=v2.08' in sw
          assert "playerScopeCode !== 'international' || selectedTab === 'base'" in bundle
          assert "selectedTab === 'today' && !internationalSelectedGameKey" in bundle
          assert "preparedOutputKind = playerScope(player) === 'international' ? 'international-total' : 'season';" in bundle
          assert '賽事總戰績圖已準備完成' in bundle
          assert '賽事總投球戰績' in bundle and '賽事總打擊戰績' in bundle
          assert "storeRoleStatsProfile(player, year, 'A', hitterLocal, pitcherLocal);" in bundle
          assert Path('index v2.07.html').exists()
          assert Path('index v2.08.html').exists()
          assert not Path('index v2.06.html').exists()
          print('v2.08 international total report guards passed')
          PY
      - name: Verify deterministic bundle
        run: |
          cp app.js /tmp/app-committed.js
          python3 scripts/build-app.py
          cmp -s /tmp/app-committed.js app.js
      - name: Chrome smoke test
        run: |
          python3 -m http.server 8765 >/tmp/player-stats-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo 'Chrome unavailable; static checks passed.'
            exit 0
          fi
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=7000 --dump-dom http://127.0.0.1:8765/index.html >/tmp/dom.html
          grep -Fq 'id="seasonReportBtn"' /tmp/dom.html
          grep -Fq 'name="app-version" content="v2.08"' /tmp/dom.html
      - name: Commit v2.08
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js index.html 'index v2.08.html' service-worker.js js/00-core-config.js js/05-provider-international.js js/15-render-controller.js js/21-annual-report.js js/22-output-actions.js
          git add -u 'index v2.06.html'
          git commit -m 'v2.08 enable international total report images'
          git push origin HEAD:feature-v2.08-international-total-report
