name: Backend version sync v3.19

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backend-version-sync-v319.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump app version once
        shell: python
        run: |
          import json, re
          from pathlib import Path
          vp=Path('version.json')
          data=json.loads(vp.read_text(encoding='utf-8'))
          old=str(data['version'])
          m=re.fullmatch(r'v(\d+)\.(\d+)',old)
          if not m: raise SystemExit(old)
          new=f"v{int(m.group(1))}.{int(m.group(2))+1}"
          tag=f"v{m.group(1)}{int(m.group(2))+1}"
          vp.write_text(json.dumps({'version':new},ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          p=Path('index.html'); s=p.read_text(encoding='utf-8'); s=re.sub(r'(<meta\s+name="app-version"\s+content=")v\d+\.\d+("\s*/?>)',rf'\g<1>{new}\2',s,count=1); s=re.sub(r'\?v=v\d+\.\d+',f'?v={new}',s); s=re.sub(r'(id="appVersionBadge"[^>]*>)v\d+\.\d+(</button>)',rf'\g<1>{new}\2',s,count=1); p.write_text(s,encoding='utf-8')
          p=Path('app.js'); s=p.read_text(encoding='utf-8'); s=re.sub(r"const APP_VERSION = 'v\d+\.\d+';",f"const APP_VERSION = '{new}';",s,count=1); s=re.sub(r'\?v=v\d+\.\d+',f'?v={new}',s); p.write_text(s,encoding='utf-8')
          p=Path('service-worker.js'); s=p.read_text(encoding='utf-8'); s=re.sub(r'\?v=v\d+\.\d+',f'?v={new}',s); s=re.sub(r"const CACHE_NAME = '[^']+';",f"const CACHE_NAME = 'baseball-player-card-pwa-{tag}-auto';",s,count=1); p.write_text(s,encoding='utf-8')
          print(old,'->',new)
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json index.html app.js service-worker.js
          git commit -m "chore: sync version after CPBL lineup backend fix [skip version bump]" || exit 0
          git push
