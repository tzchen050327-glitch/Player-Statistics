name: Move cloud sync beside date

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/move-cloud-sync-header.yml'

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move cloud sync into header date controls
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cloud = Path('js/07a-cloud-sync.js')
          text = cloud.read_text(encoding='utf-8')
          text = text.replace("      const actions = document.getElementById('homeZoneSwitch');", "      const actions = document.getElementById('homeHeaderDateControl');", 1)
          text = text.replace("        button.className = 'home-zone-btn';", "        button.className = 'cloud-sync-header-btn';", 1)
          text = text.replace("        actions.appendChild(button);", "        actions.insertBefore(button, actions.firstChild);", 1)
          old = "        button.textContent = cloudSyncCredentials ? `雲端同步 · ${cloudSyncCredentials.code}` : '雲端同步';\n        button.title = cloudSyncCredentials\n          ? (cloudSyncLastError ? `同步異常：${cloudSyncLastError}` : `已連接｜最後同步 ${cloudSyncFormatTime(cloudSyncLastSuccessAt)}`)\n          : '設定指定裝置／帳號共用球員資料';"
          new = "        button.textContent = cloudSyncLastError ? '同步異常' : cloudSyncBusy ? '同步中' : cloudSyncCredentials ? '已同步' : '雲端同步';\n        button.classList.toggle('is-connected', Boolean(cloudSyncCredentials) && !cloudSyncLastError);\n        button.classList.toggle('is-error', Boolean(cloudSyncLastError));\n        button.classList.toggle('is-busy', Boolean(cloudSyncBusy));\n        button.title = cloudSyncCredentials\n          ? (cloudSyncLastError ? `同步異常：${cloudSyncLastError}` : `群組 ${cloudSyncCredentials.code}｜最後同步 ${cloudSyncFormatTime(cloudSyncLastSuccessAt)}`)\n          : '設定指定裝置／帳號共用球員資料';"
          if old not in text:
              raise SystemExit('cloud sync refresh anchor not found')
          text = text.replace(old, new, 1)
          text = text.replace('// app.js is loaded at the end of <body>, so the home action row already exists here.', '// app.js is loaded at the end of <body>, so the header controls already exist here.')
          cloud.write_text(text, encoding='utf-8')

          css = Path('styles.css')
          css_text = css.read_text(encoding='utf-8')
          css_text = css_text.replace('#homePage .home-root-switch{\n  grid-template-columns:repeat(3,minmax(0,1fr));\n  margin-bottom:10px;\n}', '#homePage .home-root-switch{\n  grid-template-columns:repeat(2,minmax(0,1fr));\n  margin-bottom:10px;\n}', 1)
          marker = '/* ===== CLOUD SYNC HEADER CONTROL ===== */'
          if marker not in css_text:
              css_text += "\n\n/* ===== CLOUD SYNC HEADER CONTROL ===== */\n.cloud-sync-header-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:30px;padding:4px 8px;border:1px solid rgba(255,255,255,.30);border-radius:9px;background:rgba(255,255,255,.14);color:#fff;box-shadow:none;font-size:12px;font-weight:800;white-space:nowrap;}\n.cloud-sync-header-btn::before{content:'☁';font-size:15px;line-height:1;}\n.cloud-sync-header-btn::after{content:'';width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.45);box-shadow:0 0 0 2px rgba(255,255,255,.10);}\n.cloud-sync-header-btn:hover{background:rgba(255,255,255,.22);}\n.cloud-sync-header-btn:active{transform:translateY(1px);}\n.cloud-sync-header-btn.is-connected::after{background:#35c46a;}\n.cloud-sync-header-btn.is-error::after{background:#ff6b6b;}\n.cloud-sync-header-btn.is-busy::after{background:#ffd166;animation:cloudSyncPulse 1s ease-in-out infinite;}\n@keyframes cloudSyncPulse{50%{opacity:.35;transform:scale(.8);}}\n@media(max-width:640px){.cloud-sync-header-btn{width:30px;min-width:30px;height:28px;min-height:28px;padding:3px;font-size:0;gap:0;}.cloud-sync-header-btn::before{font-size:16px;}.cloud-sync-header-btn::after{position:absolute;right:2px;top:2px;width:6px;height:6px;}}\n/* ===== CLOUD SYNC HEADER CONTROL END ===== */\n"
          css.write_text(css_text, encoding='utf-8')

          sw = Path('service-worker.js')
          sw_text = sw.read_text(encoding='utf-8').replace('baseball-player-card-pwa-v240-stable-3', 'baseball-player-card-pwa-v240-stable-4')
          sw.write_text(sw_text, encoding='utf-8')
          PY

          python3 scripts/build-app.py
          node --check app.js
          grep -q "const APP_VERSION = 'v2.40';" app.js
          grep -q "homeHeaderDateControl" js/07a-cloud-sync.js
          grep -q "repeat(2,minmax(0,1fr))" styles.css

      - name: Commit header cloud sync layout
        run: |
          git config user.name 'chatgpt-cloud-sync'
          git config user.email 'actions@users.noreply.github.com'
          git add js/07a-cloud-sync.js styles.css app.js service-worker.js
          git commit -m 'Move cloud sync beside date'
          git push
