<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>修復球員戰績圖片</title>
<style>
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#10243d;color:#fff}body{display:grid;place-items:center;min-height:100vh}.card{width:min(86vw,420px);padding:28px;border:1px solid #34506f;border-radius:20px;background:#17314f;box-shadow:0 20px 60px #0004}.title{font-size:24px;font-weight:800;margin-bottom:10px}.status{line-height:1.7;color:#c8d8ea}.bar{height:8px;border-radius:99px;background:#2a4665;overflow:hidden;margin-top:18px}.bar i{display:block;height:100%;width:20%;background:#fff;animation:run 1.2s infinite ease-in-out}@keyframes run{0%{transform:translateX(-120%)}100%{transform:translateX(520%)}}</style>
</head>
<body>
<div class="card"><div class="title">正在修復啟動環境</div><div id="status" class="status">正在解除舊版快取與 Service Worker…</div><div class="bar"><i></i></div></div>
<script>
(async()=>{
  const status=document.getElementById('status');
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.allSettled(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.allSettled(keys.filter(k=>k.startsWith('baseball-player-card-pwa-')).map(k=>caches.delete(k)));
    }
    try{sessionStorage.clear();}catch{}
    status.textContent='修復完成，正在重新開啟…';
  }catch(e){status.textContent='已略過無法清除的項目，正在重新開啟…';}
  const url=new URL('./index.html',location.href);
  url.searchParams.set('__clean_boot',Date.now().toString());
  setTimeout(()=>location.replace(url.href),500);
})();
</script>
</body>
</html>
