const rosterFor=name=>[...(ROSTERS_2026[name]?.players||[]),...(ROSTERS_2026[name+'::女子組']?.players||[])];
fetch('./data/black-panther-rosters-2026.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error('rosters pending');return r.json()}).then(data=>{if(data && typeof data==='object' && !Array.isArray(data)){Object.assign(ROSTERS_2026,data);for(const [officialKey,item] of Object.entries(data)){if(!item?.players?.length||!item.scheduleName)continue;const alias=item.scheduleName+(officialKey.endsWith('::女子組')?'::女子組':'');ROSTERS_2026[alias]=item;}if(tab==='teams')render()}}).catch(()=>{});
function rosterCard(name,isFemale=false){const entry=ROSTERS_2026[name+(isFemale?'::女子組':'')]||(!isFemale?ROSTERS_2026[name]:null);if(!entry)return '<div class="empty">此校球員名單尚未完成核對，暫不顯示未驗證資料。</div>';return '<div class="groupTitle">2026 正式球員名單 · '+entry.players.length+' 人</div><div class="roster-scroll"><table class="roster-table"><thead><tr><th>背號</th><th>球員</th><th>守位</th><th>投／打</th><th>身高</th><th>體重</th></tr></thead><tbody>'+entry.players.map(p=>'<tr><td>'+safe(p.number)+'</td><td><strong>'+safe(p.name)+'</strong></td><td>'+safe(p.position)+'</td><td>'+safe(p.hand)+'</td><td>'+p.height+'</td><td>'+p.weight+'</td></tr>').join('')+'</tbody></table></div><p class="muted">來源：<a target="_blank" rel="noopener" href="'+entry.source+'">中信盃黑豹旗官方球隊名單 ↗</a></p>';}
function renderTeamRoute(){
const t=selectedTeam,items=routeFor(t.name,t.isFemale),confirmed=items.filter(x=>x.depth===0),future=items.filter(x=>x.depth>0);
const names={players:'球員',schedule:'賽程',stats:'數據'};
const nav='<nav class="team-subtabs">'+Object.keys(names).map(k=>'<button type="button" class="'+(teamTab===k?'on':'')+'" onclick="teamTab=\''+k+'\';render()">'+names[k]+'</button>').join('')+'</nav>';
let content='';
if(teamTab==='players'){
const entry=ROSTERS_2026[t.name+(t.isFemale?'::女子組':'')]||(!t.isFemale?ROSTERS_2026[t.name]:null),players=entry?.players||[];
content=entry ? ['P','C','IF','OF'].map(group=>{
const part=players.filter(p=>String(p.position).split('/')[0].trim()===group);
if(!part.length)return '';
return '<div class="groupTitle">'+group+' · '+part.length+' 人</div><div class="roster-scroll"><table class="roster-table"><thead><tr><th>背號</th><th>球員</th><th>守位</th><th>投／打</th><th>身高</th><th>體重</th></tr></thead><tbody>'+part.map(p=>'<tr><td>'+safe(p.number)+'</td><td><strong>'+safe(p.name)+'</strong></td><td>'+safe(p.position)+'</td><td>'+safe(p.hand)+'</td><td>'+p.height+'</td><td>'+p.weight+'</td></tr>').join('')+'</tbody></table></div>';
}).join('')+'<p class="muted">來源：<a target="_blank" rel="noopener" href="'+entry.source+'">黑豹旗官方球員名單 ↗</a></p>':rosterCard(t.name,t.isFemale);
}else if(teamTab==='schedule'){
content='<p class="muted">以下晉級場次須持續獲勝才會出賽。</p><div class="groupTitle">已確定的首場賽事 · '+confirmed.length+' 場</div>'+confirmed.map(x=>routeCard(x.game,false,t.name)).join('')+'<div class="groupTitle">如果一路晉級 · '+future.length+' 場</div>'+future.map(x=>routeCard(x.game,true,t.name)).join('');
}else content='<div class="empty">官方尚未提供可核實的 2026 球員與球隊賽事成績，開賽後再更新。</div>';
return '<button class="back" onclick="selectedTeam=null;render()">← 返回球隊列表</button><h2>'+safe(t.name)+' <span class="muted">'+(t.isFemale?'女子組':'混合組')+'</span></h2>'+nav+content;
}
function routeCard(x,hypothetical,name){let opponent=x.home===name?x.away:x.away===name?x.home:(x.home.includes('勝')&&x.away.includes('勝')?'由前場勝方決定':`${x.home}／${x.away}`);return `<article class="match" onclick="openMatch('${x.id}')"><div class="meta"><span><b class="gold">${fmt(x.date)} ${x.time}</b>　${safe(venueFull(x.venue))}</span><span>${safe(x.id)} · ${safe(round(x))}</span></div><div class="teams"><div class="team">${hypothetical?'晉級後可能出賽':safe(name)}</div><div class="vs">→</div><div class="team right">${hypothetical?'待晉級確認':safe(opponent)}</div></div><div class="chips"><span class="chip">${hypothetical?'可能出賽':'首戰'}</span><span class="chip">${safe(x.home)} vs ${safe(x.away)}</span></div></article>`;}
function render(){void loadOfficialScore(relevantScoreDate());document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.tab===tab));let root=$('#content');if(selectedTeam){root.innerHTML=renderTeamRoute();return;}if(selected){let x=selected;root.innerHTML=`<button class="back" onclick="selected=null;render()">← 返回${tab==='schedule'?'賽程':'列表'}</button><h2>場次 ${x.id}</h2><div class="detail"><div class="meta"><span>${x.date}　${x.time}</span><span>${round(x)}</span></div><div class="teams"><div class="team">${teamClickable(x.home,x.female)}</div><div class="vs">VS</div><div class="team right">${teamClickable(x.away,x.female)}</div></div><div class="info"><span>比賽球場</span><strong>${venueFull(x.venue)}</strong></div><div class="info"><span>地點</span><strong>${venueCity(x.venue)}</strong></div><a class="mapLink" href="${venueLink(x.venue)}" target="_blank" rel="noopener">查看球場地圖 ↗</a><div class="info"><span>轉播</span><strong>${x.tv?'有轉播':'未標示'}</strong></div><div class="info"><span>組別</span><strong>${x.female?'女子組':'混合組'}</strong></div><div class="info"><span>比分</span><strong>${scoreFull(x)}</strong></div><div class="info"><span>來源</span><a href="${officialGameUrl(x)}" target="_blank" rel="noopener">黑豹旗官網 ↗</a></div>${scoreHighlights(x)}</div>`;return;}if(tab==='schedule'){let set=filteredMatches();root.innerHTML=`<h2>全部賽程 <span class="muted"><span id="resultCount">${set.length} 場</span></span></h2>${searchField("搜尋球隊、場次、球場")}<div class="toolbar"><select onchange="day=this.value;render()"><option value="all">全部日期</option>${dates.map(d=>`<option value="${d}" ${day===d?'selected':''}>${fmt(d)}</option>`).join('')}</select><select onchange="phase=this.value;render()"><option value="all">全部階段</option>${['預賽','女子組','六十四強','三十二強','十六強','八強','四強','冠軍戰'].map(v=>`<option ${phase===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="toolbar"><select onchange="venue=this.value;render()"><option value="all">全部球場</option>${Object.keys(VENUES).map(v=>`<option value="${v}" ${venue===v?'selected':''}>${venueFull(v)}</option>`).join('')}</select></div><div id="searchResults">${set.length?groupByDate(set):'<div class="empty">找不到符合條件的場次</div>'}</div>`;}else if(tab==='venues'){root.innerHTML=`<h2>比賽球場 <span class="muted">${Object.keys(VENUES).length} 座</span></h2>${Object.keys(VENUES).map(v=>`<div class="venueCard"><div class="venueName">${venueFull(v)}</div><div class="muted">${venueCity(v)} · ${all.filter(x=>x.venue===v).length} 場已排定</div><div class="venueActions"><button onclick="venue='${v}';day='all';phase='all';filter='';setTab('schedule')">查看賽程</button><a href="${venueLink(v)}" target="_blank" rel="noopener">地圖 ↗</a></div></div>`).join('')}<p class="muted">地圖以球場名稱搜尋；出發前請確認入口。</p>`;}else if(tab==='teams'){root.innerHTML=`<h2>球隊 <span class="muted">${physicalTeams.length} 所</span></h2>${searchField('搜尋學校')}<div id="searchResults">${teamOptions()}</div>`;}else if(tab==='bracket'){root.innerHTML=`<h2>淘汰賽對戰路線</h2><div class="toolbar"><button class="pill ${phase==='all'?'on':''}" onclick="phase='all';render()">所有輪次</button></div>${['六十四強','三十二強','十六強','八強','四強','冠軍戰'].map(p=>`<div class="groupTitle">${p}</div>${all.filter(x=>round(x)===p).map(match).join('')}`).join('')}`;}else{root.innerHTML=`<h2>球隊排名</h2><div class="empty">目前尚無可核實的球隊排名資料，待官方戰績或淘汰賽結果公布後更新。</div>`;}}function groupByDate(items){return dates.filter(d=>items.some(x=>x.date===d)).map(d=>`<div class="groupTitle">${fmt(d)}　${items.filter(x=>x.date===d).length} 場</div>${items.filter(x=>x.date===d).map(match).join('')}`).join('')}function renderKeepFocus(){let pos=$('#search')?.selectionStart;render();let el=$('#search');if(el){el.focus();el.setSelectionRange(pos,pos)}}render();setInterval(()=>{if(document.visibilityState==='visible'&&supportedScoreDays.has(taiwanToday()))void loadOfficialScore(taiwanToday(),true)},120000);</script></body></html>
